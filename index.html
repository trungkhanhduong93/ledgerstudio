                                                <span>{warehouseLoading ? 'Đang tải' : isTabDirty('warehouse') ? 'Áp dụng bộ lọc' : 'Truy vấn'}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 min-h-0 p-3 overflow-hidden bg-canvas flex flex-col relative">
                                {warehouseLoading && <div className="ds-loading"><div className="ds-loadbar"></div><div className="ds-loadpill"><Icon name="loader" size={14} className="animate-spin"/>Đang truy vấn dữ liệu...</div></div>}
                                

                                <div className="ds-groupzone"
                                    onDragOver={e => e.preventDefault()}
                                    onDrop={e => {
                                        e.preventDefault();
                                        let col = e.dataTransfer.getData('text/plain');
                                        if (!col) col = e.dataTransfer.getData('col');
                                        if (col && !groupByWarehouse.includes(col)) setGroupByWarehouse([...groupByWarehouse, col]);
                                        
                                        const fromIdx = e.dataTransfer.getData('reorder');
                                        if (fromIdx !== '') {
                                            const arr = [...groupByWarehouse];
                                            const item = arr.splice(parseInt(fromIdx), 1)[0];
                                            arr.push(item);
                                            setGroupByWarehouse(arr);
                                        }
                                    }}
                                >
                                    <div className="flex items-center text-ink-3">
                                        <Icon name="sliders" size={12}/>
                                    </div>
                                    <span className="font-medium text-ink-2">Gom nhóm</span>
                                    {groupByWarehouse.length === 0 ? <span className="text-ink-4">— kéo tiêu đề cột thả vào đây</span> : null}
                                    {groupByWarehouse.map((g, i) => (
                                        <div key={g} 
                                            draggable
                                            onDragStart={e => { e.stopPropagation(); e.dataTransfer.setData('reorder', i.toString()); }}
                                            onDragOver={e => e.preventDefault()}
                                            onDrop={e => {
                                                e.stopPropagation();
                                                e.preventDefault();
                                                const fromIdx = e.dataTransfer.getData('reorder');
                                                if (fromIdx !== '') {
                                                    const arr = [...groupByWarehouse];
                                                    const item = arr.splice(parseInt(fromIdx), 1)[0];
                                                    arr.splice(i, 0, item);
                                                    setGroupByWarehouse(arr);
                                                } else {
                                                    let col = e.dataTransfer.getData('text/plain');
                                                    if (!col) col = e.dataTransfer.getData('col');
                                                    if (col && !groupByWarehouse.includes(col)) {
                                                        const arr = [...groupByWarehouse];
                                                        arr.splice(i, 0, col);
                                                        setGroupByWarehouse(arr);
                                                    }
                                                }
                                            }}
                                            className="ds-gchip">
                                            {g}
                                            <button onClick={() => setGroupByWarehouse(groupByWarehouse.filter(x => x !== g))} title="Bỏ gom nhóm cột này"><Icon name="x" size={12} stroke={2.5}/></button>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex-1 min-h-0 bg-white border border-line rounded-[10px] overflow-hidden flex flex-col">
                                    <div className="flex-1 min-h-0 overflow-auto custom-scrollbar" ref={warehouseScrollRef}>
                                        <table className="ds-grid w-max border-collapse" style={{ width: 'max-content', minWidth: '100%' }}>
                                            <GridHead grid={WAREHOUSE_GRID} cols={warehouseLay.cols} sort={warehouseSort} onSort={f => setWarehouseSort(s => cycleSort(s, f))} onMove={warehouseLay.move} search={warehouseColSearch} setSearch={setWarehouseColSearch} lay={warehouseLay} />
                                            <tbody>
                                                <VirtualRows data={warehouseFlatData} rowHeight={warehouseRowHeight} scrollRef={warehouseScrollRef} renderRow={(row, i) => (
                                                    row.isGroup ?
                                                    <GridGroupRow key={row.id} grid={WAREHOUSE_GRID} cols={warehouseLay.cols} node={row} toggleExpand={handleToggleWarehouseGroup} /> :
                                                    <GridRow key={i} grid={WAREHOUSE_GRID} cols={warehouseLay.cols} r={row} idx={i + 1} />
                                                )} />
                                            </tbody>
                                            <GridFoot cols={warehouseLay.cols} trClass="text-slate-800 font-black text-[12px] bg-slate-50/95" labelClass="border-r text-right px-4 py-3 uppercase text-[10px] text-slate-400"
                                                label={warehouseFoot ? footShownLabel(warehouseShown.length) : `Tổng toàn bộ truy vấn (${Number(warehousePagination.total_rows||0).toLocaleString()} dòng):`}
                                                cells={footCells(WAREHOUSE_GRID, warehouseFoot || warehouseSummary)} />
                                        </table>
                                    </div>
                                    <div className="ds-pager">
                                        <div className="flex items-center gap-8">
                                            <ColumnConfigurator grid={WAREHOUSE_GRID} lay={warehouseLay} data={warehouseFlatData} />
                                        </div>
                                        <div className="flex items-center gap-6">
                                                <div className="flex items-center gap-2">
                                                    <PageJumper page={warehousePagination.page} totalPages={warehousePagination.total_pages} onGoto={p => loadWarehouseData(p)} />
                                                </div>
                                            </div>
                                        <div className="flex flex-col items-end">
                                            
                                            <span className="ds-meta">
                                                {isWarehouseGroupedOrSearched ? `${warehouseData.length.toLocaleString()} dòng | Gom nhóm & tìm kiếm` : `Trang ${warehousePagination.page} / ${warehousePagination.total_pages}`}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </>
                    )}

                    {activeTab === 'warehouse_balance' && (
                        <>
                            <div className="bg-white border-b border-slate-200 px-6 pt-2 pb-3 shrink-0 z-[900]">
                                <div className="space-y-2">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <div className="ds-slot">{timeFilter}</div>
                                        <FilterConfigurator tab="warehouse_balance" defaultOutside={["filters.org_ids"]} onApply={() => loadWarehouseBalanceData()} setActiveDropdown={setActiveDropdown} items={[
                                            { key: 'filters.org_ids', label: 'Đơn vị', active: filters.org_ids.length > 0, clear: () => setFilters(p => ({ ...p, org_ids: [] })),
                                              node: <PremiumDropdown label="Đơn vị" items={meta.orgs} selectedItems={filters.org_ids} onSelect={id => toggleFilter('org_ids', id)} isActive={activeDropdown === 'Đơn vị'} onToggle={setActiveDropdown} /> },
                                            { key: 'warehouseBalanceFilters.wh_ids', label: 'Kho', active: warehouseBalanceFilters.wh_ids.length > 0, clear: () => setWarehouseBalanceFilters(p => ({ ...p, wh_ids: [] })),
                                              node: <PremiumDropdown label="Kho" items={meta.warehouses} selectedItems={warehouseBalanceFilters.wh_ids} onSelect={id => toggleWarehouseBalanceFilter('wh_ids', id)} isActive={activeDropdown === 'Kho'} onToggle={setActiveDropdown} /> },
                                            { key: 'filters.item_ids', label: 'Hàng hóa', active: filters.item_ids.length > 0, clear: () => setFilters(p => ({ ...p, item_ids: [] })),
                                              node: <PremiumDropdown label="Hàng hóa" items={meta.items} selectedItems={filters.item_ids} onSelect={id => toggleFilter('item_ids', id)} isActive={activeDropdown === 'Hàng hóa'} onToggle={setActiveDropdown} /> },
                                            { key: 'filters.acc_ids', label: 'Tài khoản', active: filters.acc_ids.length > 0, clear: () => setFilters(p => ({ ...p, acc_ids: [] })),
                                              node: <PremiumDropdown label="Tài khoản" items={meta.accounts} codePrefix selectedItems={filters.acc_ids} onSelect={id => toggleFilter('acc_ids', id)} isActive={activeDropdown === 'Tài khoản'} onToggle={setActiveDropdown} align="right" /> },
                                        ]} />
                                        <div className="ml-auto flex items-center gap-2">
                                            <PageSizeDropdown
                                                        value={filters.page_size}
                                                        onChange={newSize => { setFilters(p => ({ ...p, page_size: newSize, page: 1 })); }}
                                                    />
                                            <span className="ds-meta"><b>{warehouseBalancePagination.total_rows?.toLocaleString()}</b> dòng</span>
                                            <ExportButton kind="warehouse_balance" {...exportBtn} />
                                            <button 
                                                onClick={() => loadWarehouseBalanceData()} 
                                                disabled={warehouseBalanceLoading} 
                                                title={isTabDirty('warehouse_balance') ? 'Bộ lọc đã thay đổi! Nhấn để áp dụng bộ lọc mới' : 'Truy vấn dữ liệu'}
                                                className={`ds-btn ds-btn-pri ${isTabDirty('warehouse_balance') ? 'ds-btn-need-query' : ''}`}
                                            >
                                                {isTabDirty('warehouse_balance') && <span className="ds-btn-dirty-dot" />}
                                                {warehouseBalanceLoading ? <Icon name="loader" size={14} className="animate-spin" /> : <Icon name="search" size={14} stroke={2} />}
                                                <span>{warehouseBalanceLoading ? 'Đang tải' : isTabDirty('warehouse_balance') ? 'Áp dụng bộ lọc' : 'Truy vấn'}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 min-h-0 p-3 overflow-hidden bg-canvas flex flex-col relative">
                                {warehouseBalanceLoading && <div className="ds-loading"><div className="ds-loadbar"></div><div className="ds-loadpill"><Icon name="loader" size={14} className="animate-spin"/>Đang truy vấn dữ liệu...</div></div>}
                                <div className="flex-1 min-h-0 bg-white border border-line rounded-[10px] overflow-hidden flex flex-col">
                                    <div className="flex-1 min-h-0 overflow-auto custom-scrollbar" ref={warehouseBalanceScrollRef}>
                                        <table className="ds-grid w-max border-collapse" style={{ width: 'max-content', minWidth: '100%' }}>
                                            <GridHead grid={WAREHOUSE_BALANCE_GRID} cols={warehouseBalanceLay.cols} sort={warehouseBalanceSort} onSort={f => setWarehouseBalanceSort(s => cycleSort(s, f))} onMove={warehouseBalanceLay.move} search={warehouseBalanceColSearch} setSearch={setWarehouseBalanceColSearch} lay={warehouseBalanceLay} />
                                            <tbody>
                                                <VirtualRows data={warehouseBalanceFlatData} rowHeight={28} scrollRef={warehouseBalanceScrollRef} renderRow={(row, i) => (
                                                    <GridRow key={i} grid={WAREHOUSE_BALANCE_GRID} cols={warehouseBalanceLay.cols} r={row} idx={i + 1} />
                                                )} />
                                            </tbody>
                                            <GridFoot cols={warehouseBalanceLay.cols} trClass="text-slate-800 font-black text-[12px] bg-slate-50/95" labelClass="border-r text-right px-4 py-3 uppercase text-[10px] text-slate-400"
                                                label={warehouseBalanceFoot ? footShownLabel(warehouseBalanceFlatData.length) : `Tổng toàn bộ truy vấn (${Number(warehouseBalancePagination.total_rows||0).toLocaleString()} dòng):`}
                                                cells={footCells(WAREHOUSE_BALANCE_GRID, warehouseBalanceFoot || warehouseBalanceSummary)} />
                                        </table>
                                    </div>
                                    <div className="ds-pager">
                                        <div className="flex items-center gap-8">
                                            <ColumnConfigurator grid={WAREHOUSE_BALANCE_GRID} lay={warehouseBalanceLay} data={warehouseBalanceFlatData} />
                                        </div>
                                        <div className="flex items-center gap-6">
                                            <div className="flex items-center gap-2">
                                                <PageJumper page={warehouseBalancePagination.page} totalPages={warehouseBalancePagination.total_pages} onGoto={p => loadWarehouseBalanceData(p)} />
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end">
                                            
                                            <span className="ds-meta">
                                                Trang {warehouseBalancePagination.page} / {warehouseBalancePagination.total_pages}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </>
                    )}

                    {activeTab === 'pr_detail' && (
                        <>
                            <div className="bg-white border-b border-slate-200 px-6 pt-2 pb-3 shrink-0 z-[900]">
                                <div className="space-y-2">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <div className="relative">
                                            <Icon name="search" size={14} stroke={2} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-4 pointer-events-none"/>
                                            <input
                                                type="text"
                                                value={prDetailFilters.search}
                                                onChange={e => setPrDetailFilters(p => ({ ...p, search: e.target.value }))}
                                                onKeyDown={e => { if (e.key === 'Enter') loadPrDetailData(1, prDetailPageSize); }}
                                                placeholder="Tìm mã, tên, MST, SĐT, số TK..."
                                                className={`ds-input pl-8 w-64 ${prDetailFilters.search ? 'is-on' : ''}`}
                                            />
                                        </div>

                                        {meta.pr_detail_classes && meta.pr_detail_classes.length > 0 && (
                                            <PremiumDropdown
                                                label="Nhóm đối tượng"
                                                items={meta.pr_detail_classes}
                                                selectedItems={prDetailFilters.class_ids}
                                                onSelect={id => togglePrDetailFilter('class_ids', id)}
                                                isActive={activeDropdown === 'Nhóm đối tượng'}
                                                onToggle={setActiveDropdown}
                                            />
                                        )}

                                        <div className="flex items-center gap-2">
                                            <span className="ds-seglabel">Trạng thái</span>
                                            <div className="ds-seg">
                                                {[['1','Đang dùng'],['0','Ngừng'],['','Tất cả']].map(([v,l]) => (
                                                    <button
                                                        key={v+'pd'}
                                                        onClick={() => {
                                                            setPrDetailFilters(p => ({ ...p, active: v }));
                                                        }}
                                                        className={prDetailFilters.active === v ? 'is-on' : ''}
                                                    >
                                                        {l}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div className="ml-auto flex items-center gap-2">
                                            <PageSizeDropdown value={prDetailPageSize} onChange={newSize => { setPrDetailPageSize(newSize); loadPrDetailData(1, newSize); }} />
                                            <span className="ds-meta"><b>{prDetailPagination.total_rows?.toLocaleString()}</b> đối tượng</span>
                                            <ExportButton kind="pr_detail" {...exportBtn} />
                                            <button 
                                                onClick={() => loadPrDetailData(1, prDetailPageSize)} 
                                                disabled={prDetailLoading} 
                                                title={isTabDirty('pr_detail') ? 'Bộ lọc đã thay đổi! Nhấn để áp dụng bộ lọc mới' : 'Truy vấn danh mục đối tượng'}
                                                className={`ds-btn ds-btn-pri ${isTabDirty('pr_detail') ? 'ds-btn-need-query' : ''}`}
                                            >
                                                {isTabDirty('pr_detail') && <span className="ds-btn-dirty-dot" />}
                                                {prDetailLoading ? <Icon name="loader" size={14} className="animate-spin" /> : <Icon name="search" size={14} stroke={2} />}
                                                <span>{prDetailLoading ? 'Đang tải' : isTabDirty('pr_detail') ? 'Áp dụng bộ lọc' : 'Truy vấn'}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 min-h-0 p-3 overflow-hidden bg-canvas flex flex-col relative">
                                {prDetailLoading && <div className="ds-loading"><div className="ds-loadbar"></div><div className="ds-loadpill"><Icon name="loader" size={14} className="animate-spin"/>Đang truy vấn danh mục đối tượng...</div></div>}
                                <div className="flex-1 min-h-0 bg-white border border-line rounded-[10px] overflow-hidden flex flex-col mt-1">
                                    <div className="flex-1 min-h-0 overflow-auto custom-scrollbar" ref={prDetailScrollRef}>
                                        <table className="ds-grid w-max border-collapse" style={{ width: 'max-content', minWidth: '100%' }}>
                                            <GridHead grid={PR_DETAIL_GRID} cols={prDetailLay.cols} sort={prDetailSort} onSort={f => setPrDetailSort(s => cycleSort(s, f))} onMove={prDetailLay.move} search={prDetailColSearch} setSearch={setPrDetailColSearch} lay={prDetailLay} />
                                            <tbody>
                                                {prDetailFlatData.length === 0 ? (
                                                    <tr>
                                                        <td colSpan={prDetailLay.cols.length + 1} className="text-center py-12 text-ink-3">
                                                            {prDetailLoading ? 'Đang truy vấn dữ liệu...' : 'Chưa có dữ liệu. Vui lòng nhấn nút "Truy vấn" để tải danh mục đối tượng.'}
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    <VirtualRows data={prDetailFlatData} rowHeight={28} scrollRef={prDetailScrollRef} renderRow={(row, i) => (
                                                        <GridRow key={i} grid={PR_DETAIL_GRID} cols={prDetailLay.cols} r={row} idx={i + 1} />
                                                    )} />
                                                )}
                                            </tbody>
                                            <tfoot className="sticky-footer">
                                                <tr className="text-slate-800 font-semibold text-[12px] bg-slate-50/95">
                                                    <td colSpan={Math.min(4, prDetailLay.cols.length + 1)} className="border-r px-4 py-2.5 text-left text-ink-2">
                                                        Tổng số: <b className="font-bold text-ink">{prDetailPagination.total_rows?.toLocaleString()}</b> đối tượng
                                                        {prDetailSummary.active_count > 0 && (
                                                            <span className="ml-4 text-emerald-700">
                                                                ● Đang dùng: <b>{prDetailSummary.active_count?.toLocaleString()}</b>
                                                            </span>
                                                        )}
                                                        {prDetailSummary.inactive_count > 0 && (
                                                            <span className="ml-4 text-rose-600">
                                                                ● Ngừng: <b>{prDetailSummary.inactive_count?.toLocaleString()}</b>
                                                            </span>
                                                        )}
                                                    </td>
                                                    {prDetailLay.cols.length > 3 && <td colSpan={prDetailLay.cols.length - 3}></td>}
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                    <div className="ds-pager">
                                        <div className="flex items-center gap-8">
                                            <ColumnConfigurator grid={PR_DETAIL_GRID} lay={prDetailLay} data={prDetailFlatData} />
                                        </div>
                                        <div className="flex items-center gap-6">
                                            <div className="flex items-center gap-2">
                                                <PageJumper page={prDetailPagination.page} totalPages={prDetailPagination.total_pages} onGoto={p => loadPrDetailData(p, prDetailPageSize)} />
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end">
                                            <span className="ds-meta">
                                                Trang {prDetailPagination.page} / {prDetailPagination.total_pages}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </>
                    )}

                    {activeTab === 'report' && (
                        <div className="flex-1 flex flex-col relative overflow-hidden">
                            <ReportTab
                                filters={filters}
                                setFilters={setFilters}
                                period={period}
                                timeMode={timeMode}
                                setTimeMode={setTimeMode}
                                meta={meta}
                                onToggleFilter={toggleFilter}
                                activeDropdown={activeDropdown}
                                setActiveDropdown={setActiveDropdown}
                                reportData={reportData}
                                loadReportData={loadReportData}
                                loading={loading}
                                monthList={monthList}
                                monthlyData={monthlyData}
                                jobList={jobList}
                                jobData={jobData}
                                reportType={reportType}
                                setReportType={setReportType}
                                setPendingReportType={setPendingReportType}
                                setShowClearModal={setShowClearModal}
                                trialBalanceData={trialBalanceData}
                                trialBalanceTotal={trialBalanceTotal}
                                cashBookData={cashBookData}
                                vatSalesTotals={vatSalesTotals}
                                journalViewMode={journalViewMode}
                                setJournalViewMode={setJournalViewMode}
                                vatSalesMode={vatSalesMode}
                                nxtMode={nxtMode}
                                vatKind={vatKind}
                                onVatView={changeVatView}
                                showNotice={showNotice}
                                isDirty={isTabDirty('report')}
                            />
                        </div>
                    )}
                    {/* Hộp "Thư mục lưu file" (v1.10.9) — mở qua askExportDir() từ menu Xuất Excel / hộp Xuất báo cáo, nằm trên mọi hộp khác */}
                    <ExportDirHost />
                    {/* Hộp Xuất danh sách (8 tab dữ liệu, v1.12.1) — cùng hộp với Xuất báo cáo */}
                    <ReportExportDialog open={!!listExport} onClose={() => setListExport(null)} cfg={listExportCfg} />

                    {showClearModal && (
                        <div className="ds-scrim z-[9999]">
                            <div className="ds-dialog" role="dialog" aria-modal="true">
                                <div className="ds-dlg-head items-center">
                                    <div className="ds-dlg-ic is-warn"><Icon name="alert-circle" size={18} stroke={2} /></div>
                                    <h2>Chuyển mẫu báo cáo?</h2>
                                </div>
                                <div className="ds-dlg-body">Nội dung báo cáo hiện tại sẽ bị xóa. Bạn cần phải tải lại báo cáo nếu muốn quay lại mẫu cũ.</div>
                                <div className="ds-dlg-foot">
                                    <button onClick={() => setShowClearModal(false)} className="ds-btn">Hủy</button>
                                    <button onClick={() => { setReportType(pendingReportType); setReportData({}); setMonthList([]); setMonthlyData({}); setJobList([]); setJobData({}); setShowClearModal(false); }} className="ds-btn ds-btn-pri">Xác nhận</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {noticeModal && (
                        <div className="ds-scrim z-[99999]" onClick={() => setNoticeModal(null)}>
                            <div className="ds-dialog" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
                                <div className="ds-dlg-head items-center">
                                    <div className="ds-dlg-ic is-warn"><Icon name="alert-circle" size={18} stroke={2} /></div>
                                    <h3>{noticeModal.title || 'Thông báo'}</h3>
                                </div>
                                <div className="ds-dlg-body"><ErrText text={noticeModal.message} /></div>
                                <div className="ds-dlg-foot">
                                    <button type="button" onClick={() => setNoticeModal(null)} className="ds-btn ds-btn-pri">Đã hiểu</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <AutoUpdateModal isUpdating={autoUpdate.isUpdating} progress={autoUpdate.progress} onClose={() => autoUpdate.setIsUpdating(false)} />
                    </div>
                    </div>
                    <AppStatusBar meta={meta} filters={filters} appVersion={appVersion}
                        timing={activeTab === 'ledger' ? queryTiming : activeTab === 'income_alloc_month' ? incomeMonthTiming : null} />
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
