            // Sort state cho 3 danh sách. field=null → dùng default backend.
            const [ledgerSort, setLedgerSort]       = useState({ field: null, dir: 'desc' });
            

            const [purchaseSort, setPurchaseSort]   = useState({ field: null, dir: 'desc' });
            const [warehouseSort, setWarehouseSort] = useState({ field: null, dir: 'desc' });

            const cycleSort = (cur, field) => {
                // null → desc → asc → null
                if (cur.field !== field) return { field, dir: 'desc' };
                if (cur.dir === 'desc')  return { field, dir: 'asc' };
                return { field: null, dir: 'desc' };
            };

            const [loginData, setLoginData] = useState({ driver: "SQL Server", server: localStorage.getItem("iacc_server") || "", database: localStorage.getItem("iacc_db") || "", user: "", password: "" });
            const [showDriverDialog, setShowDriverDialog] = useState(false);
            const [driverInstalling, setDriverInstalling] = useState(false);
            const [driverDropdownOpen, setDriverDropdownOpen] = useState(false);
            const driverOptions = [
                { value: "ODBC Driver 17 for SQL Server", label: "ODBC Driver 17 for SQL Server" },
                { value: "ODBC Driver 13 for SQL Server", label: "ODBC Driver 13 for SQL Server" },
                { value: "SQL Server", label: "SQL Server (mặc định)" }
            ];

            // AbortController để hủy request cũ khi có request mới
            const abortRef = useRef(null);

            // Debounce colSearch 400ms — chờ người dùng ngừng gõ mới bắn query
            const debouncedColSearch = useDebounce(colSearch, 400);

            useEffect(() => {
                // Check driver khi app load
                // .catch bắt buộc: server tắt/chưa sẵn sàng -> hiện banner "Mất kết nối", KHÔNG để
                // rơi xuống handler unhandledrejection (đổ stack trace đỏ ra màn hình người dùng).
                fetch('/api/check_driver').then(r => r.json()).then(res => {
                    if (!res.has_driver) {
                        setShowDriverDialog(true);
                    }
                }).catch(err => { if (window.isNetworkError(err)) window.showConnectionLost(); });

                fetch('/api/metadata').then(r => {
                    if (r.status === 401) { setIsLoggedIn(false); }
                    else return r.json();
                }).then(res => { if(res) { setMeta(res); setIsLoggedIn(true); } })
                  .catch(err => { if (window.isNetworkError(err)) window.showConnectionLost(); });
            }, []);

            useEffect(() => {
                if (period.type === 'custom') return;
                const { year, type, value } = period;
                let s, e;
                if (type==='month') { s = new Date(year, value-1, 1); e = new Date(year, value, 0); }
                else if (type==='quarter') { s = new Date(year, (value-1)*3, 1); e = new Date(year, value*3, 0); }
                else { s = new Date(year, 0, 1); e = new Date(year, 11, 31); }
                const f = (d) => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
                setFilters(p => ({ ...p, from_date: f(s), to_date: f(e) }));
            }, [period]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginLoading(true);
                setLoginError("");
                try {
                    const r = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(loginData)
                    });
                    const res = await r.json();
                    if (res.status === 'ok') {
                        localStorage.setItem("iacc_server", loginData.server);
                        localStorage.setItem("iacc_db", loginData.database);
                        setIsLoggedIn(true);
                        const metaRes = await fetch('/api/metadata').then(r => r.json());
                        setMeta(metaRes);
                    } else {
                        setLoginError(res.message);
                    }
                } catch (err) {
                    setLoginError("Không thể kết nối đến Server Python.");
                } finally {
                    setLoginLoading(false);
                }
            };

            const handleLogout = async () => {
                await fetch('/api/logout', { method: 'POST' });
                setIsLoggedIn(false);
                setMeta({ accounts: [], orgs: [], pr_details: [], tran_ids: [], jobs: [], items: [], products: [], expenses: [], warehouses: [], db_info: {}, global_total: 0 });
            };

            // Chọn báo cáo ở thanh bên — cùng luật với dropdown "Mẫu báo cáo" trong ReportTab:
            // đang có dữ liệu mà đổi sang mẫu khác thì hỏi xác nhận (showClearModal) trước khi xoá.
            const pickReport = (type) => {
                setActiveTab('report');
                if (type !== reportType && Object.keys(reportData).length > 0) { setPendingReportType(type); setShowClearModal(true); }
                else { setReportType(type); }
            };

            const refreshMeta = async () => {
                setRefreshing(true);
                try {
                    await fetch('/api/metadata/refresh', { method: 'POST' });
                    const res = await fetch('/api/metadata').then(r => r.json());
                    if (res.status === 'ok') {
                        setMeta(res);
                        // Hiệu ứng "Done" nhẹ
                        const btn = document.getElementById('btn-refresh-meta');
                        if(btn) {
                            btn.classList.add('bg-emerald-500/20', 'text-emerald-400');
                            setTimeout(() => btn.classList.remove('bg-emerald-500/20', 'text-emerald-400'), 2000);
                        }
                    }
                } finally {
                    setRefreshing(false);
                }
            };

            const loadData = async (targetPage = 1, targetPageSize = filters.page_size, searchOverride = null, opts = {}) => {
                // Hủy request đang chạy nếu có
                if (abortRef.current) abortRef.current.abort();
                const _ctrl = new AbortController(); abortRef.current = _ctrl;

                setLoading(true);
                const cs = searchOverride !== null ? searchOverride : colSearch;
                // Các field TEXT dài cần tối thiểu 2 ký tự để tránh scan toàn bảng
                // Các field ID ngắn cho phép 1 ký tự (ví dụ: gõ "5" tìm TK bắt đầu bằng 5)
                const LONG_FIELDS = new Set(['s_desc','s_pr_name','s_exp_name','s_org_name','s_item_name','s_prod_name','tran_no']);
                const take = (key, val) => {
                    const v = (val || '').trim();
                    if (!v) return null;
                    if (LONG_FIELDS.has(key) && v.length < 2) return null;
                    return v;
                };
                const searchParams = {
                    s_date:     take('s_date',     cs.TRAN_DATE),
                    tran_no:    take('tran_no',    cs.TRAN_NO),
                    s_tran_id:  take('s_tran_id',  cs.TRAN_ID),
                    s_acc_id:   take('s_acc_id',   cs.ACCOUNT_ID),
                    s_contra_id:take('s_contra_id',cs.ACCOUNT_ID_CONTRA),
                    s_desc:     take('s_desc',     cs.DESCRIPTION),
                    s_pr_name:  take('s_pr_name',  cs.PR_DETAIL_NAME),
                    s_exp_name: take('s_exp_name', cs.EXPENSE_NAME),
                    s_org_id:   take('s_org_id',   cs.ORGANIZATION_ID),
                    s_org_name: take('s_org_name', cs.ORGANIZATION_NAME),
                    s_item_name:take('s_item_name',cs.ITEM_NAME),
                    s_prod_name:take('s_prod_name',cs.PRODUCT_NAME)
                };
                const cleanSearch = {};
                Object.keys(searchParams).forEach(k => { if(searchParams[k]) cleanSearch[k] = searchParams[k]; });

                const isGrouped = groupByLedger.length > 0;
                const isSearched = Object.keys(cleanSearch).length > 0;

                // Construct query parameters conditionally
                const query = new URLSearchParams();
                Object.keys(filters).forEach(k => {
                    if (k === 'page_size') {
                        query.set(k, targetPageSize);
                    } else if (k === 'page') {
                        query.set(k, targetPage);
                    } else if (Array.isArray(filters[k])) {
                        query.set(k, filters[k].join(','));
                    } else {
                        query.set(k, filters[k]);
                    }
                });
                Object.keys(cleanSearch).forEach(k => { query.set(k, cleanSearch[k]); });
                // Tổng (COUNT + cộng Nợ/Có — quét MỌI dòng khớp lọc, 2 triệu dòng là vài giây) chỉ phụ thuộc bộ lọc:
                // đổi trang, đổi số dòng/trang, sắp xếp → dùng lại số của lần đếm trước. Bấm Truy vấn / Lọc (opts.fresh)
                // luôn đếm lại để thấy chứng từ vừa nhập thêm.
                const countKey = [...query.entries()].filter(([k]) => k !== 'page' && k !== 'page_size').sort().join('&');
                if (!opts.fresh && countKey === ledgerCountKeyRef.current && pagination.total_rows > 0) {
                    query.set('known_total', pagination.total_rows);
                    query.set('known_deb', summary.total_debit);
                    query.set('known_crd', summary.total_credit);
                }

                if (ledgerSort.field) { query.set('order_by', ledgerSort.field); query.set('order_dir', ledgerSort.dir); }

                try {
                    const t0 = performance.now();
                    const r = await fetch(`/api/ledger?${query.toString()}`, { signal: abortRef.current.signal });
                    if (r.status === 401) { setIsLoggedIn(false); return; }
                    const tResp = performance.now();
                    const res = await r.json();
                    const tJson = performance.now();
                    if (res.status === 'ok') {
                        ledgerCountKeyRef.current = countKey;
                        setData(res.data);
                        setPagination(res.pagination);
                        setSummary(res.summary);
                        setFilters(p => ({ ...p, page: targetPage, page_size: targetPageSize }));
                        // đo tới lúc bảng vẽ xong (2 khung hình sau khi đổi state)
                        const st = parseServerTiming(r.headers.get('Server-Timing'));
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            if (_ctrl.signal.aborted) return;
                            const now = performance.now();
                            setQueryTiming({ ...st, total: now - t0, wait: tResp - t0, read: tJson - tResp, draw: now - tJson, rows: (res.data || []).length });
                        }));
                    } else {
                        alert('Lỗi truy vấn LEDGER:\n\n' + (res.message || JSON.stringify(res)));
                    }
                } catch (err) {
                    if (err.name === 'AbortError' || _ctrl.signal.aborted) return; // Request bị hủy — bình thường, bỏ qua
                    alert('Lỗi kết nối API LEDGER:\n\n' + err.message);
                } finally { setLoading(false); }
            };

            
            // Reload khi sort đổi
            useEffect(() => {
                if (isLoggedIn && activeTab === 'ledger') loadData(1, filters.page_size);
            }, [ledgerSort]);
            

            // ============ PURCHASE TAB STATE & LOADER ============
            const [purchaseData, setPurchaseData] = useState([]);
            const [purchasePagination, setPurchasePagination] = useState({ total_rows: 0, total_pages: 1, page: 1 });
            const [purchaseSummary, setPurchaseSummary] = useState({ quantity: 0, quantity_wh: 0, discount: 0, vat_tax: 0, total: 0 });
            const [purchaseColSearch, setPurchaseColSearch] = useState({});
            const [purchaseFilters, setPurchaseFilters] = useState({ wh_ids: [], tran_no_search: '' });
            
            // PURCHASE VIRTUAL SCROLL & GROUPING
            const purchaseFlatData = useMemo(() => {
                let filteredData = purchaseData;
                const searchKeys = Object.keys(purchaseColSearch).filter(k => (purchaseColSearch[k] || '').trim() !== '');
                if (searchKeys.length > 0) {
                    filteredData = filteredData.filter(row => {
                        return searchKeys.every(k => {
                            const val = String(row[k] || '').toLowerCase();
                            const query = purchaseColSearch[k].trim().toLowerCase();
                            return val.includes(query);
                        });
                    });
                }
                return buildGroupedData(filteredData, groupByPurchase, ['TOTAL_AMOUNT']);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [purchaseData, groupByPurchase, toggleGroupRenderPurchase, purchaseColSearch]);
            
            const purchaseRowHeight = 28;

            const handleTogglePurchaseGroup = (id) => {
                expandState.set(id, !(expandState.has(id) ? expandState.get(id) : true));
                setToggleGroupRenderPurchase(v => v + 1);
            };


            // ============ SALE TAB STATE & LOADER ============
            const [groupBySale, setGroupBySale] = useState([]);
            const [toggleGroupRenderSale, setToggleGroupRenderSale] = useState(0);
            const saleScrollRef = useRef();
            const [saleSort, setSaleSort] = useState({ field: null, dir: 'desc' });
            const [saleData, setSaleData] = useState([]);
            const [salePagination, setSalePagination] = useState({ total_rows: 0, total_pages: 1, page: 1 });
            const [saleSummary, setSaleSummary] = useState({ quantity: 0, amount: 0, discount: 0, vat_tax: 0, total: 0, cog: 0 });
            const [saleColSearch, setSaleColSearch] = useState({});
            const [saleFilters, setSaleFilters] = useState({ wh_ids: [], tran_no_search: '', is_return: '' });
            const [saleLoading, setSaleLoading] = useState(false);
            const debouncedSaleColSearch = useDebounce(saleColSearch, 400);

            const saleFlatData = useMemo(() => {
                let filteredData = saleData;
                const searchKeys = Object.keys(saleColSearch).filter(k => (saleColSearch[k] || '').trim() !== '');
                if (searchKeys.length > 0) {
                    filteredData = filteredData.filter(row => {
                        return searchKeys.every(k => {
                            const val = String(row[k] || '').toLowerCase();
                            const query = saleColSearch[k].trim().toLowerCase();
                            return val.includes(query);
                        });
                    });
                }
                return buildGroupedData(filteredData, groupBySale, ['TOTAL_AMOUNT']);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [saleData, groupBySale, toggleGroupRenderSale, saleColSearch]);

            const saleRowHeight = 28;

            const handleToggleSaleGroup = (id) => {
                expandState.set(id, !(expandState.has(id) ? expandState.get(id) : true));
                setToggleGroupRenderSale(v => v + 1);
            };

            const toggleSaleFilter = (key, id) => {
                setSaleFilters(p => {
                    if (Array.isArray(p[key])) return { ...p, [key]: p[key].includes(id) ? p[key].filter(x=>x!==id) : [...p[key], id] };
                    return { ...p, [key]: id };
                });
            };


            const buildSaleQuery = (targetPage = 1, targetPageSize = filters.page_size, searchOverride = null, extra = {}) => {
                const cs = searchOverride !== null ? searchOverride : saleColSearch;
                const LONG = new Set(['s_desc','s_org_name','s_item_name','s_exp_name','s_job_name','s_pr_name','s_contact','tran_no','s_inv_no']);
                const take = (k,v) => {
                    const x = (v||'').trim();
                    if (!x) return null;
                    if (LONG.has(k) && x.length < 2) return null;
                    return x;
                };
                const sp = {
                    s_vat_date:  take('s_vat_date',  cs.VAT_TRAN_DATE),
                    tran_no:     take('tran_no',     cs.TRAN_NO),
                    s_tran_id:   take('s_tran_id',   cs.TRAN_ID),
                    s_org_id:    take('s_org_id',    cs.ORGANIZATION_ID),
                    s_org_name:  take('s_org_name',  cs.ORGANIZATION_NAME),
                    s_wh_id:     take('s_wh_id',     cs.WAREHOUSE_ID),
                    s_item_id:   take('s_item_id',   cs.ITEM_ID),
                    s_item_name: take('s_item_name', cs.ITEM_NAME),
                    s_desc:      take('s_desc',      cs.DESCRIPTION),
                    s_inv_no:    take('s_inv_no',    cs.VAT_TRAN_NO),
                    s_exp_id:    take('s_exp_id',    cs.EXPENSE_ID),
                    s_exp_name:  take('s_exp_name',  cs.EXPENSE_NAME),
                    s_job_id:    take('s_job_id',    cs.JOB_ID),
                    s_job_name:  take('s_job_name',  cs.JOB_NAME),
                    s_pr_id:     take('s_pr_id',     cs.PR_DETAIL_ID),
                    s_pr_name:   take('s_pr_name',   cs.PR_DETAIL_NAME),
                    s_acc_id:    take('s_acc_id',    cs.ACCOUNT_ID),
                    s_unit_id:   take('s_unit_id',   cs.UNIT_ID),
                };
                if (saleFilters.tran_no_search?.trim()) sp.tran_no = saleFilters.tran_no_search.trim();
                const clean = {};
                Object.keys(sp).forEach(k => { if(sp[k]) clean[k] = sp[k]; });
                const query = new URLSearchParams({ ...filters, ...clean, ...extra, page: targetPage, page_size: targetPageSize });
                Object.keys(filters).forEach(k => { if(Array.isArray(filters[k])) query.set(k, filters[k].join(',')); });
                query.set('wh_ids', (saleFilters.wh_ids || []).join(','));

                return s;
            };

            // Tự build worksheet object — không gọi XLSX.utils.aoa_to_sheet (vốn enumerate properties).
            // Trả về ws object dạng {!ref, A1:{v,t}, ...} compatible XLSX writer.
            const buildSheetManual = async (cols, rows, extractor, onProgress) => {
                const headers = cols.map(([_, label]) => label);
                const truncate = rows.length > EXCEL_MAX_ROWS;
                const useRows = truncate ? rows.slice(0, EXCEL_MAX_ROWS) : rows;
                const ws = {};
                const nCols = headers.length;
                const nRows = useRows.length + 1; // +header

                // Header row
                for (let c = 0; c < nCols; c++) {
                    ws[colLetter(c) + '1'] = { v: headers[c], t: 's' };
                }

                const CHUNK = 10000;
                for (let i = 0; i < useRows.length; i++) {
                    const arr = extractor(useRows[i]);
                    const rowExcel = i + 2; // 1-based, +header
                    for (let c = 0; c < nCols; c++) {
                        const v = arr[c];
                        if (v === '' || v == null) continue; // skip empty cell
                        const ref = colLetter(c) + rowExcel;
                        if (typeof v === 'number') ws[ref] = { v, t: 'n' };
                        else                       ws[ref] = { v: String(v), t: 's' };
                    }
                    if (i > 0 && i % CHUNK === 0) {
                        if (onProgress) onProgress(i, useRows.length);
                        await yieldToUI();
                    }
                }
                if (onProgress) onProgress(useRows.length, useRows.length);

                ws['!ref'] = `A1:${colLetter(nCols - 1)}${nRows}`;
                return { ws, truncated: truncate ? rows.length - EXCEL_MAX_ROWS : 0 };
            };

            // Build query URLSearchParams cho count/stream — y hệt logic export-all của từng tab
            const buildExportQuery = (kind) => {
                if (kind === 'ledger') {
                    const query = new URLSearchParams({ ...filters });
                    Object.keys(filters).forEach(k => { if(Array.isArray(filters[k])) query.set(k, filters[k].join(',')); });
                    const cs = colSearch;
                    const map = {
                        s_date:cs.TRAN_DATE, tran_no:cs.TRAN_NO, s_tran_id:cs.TRAN_ID,
                        s_acc_id:cs.ACCOUNT_ID, s_contra_id:cs.ACCOUNT_ID_CONTRA,
                        s_desc:cs.DESCRIPTION, s_pr_name:cs.PR_DETAIL_NAME,
                        s_exp_name:cs.EXPENSE_NAME, s_org_id:cs.ORGANIZATION_ID,
                        s_org_name:cs.ORGANIZATION_NAME, s_item_name:cs.ITEM_NAME,
                        s_prod_name:cs.PRODUCT_NAME
                    };
                    Object.keys(map).forEach(k => { if((map[k]||'').trim()) query.set(k, map[k].trim()); });
                    if (ledgerSort.field) { query.set('order_by', ledgerSort.field); query.set('order_dir', ledgerSort.dir); }
                    return query;
                }
                if (kind === 'purchase') return buildPurchaseQuery(1, 1, null, {});
                if (kind === 'sale') return buildSaleQuery(1, 1, null, {});
                if (kind === 'voucher') return buildVoucherQuery(1, 1, null, {});
                if (kind === 'income_alloc') return buildIncomeAllocQuery(1, 1, {});
                if (kind === 'warehouse_balance') return buildWarehouseBalanceQuery(1, 1, null, {});
                return buildWarehouseQuery(1, 1, null, {});
            };

            // Trigger browser tải file qua URL (server-side stream). Không nạp vào RAM JS.
            const triggerDownload = (url, fname) => {
                const a = document.createElement('a');
                a.href = url;
                a.download = fname || '';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 200);
            };

            // Kick off server-side export job → poll status → khi done set exportDone modal
            const startServerExport = async (kind, total, format = 'csv') => {
                setExporting(true);
                setExportProgress({ phase: 'stream', current: 0, total });
                try {
                    const q = buildExportQuery(kind);
                    q.set('total', String(total));
                    q.set('format', format);
                    const r = await fetch(`/api/${kind}/stream_csv?${q.toString()}`, { method: 'POST' });
                    const res = await r.json();
                    if (res.status !== 'ok' || !res.job_id) {
                        alert('Lỗi khởi tạo job xuất: ' + (res.message || 'unknown'));
                        return;
                    }
                    const jobId = res.job_id;
                    // Poll status mỗi 500ms cho đến khi done/error
                    while (true) {
                        await new Promise(r => setTimeout(r, 500));
                        const sr = await fetch(`/api/export/status?job_id=${jobId}`);
                        if (sr.status === 404) { alert('Job đã bị xóa.'); break; }
                        const sj = await sr.json();
                        setExportProgress({ phase: 'stream', current: sj.current || 0, total: sj.total || total });
                        if (sj.status === 'done') {
                            setExporting(false);
                            setExportProgress(null);
                            setExportDone({ file_path: sj.file_path, filename: sj.filename, total: sj.current });
                            break;
                        }
                        if (sj.status === 'error') {
                            alert('Lỗi xuất CSV: ' + (sj.error || ''));
                            break;
                        }
                    }
                } catch (err) {
                    alert('Lỗi: ' + err.message);
                } finally {
                    setExporting(false);
                    setExportProgress(null);
                }
            };

            const openExportedFile = async (path) => {
                try {
                    const r = await fetch('/api/open_file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path })
                    });
                    const j = await r.json();
                    if (j.status !== 'ok') alert('Không mở được file: ' + (j.message || ''));
                } catch (e) { alert('Lỗi: ' + e.message); }
            };
            const openExportedFolder = async (path) => {
                try {
                    const r = await fetch('/api/open_folder', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path })
                    });
                    const j = await r.json();
                    if (j.status !== 'ok') alert('Không mở được folder: ' + (j.message || ''));
                } catch (e) { alert('Lỗi: ' + e.message); }
            };

            const doExport = async (kind, mode, format = 'xlsx') => {
                // kind: 'ledger' | 'purchase' | 'warehouse' | 'sale' | 'voucher' | 'income_alloc' ; mode: 'single' | 'by_org' ; format: 'xlsx' | 'csv'
                if (typeof XLSX === 'undefined' && mode === 'by_org') { alert('Thư viện XLSX chưa tải được. Vui lòng kiểm tra kết nối.'); return; }
                setExporting(true);
                setExportOpen(null);
                setExportProgress({ phase: 'fetch', current: 0, total: 0 });
                try {
                    // ===== BƯỚC 1: Lấy số dòng trước =====
                    const countQuery = buildExportQuery(kind);
                    const countRes = await fetch(`/api/${kind}/count?${countQuery.toString()}`).then(r => r.json()).catch(() => null);
                    const totalRows = countRes && countRes.status === 'ok' ? countRes.total : 0;

                    if (!totalRows) {
                        alert('Không có dữ liệu để xuất.');
                        setExporting(false);
                        setExportProgress(null);
                        return;
                    }

                    // ===== BƯỚC 2: SERVER-SIDE STREAM EXPORT CHO MỌI ĐƠN FILE (xlsx hoặc csv) =====
                    // Luôn chạy ngầm server background job → có tiến trình 0-100% + modal Mở file / Mở folder khi xong
                    if (mode === 'single') {
                        await startServerExport(kind, totalRows, format);
                        return;
                    }

                    // ===== BƯỚC 3: client-side xlsx multi-sheet (by_org) =====
                    let url;
                    if (kind === 'ledger') {
                        url = `/api/ledger/export?${countQuery.toString()}`;
                    } else if (kind === 'purchase') {
                        url = `/api/purchase?${buildPurchaseQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'sale') {
                        url = `/api/sale?${buildSaleQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'voucher') {
                        url = `/api/voucher?${buildVoucherQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'income_alloc') {
                        url = `/api/income_alloc?${buildIncomeAllocQuery(1, 1, { export_all: '1' }).toString()}`;
                    } else if (kind === 'warehouse_balance') {
                        url = `/api/warehouse_balance?${buildWarehouseBalanceQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else {
                        url = `/api/warehouse?${buildWarehouseQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    }

                    setExportProgress({ phase: 'fetch', current: 0, total: totalRows });
                    const r = await fetch(url);
                    if (r.status === 401) { setIsLoggedIn(false); return; }
                    const res = await r.json();
                    if (res.status !== 'ok') { alert('Lỗi xuất Excel: ' + (res.message || '')); return; }
                    const rows = res.data || [];
                    if (!rows.length) { alert('Không có dữ liệu để xuất.'); return; }

                    const cols = kind === 'ledger' ? LEDGER_EXPORT_COLS
                               : kind === 'purchase' ? PURCHASE_EXPORT_COLS
                               : kind === 'sale' ? SALE_EXPORT_COLS
                               : kind === 'voucher' ? VOUCHER_EXPORT_COLS
                               : kind === 'income_alloc' ? INCOME_ALLOC_EXPORT_COLS
                               : kind === 'warehouse_balance' ? WAREHOUSE_BALANCE_EXPORT_COLS
                               : WAREHOUSE_EXPORT_COLS;
                    const extractor = kind === 'ledger' ? extractLedgerRow : (r) => extractRowGeneric(cols, r);

                    const prefix = kind === 'ledger' ? 'ChungTuTongHop_' : (kind === 'purchase' ? 'PhieuNhapKho_' : (kind === 'sale' ? 'ChungTuBanHang_' : (kind === 'voucher' ? 'ChungTuTien_' : (kind === 'income_alloc' ? 'DoanhThuChoPhanBo_' : (kind === 'warehouse_balance' ? 'TonKhoThucTe_' : 'ChungTuKho_')))));
                    const fname = prefix + filters.from_date.replace(/\//g,'') + '-' + filters.to_date.replace(/\//g,'') + '.xlsx';

                    setExportProgress({ phase: 'build', current: 0, total: rows.length });
                    await yieldToUI();

                    const wb = XLSX.utils.book_new();

                    // Group theo ORGANIZATION_ID
                    const groups = new Map();
                    for (let i = 0; i < rows.length; i++) {
                        const id = (rows[i].ORGANIZATION_ID || '').toString().trim() || '__NONE__';
                        let g = groups.get(id);
                        if (!g) { g = []; groups.set(id, g); }
                        g.push(rows[i]);
                    }
                    const onm = orgNameMap();
                    const ids = [...groups.keys()].sort();
                    if (!ids.length) { alert('Không có dữ liệu để xuất.'); return; }

                    // Cảnh báo nếu có sheet con vượt PER_SHEET_WARN
                    const oversize = ids.filter(id => groups.get(id).length > PER_SHEET_WARN);
                    if (oversize.length) {
                        alert(
                            `Cảnh báo: ${oversize.length} đơn vị có dữ liệu vượt ${PER_SHEET_WARN.toLocaleString()} dòng — có thể gây nặng khi mở.\n\n` +
                            `Tiếp tục xuất bình thường, nhưng nên thu hẹp khoảng ngày.`
                        );
                    }

                    let done = 0;
                    for (const id of ids) {
                        const grp = groups.get(id);
                        const { ws } = await buildSheetManual(cols, grp, extractor, (c) => {
                            setExportProgress({ phase: 'build', current: done + c, total: rows.length });
                        });
                        const orgName = id === '__NONE__' ? 'Khac' : (onm[id] || id);
                        XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName(`${id}-${orgName}`));
                        done += grp.length;
                        setExportProgress({ phase: 'build', current: done, total: rows.length });
                        await yieldToUI();
                    }

                    setExportProgress({ phase: 'write', current: rows.length, total: rows.length });
                    await yieldToUI();

                    // Dùng XLSX.write + Blob → tránh writeFile internal heavy enumeration
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
                    const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fname;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 100);
                } catch (err) {
                    alert('Lỗi xuất Excel: ' + (err && err.message ? err.message : String(err)));
                } finally {
                    setExporting(false);
                    setExportProgress(null);
                }
            };

            const ExportButton = ({ kind }) => {
                const ref = useRef(null);
                useEffect(() => {
                    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setExportOpen(null); };
                    if (exportOpen === kind) document.addEventListener('mousedown', onDown);
                    return () => document.removeEventListener('mousedown', onDown);
                }, [exportOpen]);
                return (
                    <div className="relative shrink-0" ref={ref}>
                        <button
                            type="button"
                            disabled={exporting}
                            onClick={() => setExportOpen(exportOpen === kind ? null : kind)}
                            className="ds-btn"
                        >
                            {exporting ? <Icon name="loader" className="animate-spin" size={14}/> : <Icon name="file-spreadsheet" size={14} stroke={2} className="ds-ic-ok"/>}
                            <span>{exporting ? 'Đang xuất...' : 'Xuất Excel'}</span>
                            <Icon name="chevron-down" size={12} stroke={2} className={`transition-transform ${exportOpen === kind ? 'rotate-180' : ''}`} />
                        </button>
                        {exportOpen === kind && (
                            <div className="ds-pop ds-pop-in absolute top-full right-0 mt-1.5 w-72 z-[600] overflow-hidden">
                                <div className="px-3 pt-2.5 pb-1.5 ds-poplabel">Chọn kiểu và định dạng xuất</div>
                                <button onClick={() => doExport(kind, 'single', 'xlsx')} className="ds-menuitem">
                                    <span className="ds-fmt is-ok">XLSX</span>
                                    <span><b>Xuất Excel (.xlsx)</b><small>Định dạng Excel chuẩn đẹp · Hiện tiến trình & Mở file</small></span>
                                </button>
                                <button onClick={() => doExport(kind, 'single', 'csv')} className="ds-menuitem">
                                    <span className="ds-fmt">CSV</span>
                                    <span><b>Xuất CSV (.csv)</b><small>Định dạng CSV nhẹ · Tải siêu tốc</small></span>
                                </button>
                                <button onClick={() => doExport(kind, 'by_org')} className="ds-menuitem mb-1">
                                    <span className="ds-fmt">ORG</span>
                                    <span><b>Tách sheet theo đơn vị (.xlsx)</b><small>Mỗi đơn vị 1 sheet trong 1 file Excel</small></span>
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            const loadReportData = async (pageArg, modeArg) => {
                // pageArg là số -> nhảy thẳng tới trang đó (dùng cho pager). Không phải số (vd event) -> dùng filters.page.
                const _page = (typeof pageArg === 'number' && pageArg > 0) ? pageArg : filters.page;
                if (typeof pageArg === 'number' && pageArg !== filters.page) setFilters(f => ({ ...f, page: pageArg }));
                if (abortRef.current) abortRef.current.abort();
                // BC008 (sổ chi tiết) bắt buộc chọn tài khoản
                if (reportType === 'BC008' && filters.acc_ids.length === 0) {
                    showNotice('Vui lòng chọn Tài khoản để xem Sổ chi tiết tài khoản.', 'Chưa chọn tài khoản');
                    return;
                }
                // BC011 (tổng hợp công nợ) bắt buộc chọn tài khoản
                if (reportType === 'BC011' && filters.acc_ids.length === 0) {
                    showNotice('Vui lòng chọn Tài khoản để xem báo cáo tổng hợp công nợ.', 'Chưa chọn tài khoản');
                    return;
                }
                const _ctrl = new AbortController(); abortRef.current = _ctrl;
                setLoading(true);
                // BC007/BC008 render dạng bảng thường (không ảo hoá) → giới hạn 1000 dòng/trang
                // cho mượt, dùng nút phân trang để xem tiếp (xuất Excel vẫn lấy toàn bộ).
                const rptPageSize = (reportType === 'BC007' || reportType === 'BC008' || reportType === 'BC013') ? Math.min(filters.page_size, 1000) : filters.page_size;
                const query = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), job_ids: filters.job_ids.join(','), page: _page, page_size: rptPageSize });
                try {
                    if (reportType === 'BC006') {
                        const r = await fetch(`/api/trial_balance?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setTrialBalanceData(res.data);
                            setTrialBalanceTotal(res.total);
                        }
                    } else if (reportType === 'BC005') {
                        const r = await fetch(`/api/balance_sheet?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res.data);
                            setMonthList([]);
                            setMonthlyData({});
                            setJobList([]);
                            setJobData({});
                        }
                    } else if (reportType === 'BC007') {
                        const r = await fetch(`/api/journal?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res);
                        }
                    } else if (reportType === 'BC008') {
                        const r = await fetch(`/api/account_details?${query.toString()}&account_id=${filters.acc_ids.join(',')}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res);
                        } else {
                            alert('Lỗi xem Sổ chi tiết: ' + (res.message || 'không có dữ liệu'));
                        }
                    } else if (reportType === 'BC011') {
                        const q2 = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), acc_ids: filters.acc_ids.join(','), pr_detail_ids: filters.pr_detail_ids.join(',') });
                        const r = await fetch(`/api/debt_summary?${q2.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setTrialBalanceData(res.data);
                            setTrialBalanceTotal(res.total);
                        } else {
                            alert('Lỗi xem báo cáo công nợ: ' + (res.message || 'không có dữ liệu'));
                        }
                    } else if (reportType === 'BC013') {
                    const activeMode = modeArg || vatSalesMode || 'detail';
                    const q2 = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), acc_ids: filters.acc_ids.join(','), mode: activeMode, page: _page, page_size: rptPageSize });
                    const r = await fetch(`/api/vat_sales_report?${q2.toString()}`, { signal: abortRef.current.signal });
                    if (r.status === 401) { setIsLoggedIn(false); return; }
                    const res = await r.json();
                    if (res.status === 'ok') {
                        setReportData(res);
                        setVatSalesTotals(res.totals || { total_amount_item: 0, taxable_amount_item: 0, total_vat_amount: 0 });
                    } else {
                        alert('Lỗi xem bảng kê bán ra: ' + (res.message || 'không có dữ liệu'));
                    }
                } else if (reportType === 'BC012') {
                        const q2 = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), acc_ids: filters.acc_ids.join(','), contra_acc_ids: filters.contra_acc_ids.join(','), tran_no: filters.tran_no || '', page: filters.page, page_size: 1000 });
                        const r = await fetch(`/api/cash_book?${q2.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setCashBookData({ rows: res.rows || [], pagination: res.pagination || { total_rows: 0, total_pages: 1, page: 1 } });
                        } else {
                            alert('Lỗi xem Sổ tiền mặt và ngân hàng: ' + (res.message || 'không có dữ liệu'));
                        }
                    } else if (reportType === 'BC009' || reportType === 'BC010') {
                        const r = await fetch(`/api/cash_flow?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            const cf = res.data || {};
                            setReportData(reportType === 'BC009' ? (cf.direct || {}) : (cf.indirect || {}));
                            setMonthList([]); setMonthlyData({}); setJobList([]); setJobData({});
                        }
                    }
                } catch (err) {
                    if (err.name === 'AbortError' || _ctrl.signal.aborted) return;
                } finally { setLoading(false); }
            };

            
            // LEDGER VIRTUAL SCROLL & GROUPING
            const ledgerFlatData = useMemo(() => {
                let filteredData = data;
                const searchKeys = Object.keys(colSearch).filter(k => (colSearch[k] || '').trim() !== '');
                if (searchKeys.length > 0) {
                    filteredData = filteredData.filter(row => {
                        return searchKeys.every(k => {
                            const val = String(row[k] || '').toLowerCase();
                            const query = colSearch[k].trim().toLowerCase();
                            return val.includes(query);
                        });
                    });
                }
                return buildGroupedData(filteredData, groupByLedger, ['DEBIT', 'CREDIT']);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [data, groupByLedger, toggleGroupRender, colSearch]);
            
            const ledgerRowHeight = 28; // Chiều cao thực tế của <tr> (không đổi theo bộ lọc)

            const handleToggleLedgerGroup = (id) => {
                expandState.set(id, !(expandState.has(id) ? expandState.get(id) : true));
                setToggleGroupRender(v => v + 1);
            };

            const toggleFilter = (key, id) => {
                if (key === 'from_date' || key === 'to_date') {
                    setFilters(p => ({ ...p, [key]: id }));
                } else {
                    setFilters(p => ({ ...p, [key]: p[key].includes(id) ? p[key].filter(x => x!==id) : [...p[key], id] }));
                }
            };

            if (!isLoggedIn) {
                return (
                    <div className="ds-login">
                        {/* Trái: minh hoạ (giấy sổ cái + sóc). Ẩn khi cửa sổ hẹp dưới 900px. */}
                        <div className="ds-login-art" aria-hidden="true">
                            <div className="ds-margin"></div>
                            <h2>Sổ sách rõ ràng,<br /><span>báo cáo đúng mẫu.</span></h2>
                            <p>Kết nối cơ sở dữ liệu kế toán iPOS để tra chứng từ và lập báo cáo theo thông tư mới nhất.</p>

                                                    <SortableHeader field="QUANTITY_ADJ"      sort={warehouseBalanceSort} onSort={f => setWarehouseBalanceSort(s => cycleSort(s, f))} className="border-r w-24 px-2" align="right">SL nguyên</SortableHeader>
                                                    <SortableHeader field="UNIT_ID_ADJ"       sort={warehouseBalanceSort} onSort={f => setWarehouseBalanceSort(s => cycleSort(s, f))} className="border-r w-20">ĐVT nguyên</SortableHeader>
                                                    <SortableHeader field="USER_ID"           sort={warehouseBalanceSort} onSort={f => setWarehouseBalanceSort(s => cycleSort(s, f))} className="border-r w-28">Người thực hiện</SortableHeader>
                                                    <SortableHeader field="ACCOUNT_ID"        sort={warehouseBalanceSort} onSort={f => setWarehouseBalanceSort(s => cycleSort(s, f))} className="border-r w-20">Tài khoản</SortableHeader>
                                                    <SortableHeader field="IS_APPROVED"       sort={warehouseBalanceSort} onSort={f => setWarehouseBalanceSort(s => cycleSort(s, f))} className="w-24">Đã duyệt</SortableHeader>
                                                </tr>
                                                <tr className="ds-search-row">
                                                    {['','','ORGANIZATION_ID','ORGANIZATION_NAME','WAREHOUSE_ID','WAREHOUSE_NAME','ITEM_ID','ITEM_NAME','','','','','USER_ID','ACCOUNT_ID',''].map((key, idx) => (
                                                        <th key={idx} className="border-r px-1 py-1">
                                                            {key ? <input
                                                                type="text"
                                                                value={warehouseBalanceColSearch[key] || ''}
                                                                onChange={e => setWarehouseBalanceColSearch(p => ({...p, [key]: e.target.value}))}
                                                                className="ds-colsearch"
                                                            /> : null}
                                                        </th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <VirtualRows data={warehouseBalanceFlatData} rowHeight={28} scrollRef={warehouseBalanceScrollRef} renderRow={(row, i) => (
                                                    <tr key={i} className="border-b hover:bg-indigo-50/30 text-center">
                                                        <td className="border-r text-slate-300 font-mono">{i + 1}</td>
                                                        <td className="border-r">{row.TRAN_DATE}</td>
                                                        <td className="border-r">{row.ORGANIZATION_ID}</td>
                                                        <td className="border-r px-3 text-left">{row.ORGANIZATION_NAME}</td>
                                                        <td className="border-r">{row.WAREHOUSE_ID}</td>
                                                        <td className="border-r px-3 text-left">{row.WAREHOUSE_NAME}</td>
                                                        <td className="border-r">{row.ITEM_ID}</td>
                                                        <td className="border-r px-3 text-left">{row.ITEM_NAME}</td>
                                                        <td className="border-r">{row.UNIT_ID}</td>
                                                        <td className="border-r px-2 text-right font-mono">{Number(row.QUANTITY||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                                                        <td className="border-r px-2 text-right font-mono">{Number(row.QUANTITY_ADJ||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
                                                        <td className="border-r">{row.UNIT_ID_ADJ}</td>
                                                        <td className="border-r">{row.USER_ID}</td>
                                                        <td className="border-r">{row.ACCOUNT_ID}</td>
                                                        <td className={row.IS_APPROVED ? 'text-emerald-600 font-black' : 'text-amber-600 font-black'}>{row.IS_APPROVED ? 'Đã duyệt' : 'Chưa duyệt'}</td>
                                                    </tr>
                                                )} />
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="ds-pager">
                                        <div className="flex items-center gap-8">
                                            <div className="text-[11.5px] text-ink-4">DataStudio</div>
                                        </div>
                                        <div className="flex items-center gap-6">
                                            <div className="flex items-center gap-2">
                                                <PageJumper page={warehouseBalancePagination.page} totalPages={warehouseBalancePagination.total_pages} onGoto={p => loadWarehouseBalanceData(p)} />
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end">
                                            
                                            <span className="ds-meta">
                                                Trang {warehouseBalancePagination.page} / {warehouseBalancePagination.total_pages}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </>
                    )}

                    {activeTab === 'report' && (
                        <div className="flex-1 flex flex-col relative overflow-hidden">
                            <ReportTab
                                filters={filters}
                                setFilters={setFilters}
                                period={period}
                                setPeriod={setPeriod}
                                meta={meta}
                                onToggleFilter={toggleFilter}
                                activeDropdown={activeDropdown}
                                setActiveDropdown={setActiveDropdown}
                                reportData={reportData}
                                loadReportData={loadReportData}
                                loading={loading}
                                monthList={monthList}
                                monthlyData={monthlyData}
                                jobList={jobList}
                                jobData={jobData}
                                reportType={reportType}
                                setReportType={setReportType}
                                setPendingReportType={setPendingReportType}
                                setShowClearModal={setShowClearModal}
                                trialBalanceData={trialBalanceData}
                                trialBalanceTotal={trialBalanceTotal}
                                cashBookData={cashBookData}
                                vatSalesTotals={vatSalesTotals}
                                journalViewMode={journalViewMode}
                                setJournalViewMode={setJournalViewMode}
                                vatSalesMode={vatSalesMode}
                                setVatSalesMode={setVatSalesMode}
                                showNotice={showNotice}
                            />
                        </div>
                    )}
                    {/* MODAL: Tải xong → Mở file / Mở folder */}
                    {exportDone && (
                        <div className="ds-scrim z-[9999]">
                            <div className="ds-dialog" role="dialog" aria-modal="true">
                                <div className="ds-dlg-head">
                                    <div className="ds-dlg-ic is-ok"><Icon name="check" size={18} stroke={2.5} /></div>
                                    <div className="min-w-0">
                                        <h2>Đã xuất xong</h2>
                                        <div className="ds-dlg-sub break-all">{(exportDone.total || 0).toLocaleString()} dòng · {exportDone.filename}</div>
                                    </div>
                                </div>
                                <div className="ds-dlg-body">
                                    <div className="ds-field-label">Đường dẫn</div>
                                    <div className="ds-path">{exportDone.file_path}</div>
                                </div>
                                <div className="ds-dlg-foot">
                                    <button onClick={() => setExportDone(null)} className="ds-btn ds-btn-ghost mr-auto">Đóng</button>
                                    <button onClick={() => openExportedFolder(exportDone.file_path)} className="ds-btn"><Icon name="folder-open" size={14} stroke={2} /> Mở folder</button>
                                    <button onClick={() => openExportedFile(exportDone.file_path)} className="ds-btn ds-btn-pri"><Icon name="file-spreadsheet" size={14} stroke={2} /> Mở file</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {exporting && exportProgress && (
                        <div className="ds-scrim z-[9999]">
                            <div className="ds-dialog" role="dialog" aria-modal="true" aria-busy="true">
                                <div className="ds-dlg-head">
                                    <div className="ds-dlg-ic is-ok"><Icon name="loader" size={18} stroke={2} className="animate-spin" /></div>
                                    <div className="min-w-0">
                                        <h3>Đang xuất Excel</h3>
                                        <div className="ds-dlg-sub">
                                            {exportProgress.phase === 'fetch'  && 'Đang tải dữ liệu từ server...'}
                                            {exportProgress.phase === 'build'  && `Đang dựng file: ${exportProgress.current.toLocaleString()} / ${exportProgress.total.toLocaleString()} dòng`}
                                            {exportProgress.phase === 'write'  && 'Đang ghi file xlsx...'}
                                            {exportProgress.phase === 'stream' && `Đang stream ${exportProgress.total.toLocaleString()} dòng → browser tải file CSV trực tiếp`}
                                        </div>
                                    </div>
                                </div>
                                <div className="ds-dlg-body space-y-3">
                                    {exportProgress.total > 0 && (
                                        <div className="ds-progress"><i style={{ width: `${Math.min(100, Math.round((exportProgress.current / Math.max(1, exportProgress.total)) * 100))}%` }}></i></div>
                                    )}
                                    <div className="text-[12px] text-ink-3">Vui lòng không tắt cửa sổ. Dữ liệu lớn có thể mất vài phút.</div>
                                </div>
                            </div>
                        </div>
                    )}
                    {showClearModal && (
                        <div className="ds-scrim z-[9999]">
                            <div className="ds-dialog" role="dialog" aria-modal="true">
                                <div className="ds-dlg-head items-center">
                                    <div className="ds-dlg-ic is-warn"><Icon name="alert-circle" size={18} stroke={2} /></div>
                                    <h2>Chuyển mẫu báo cáo?</h2>
                                </div>
                                <div className="ds-dlg-body">Nội dung báo cáo hiện tại sẽ bị xóa. Bạn cần phải tải lại báo cáo nếu muốn quay lại mẫu cũ.</div>
                                <div className="ds-dlg-foot">
                                    <button onClick={() => setShowClearModal(false)} className="ds-btn">Hủy</button>
                                    <button onClick={() => { setReportType(pendingReportType); setReportData({}); setMonthList([]); setMonthlyData({}); setJobList([]); setJobData({}); setShowClearModal(false); }} className="ds-btn ds-btn-pri">Xác nhận</button>
                                </div>
                            </div>
                        </div>
                    )}
                    {noticeModal && (
                        <div className="ds-scrim z-[99999]" onClick={() => setNoticeModal(null)}>
                            <div className="ds-dialog" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
                                <div className="ds-dlg-head items-center">
                                    <div className="ds-dlg-ic is-warn"><Icon name="alert-circle" size={18} stroke={2} /></div>
                                    <h3>{noticeModal.title || 'Thông báo'}</h3>
                                </div>
                                <div className="ds-dlg-body">{noticeModal.message}</div>
                                <div className="ds-dlg-foot">
                                    <button type="button" onClick={() => setNoticeModal(null)} className="ds-btn ds-btn-pri">Đã hiểu</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <AutoUpdateModal isUpdating={autoUpdate.isUpdating} progress={autoUpdate.progress} onClose={() => autoUpdate.setIsUpdating(false)} />
                    </div>
                    </div>
                    <AppStatusBar meta={meta} filters={filters} appVersion={appVersion} timing={activeTab === 'ledger' ? queryTiming : null} />
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
