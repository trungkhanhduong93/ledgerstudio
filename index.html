                "rotate-ccw": '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
                "zap": '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
                "rows": '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/>',
                // Thanh bên (Đợt 1)
                "receipt": '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
                "wallet": '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
                "shopping-cart": '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
                "package": '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
                "panel-left": '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
                "refresh-cw": '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
                // Thanh zoom khu báo cáo (Đợt 4)
                "minus": '<path d="M5 12h14"/>',
                "plus": '<path d="M5 12h14"/><path d="M12 5v14"/>',
                // Màn đăng nhập (Đợt 6)
                "server": '<rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>',
                "user": '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
                "eye": '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
                "eye-off": '<path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/>',
                "arrow-right": '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
                // Bộ lọc nâng cao — tay nắm kéo đổi thứ tự
                "grip": '<line x1="5" x2="19" y1="7" y2="7"/><line x1="5" x2="19" y1="12" y2="12"/><line x1="5" x2="19" y1="17" y2="17"/>',
                // Nút "Cột" — bố cục cột bảng dữ liệu (v1.10.0)
                "columns": '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/>',
                // Bộ lọc Thời gian — lùi / tới 1 năm (v1.10.7)
                "chevrons-left": '<path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/>',
                "chevrons-right": '<path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/>',
                // Màn đăng nhập "Kết nối gần đây" — dòng mật khẩu mã hoá (v1.10.8)
                "shield-check": '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: icons[name] || '' }} />;
        };

        // ===== BỘ LỌC THỜI GIAN (v1.10.7, Trum 29/09 — theo mẫu bộ chọn thời gian của iPOS) =====
        // 1 ô "Thời gian dd/mm/yyyy – dd/mm/yyyy" thay "Kỳ" (PeriodDropdown) + "Từ ngày" / "Đến ngày" (IOSDatePicker) ở mọi tab dữ liệu và
        // báo cáo, thay 2 chip Từ / Đến ở tab DT chờ phân bổ theo tháng. Popup: trái 3 chế độ Chọn ngày / Chọn tuần / Chọn tháng (KHÔNG có
        // nút nhanh Hôm nay, Tháng này… — Trum: "chỉ cần 3 option, cho người dùng tự chọn"), phải 2 lịch cạnh nhau, mỗi lịch điều hướng riêng.
        // Bấm lần 1 = đầu khoảng, lần 2 = cuối khoảng (bấm ngược cũng được) → áp dụng + đóng; bấm ra ngoài / Esc = bỏ lựa chọn dở.
        // Tuần = T2 → CN. only="month": khoá Chọn ngày / Chọn tuần; maxMonths: sau lần bấm 1, tháng cách quá maxMonths bị khoá.
        // Kỳ báo cáo (tiêu đề "Tháng 8 Năm 2026" / "Quý 3 …" / "Năm …" / "Từ ngày … Đến ngày …") suy từ khoảng ngày: rangePeriod.
        const parseDMY = (s) => { const x = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s || ''); return x ? new Date(+x[3], +x[2] - 1, +x[1]) : null; };
        const fmtDMY = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
        const dayKey = (d) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
        const monKey = (d) => d.getFullYear() * 12 + d.getMonth();
        const weekStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);
        const weekEnd = (d) => { const s = weekStart(d); return new Date(s.getFullYear(), s.getMonth(), s.getDate() + 6); };
        // Khoảng ngày → kỳ báo cáo. Trọn 1 tháng / 1 quý / 1 năm → giống hệt "Kỳ" cũ (tiêu đề báo cáo + file không đổi chữ); còn lại = Tùy ý.
        const rangePeriod = (fs, ts) => {
            const f = parseDMY(fs), t = parseDMY(ts);
            if (!f || !t) return { type: 'custom', value: 1, year: new Date().getFullYear() };
            const y = f.getFullYear(), m = f.getMonth() + 1, n = monKey(t) - monKey(f) + 1;
            const whole = f.getDate() === 1 && t.getFullYear() === y && t.getDate() === new Date(y, t.getMonth() + 1, 0).getDate();
            if (whole && n === 1) return { type: 'month', value: m, year: y };
            if (whole && n === 3 && m % 3 === 1) return { type: 'quarter', value: (m + 2) / 3, year: y };
            if (whole && n === 12) return { type: 'year', value: 1, year: y };
            return { type: 'custom', value: 1, year: y };
        };
        const TRP_MODES = [['day', 'Chọn ngày', 'ngày'], ['week', 'Chọn tuần', 'tuần'], ['month', 'Chọn tháng', 'tháng']];
        const TRP_WD = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
        // Tháng (chế độ ngày/tuần) hoặc năm (chế độ tháng) mở ra ở 2 lịch: trái = đầu khoảng, phải = cuối khoảng (trùng thì lịch kế tiếp).
        const trpViews = (mode, f, t) => {
            const a = f || new Date(), b = t || a;
            if (mode === 'month') return [new Date(a.getFullYear(), 0, 1), new Date(Math.max(b.getFullYear(), a.getFullYear() + 1), 0, 1)];
            const l = new Date(a.getFullYear(), a.getMonth(), 1);
            return [l, monKey(b) > monKey(a) ? new Date(b.getFullYear(), b.getMonth(), 1) : new Date(a.getFullYear(), a.getMonth() + 1, 1)];
        };
        // Popup — chỉ gắn khi mở (state tự về đầu mỗi lần mở: chế độ, 2 lịch, lựa chọn dở).
        const TimeRangePop = ({ from, to, onChange, mode, only, maxMonths, onToggle }) => {
            const [m, setM] = useState(only || mode || 'month');
            const [views, setViews] = useState(() => trpViews(only || mode || 'month', from, to));
            const [pend, setPend] = useState(null);   // đầu khoảng đã bấm, chờ bấm cuối
            const [hov, setHov] = useState(null);     // ô đang rê chuột → xem trước khoảng
            const unitS = d => (m === 'week' ? weekStart(d) : m === 'month' ? new Date(d.getFullYear(), d.getMonth(), 1) : d);
            const unitE = d => (m === 'week' ? weekEnd(d) : m === 'month' ? new Date(d.getFullYear(), d.getMonth() + 1, 0) : d);
            let ra = from, rb = to;
            if (pend) { const h = hov ? unitS(hov) : pend; ra = pend <= h ? pend : h; rb = unitE(pend <= h ? h : pend); }
            const sK = ra ? dayKey(ra) : 1, eK = rb ? dayKey(rb) : 0, sM = ra ? monKey(ra) : 1, eM = rb ? monKey(rb) : 0;
            const band = (k, s, e) => (k < s || k > e ? '' : k === s && k === e ? ' is-se' : k === s ? ' is-s' : k === e ? ' is-e' : ' is-in');
            const lockMon = d => !!(pend && maxMonths && Math.abs(monKey(d) - monKey(pend)) >= maxMonths);
            const pick = (d) => {
                const s = unitS(d);
                if (!pend) { setPend(s); return; }
                onChange(pend <= s ? pend : s, unitE(pend <= s ? s : pend), m);
                onToggle(null);
            };
            const setMode = (k) => { if (only && k !== only) return; setM(k); setViews(trpViews(k, from, to)); setPend(null); setHov(null); };
            const nav = (i, fn) => setViews(vs => vs.map((v, j) => (j === i ? fn(v) : v)));
            const todayK = dayKey(new Date()), todayM = monKey(new Date());
            const navBtn = (title, icon, fn) => <button type="button" title={title} onClick={fn}><Icon name={icon} size={14} stroke={2} /></button>;
            const dayCal = (v, i) => {
                const y = v.getFullYear(), mo = v.getMonth(), s0 = weekStart(v);
                const wk = m === 'week' && !pend && hov ? dayKey(weekStart(hov)) : 0;   // chế độ tuần: rê chuột tô cả hàng tuần
                return (
                    <div className="ds-trp-cal" key={'d' + i}>
                        <div className="ds-trp-head">
                            <span className="flex">
                                {navBtn('Năm trước', 'chevrons-left', () => nav(i, x => new Date(x.getFullYear() - 1, x.getMonth(), 1)))}
                                {navBtn('Tháng trước', 'chevron-left', () => nav(i, x => new Date(x.getFullYear(), x.getMonth() - 1, 1)))}
                            </span>
                            <span className="tabular-nums flex gap-3"><span>{y}</span><span>T{mo + 1}</span></span>
                            <span className="flex">
                                {navBtn('Tháng sau', 'chevron-right', () => nav(i, x => new Date(x.getFullYear(), x.getMonth() + 1, 1)))}
                                {navBtn('Năm sau', 'chevrons-right', () => nav(i, x => new Date(x.getFullYear() + 1, x.getMonth(), 1)))}
                            </span>
                        </div>
                        <div className="ds-trp-wd">{TRP_WD.map(w => <span key={w}>{w}</span>)}</div>
                        <div className="ds-trp-grid ds-trp-days" onMouseLeave={() => setHov(null)}>
                            {Array.from({ length: 42 }, (_, n) => {
                                const d = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate() + n), k = dayKey(d);
                                const out = d.getMonth() !== mo, off = out && m === 'day';   // ngày tháng khác: chế độ ngày không bấm (đã có ở lịch bên kia)
                                const cls = 'ds-trp-c' + (out ? ' is-out' : '') + (off ? '' : band(k, sK, eK))
                                    + (wk && dayKey(weekStart(d)) === wk ? ' is-wk' : '') + (k === todayK && !out ? ' is-today' : '');
                                return <button key={k} type="button" className={cls} aria-disabled={off || undefined}
                                    onClick={off ? undefined : () => pick(d)} onMouseEnter={off ? undefined : () => setHov(d)}><span>{d.getDate()}</span></button>;
                            })}
                        </div>
                    </div>
                );
            };
            const monCal = (v, i) => {
                const y = v.getFullYear();
                return (
                    <div className="ds-trp-cal" key={'m' + i}>
                        <div className="ds-trp-head">
                            {navBtn('Năm trước', 'chevron-left', () => nav(i, x => new Date(x.getFullYear() - 1, 0, 1)))}
                            <span className="tabular-nums">{y}</span>
                            {navBtn('Năm sau', 'chevron-right', () => nav(i, x => new Date(x.getFullYear() + 1, 0, 1)))}
                        </div>
                        <div className="ds-trp-grid ds-trp-mons" onMouseLeave={() => setHov(null)}>
                            {Array.from({ length: 12 }, (_, mo) => {
                                const d = new Date(y, mo, 1), k = monKey(d), off = lockMon(d);
                                const cls = 'ds-trp-c' + (off ? ' is-off' : band(k, sM, eM)) + (k === todayM ? ' is-today' : '');
                                return <button key={mo} type="button" className={cls} aria-disabled={off || undefined} title={off ? `Tối đa ${maxMonths} tháng` : undefined}
                                    onClick={off ? undefined : () => pick(d)} onMouseEnter={off ? undefined : () => setHov(d)}><span>T{mo + 1}</span></button>;
                            })}
                        </div>
                    </div>
                );
            };
            const unit = (TRP_MODES.find(x => x[0] === m) || [])[2];
            return (
                <div className="ds-pop ds-pop-in ds-trp absolute top-full left-0 mt-1.5 z-[500]">
                    <div className="ds-trp-rail">
                        {TRP_MODES.map(([k, name]) => {
                            const lock = !!only && k !== only;
                            return (
                                <button key={k} type="button" aria-disabled={lock || undefined} title={lock ? 'Danh sách này chỉ chọn theo tháng' : undefined}
                                    onClick={() => setMode(k)} className={`ds-trp-mode${m === k ? ' is-on' : ''}${lock ? ' is-lock' : ''}`}>
                                    <span>{name}</span>{lock && <Icon name="lock" size={12} stroke={2} />}
                                </button>
                            );
                        })}
                        <div className="ds-trp-hint">{pend ? `Bấm ${unit} kết thúc` : `Bấm ${unit} bắt đầu, rồi ${unit} kết thúc`}{maxMonths ? ` · tối đa ${maxMonths} tháng` : ''}</div>
                    </div>
                    {views.map((v, i) => (m === 'month' ? monCal(v, i) : dayCal(v, i)))}
                </div>
            );
        };
        // from / to: Date (hoặc null). onChange(from, to, chế độ) chỉ gọi khi đã chọn đủ 2 đầu. mode: chế độ mở ra lần sau (App nhớ).
        const TimeRangePicker = ({ id = 'time', label = 'Thời gian', from, to, onChange, mode, only, maxMonths, isActive, onToggle }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (!isActive) return;
                const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) onToggle(null); };
                const onKey = (e) => { if (e.key === 'Escape') onToggle(null); };
                document.addEventListener('mousedown', onDown);
                document.addEventListener('keydown', onKey);
                return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
            }, [isActive]);
            const ym = d => `T${d.getMonth() + 1}/${d.getFullYear()}`;
            const text = !from || !to ? 'Chọn thời gian' : only === 'month' ? `${ym(from)} – ${ym(to)}` : `${fmtDMY(from)} – ${fmtDMY(to)}`;
            const n = from && to ? monKey(to) - monKey(from) + 1 : 0;
            const title = only === 'month' && n
                ? `Từ tháng ${from.getMonth() + 1}/${from.getFullYear()} đến tháng ${to.getMonth() + 1}/${to.getFullYear()}: ${n} cột tháng${maxMonths ? ` (tối đa ${maxMonths})` : ''}`
                : 'Chọn theo ngày, tuần hoặc tháng';
            return (
                <div className="relative" ref={ref}>
                    <button type="button" onClick={() => onToggle(isActive ? null : id)} className={`ds-chip ${isActive ? 'is-open' : ''}`} title={title}>
                        <span className="ds-k">{label}</span>
                        <span className="tabular-nums">{text}</span>
                        <Icon name="calendar" size={14} stroke={2} />
                    </button>
                    {isActive && <TimeRangePop from={from} to={to} onChange={onChange} mode={mode} only={only} maxMonths={maxMonths} onToggle={onToggle} />}
                </div>
            );
        };

        // Chọn 1 trong vài giá trị (thẻ ds-chip + danh sách). Dùng trong panel "Bộ lọc khác" thay nút chuyển ds-seg nhiều lựa chọn:
        // 3–5 nút không vừa ô lưới 1/3 panel → tràn đè lên ô bên cạnh (Trum 29/09). options: [[value, tên, gợi ý?]], phần tử đầu = mặc định.
        const ChoiceDropdown = ({ id, label, options, value, onChange, isActive, onToggle }) => {
            const ref = useRef(null);
            useEffect(() => {
                const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) onToggle(null); };
                if (isActive) document.addEventListener('mousedown', onDown);
                return () => document.removeEventListener('mousedown', onDown);
            }, [isActive]);
            const cur = options.find(o => o[0] === value) || options[0];
            return (
                <div className="relative" ref={ref}>
                    <button type="button" onClick={() => onToggle(isActive ? null : id)}
                            className={`ds-chip ${cur[0] !== options[0][0] ? 'is-on' : ''} ${isActive ? 'is-open' : ''}`}>
                        <span className="ds-k">{label}</span>
                        <span className="truncate min-w-0">{cur[1]}</span>
                        <Icon name="chevron-down" size={12} stroke={2} className={`transition-transform ${isActive ? 'rotate-180' : ''}`} />
                    </button>
                    {isActive && (
                        <div className="ds-pop ds-pop-in absolute top-full left-0 mt-1.5 w-72 z-[600] p-1">
                            {options.map(([v, name, hint]) => (
                                <div key={v || '_'} onClick={() => { onChange(v); onToggle(null); }} className={`ds-opt ${cur[0] === v ? 'is-sel' : ''}`}>
                                    <span className="flex-1 min-w-0">
                                        <span className="block">{name}</span>
                                        {hint && <span className="block text-[11.5px] text-ink-3 leading-snug">{hint}</span>}
                                    </span>
                                    {cur[0] === v && <Icon name="check" size={12} stroke={2.5} className="text-brand" />}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // codePrefix (ô tài khoản, v1.10.2): mã BẮT ĐẦU bằng chữ đã gõ (111 → 111, 1111 — không ra 3111); gõ toàn chữ số thì
        // chỉ so mã, gõ có chữ cái thì tìm thêm tên kiểu "chứa". Ô khác giữ: mã hoặc tên chứa chữ đã gõ.
        const PremiumDropdown = ({ label, items, selectedItems, onSelect, isActive, onToggle, align = "left", codePrefix = false }) => {
            const dropdownRef = useRef(null);
            const [search, setSearch] = useState("");
            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) onToggle(null); };
                if (isActive) document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, [isActive]);
            const q = search.toLowerCase();
            const qNum = /^[\d.\s]+$/.test(q);
            const filtered = (items || []).filter(i => codePrefix
                ? (i.id || '').toLowerCase().trim().startsWith(q.trim()) || (!qNum && (i.name || '').toLowerCase().includes(q))
                : (i.name || '').toLowerCase().includes(q) || (i.id || '').toLowerCase().includes(q));
            // Danh mục có thể tới hàng nghìn mục → chỉ render tối đa RENDER_CAP để khỏi lag.
            // Tìm kiếm vẫn lọc trên TOÀN BỘ danh sách; gõ thêm để thu hẹp.
            const RENDER_CAP = 200;
            const shown = filtered.slice(0, RENDER_CAP);
            const hiddenCount = filtered.length - shown.length;
            // Cột mã thẳng hàng (27/09/2026): đo mã dài nhất đang hiện, đặt chung một bề rộng cho mọi dòng. Trước chỉ có
            // min-width 34px → mã dài (HDBL, PNK1…) đẩy cột tên lệch theo từng dòng. offsetWidth: không bị animation scale làm lệch.
            const listRef = useRef(null);
            React.useLayoutEffect(() => {
                const el = listRef.current;
                if (!el) return;
                el.style.removeProperty('--ds-code-w');
                let w = 0;
                el.querySelectorAll('.ds-code').forEach(s => { w = Math.max(w, s.offsetWidth); });
                if (w > 0) el.style.setProperty('--ds-code-w', (w + 1) + 'px');
            }, [isActive, search, items]);
            return (
                <div className="relative" ref={dropdownRef}>
                    <button onClick={(e) => { e.stopPropagation(); e.preventDefault(); onToggle(isActive ? null : label); }} className={`ds-chip ${selectedItems.length > 0 ? 'is-on' : ''} ${isActive ? 'is-open' : ''}`} type="button">
                        <span className="ds-k">{label}</span>
                        <span>{selectedItems.length > 0 ? `${selectedItems.length} mục` : 'Tất cả'}</span>
                        <Icon name="chevron-down" size={12} stroke={2} className={`transition-transform ${isActive ? 'rotate-180' : ''}`} />
                    </button>
                    {isActive && (
                        <div className={`ds-pop ds-pop-in absolute top-full mt-1.5 w-80 z-[500] flex flex-col max-h-[400px] ${align === 'right' ? 'right-0' : 'left-0'}`}>
                            <div className="p-2 border-b border-line-soft"><div className="relative"><Icon name="search" size={14} stroke={2} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-4 pointer-events-none"/><input autoFocus type="text" placeholder={`Tìm ${label.toLowerCase()}...`} value={search} onChange={e => setSearch(e.target.value)} className="ds-input w-full pl-8" /></div></div>
                            <div ref={listRef} className="flex-1 overflow-auto p-1 custom-scrollbar">
                                {shown.map(item => (
                                    <div key={item.id} onClick={(e) => { e.stopPropagation(); onSelect(item.id); }} className={`ds-opt ${selectedItems.includes(item.id) ? 'is-sel' : ''}`}>
                                        <span className="ds-check">{selectedItems.includes(item.id) && <Icon name="check" size={10} stroke={3}/>}</span>
                                        <span className="ds-code">{item.id}</span>
                                        <span className="truncate">{item.name}</span>
                                    </div>
                                ))}
                                {hiddenCount > 0 && (
                                    <div className="px-2 py-2 text-[12px] text-ink-3 text-center">
                                        … còn {hiddenCount.toLocaleString()} mục nữa — gõ để tìm
                                    </div>
                                )}
                                {shown.length === 0 && (
                                    <div className="px-2 py-4 text-[12px] text-ink-3 text-center">Không có kết quả</div>
                                )}
                            </div>
                            <div className="p-2 border-t border-line-soft flex justify-between items-center"><button onClick={(e) => { e.stopPropagation(); selectedItems.forEach(id => onSelect(id)); }} type="button" className="ds-btn ds-btn-ghost">Bỏ chọn</button><button onClick={(e) => { e.stopPropagation(); onToggle(null); }} type="button" className="ds-btn ds-btn-pri">Xong</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Version KHÔNG hardcode: lấy từ /api/version (server đọc version.txt do build_exe.py tự tăng mỗi lần build).
        // Hook dùng chung cho cả màn hình login lẫn thanh header.
        const useAppVersion = () => {
            const [v, setV] = React.useState('');
            React.useEffect(() => {
                let alive = true;
                fetch('/api/version')
                    .then(r => r.json())
                    .then(d => { if (alive && d && d.version) setV('v' + d.version); })
                    .catch(() => {});
                return () => { alive = false; };
            }, []);
            return v;
        };

        // ==============================================================================
        // TỰ CẬP NHẬT (port từ LedgerReport) — server so release mới nhất trên GitHub với version.txt;
        // có bản mới thì hiện banner, bấm "Cập nhật ngay" → server tải EXE, thay tại chỗ, tự mở lại bản mới.
        // ==============================================================================
        const useAutoUpdate = () => {
            const [updateInfo, setUpdateInfo] = React.useState(null);
            const [isUpdating, setIsUpdating] = React.useState(false);
            const [progress, setProgress] = React.useState({ progress: 0, status: 'idle', downloaded_bytes: 0, total_bytes: 0, error_message: '' });
            const pollRef = React.useRef(null);

            // Force update: có bản mới thì chặn đăng nhập, không cho bỏ qua
            const hasForceUpdate = !!(updateInfo && updateInfo.has_update);

            React.useEffect(() => {
                let alive = true;
                const timer = setTimeout(() => {
                    fetch('/api/check_update')
                        .then(r => r.json())
                        .then(data => { if (alive && data && data.has_update) setUpdateInfo(data); })
                        .catch(() => {});
                }, 1000);
                return () => { alive = false; clearTimeout(timer); clearInterval(pollRef.current); };
            }, []);

            const startUpdate = async () => {
                setIsUpdating(true);
                setProgress({ progress: 0, status: 'downloading', downloaded_bytes: 0, total_bytes: 0, error_message: '' });
                try {
                    const r = await fetch('/api/apply_update', { method: 'POST' });
                    const res = await r.json();
                    if (res.status !== 'ok') {
                        setProgress(p => ({ ...p, status: 'error', error_message: res.message || 'Không bắt đầu tải được bản mới' }));
                        return;
                    }
                    clearInterval(pollRef.current);
                    pollRef.current = setInterval(async () => {
                        try {
                            const pd = await (await fetch('/api/update_progress')).json();
                            setProgress(pd);
                            if (pd.status === 'ready') {
                                clearInterval(pollRef.current);
                                setTimeout(() => window.location.reload(), 3000);
                            } else if (pd.status === 'error') {
                                clearInterval(pollRef.current);
                            }
                        } catch (e) {
                            clearInterval(pollRef.current);
                            setProgress(p => ({ ...p, status: 'ready', progress: 100 }));
                            setTimeout(() => window.location.reload(), 3500);
                        }
                    }, 400);
                } catch (err) {
                    setProgress(p => ({ ...p, status: 'error', error_message: 'Không kết nối được máy chủ ứng dụng để cập nhật.' }));
                }
            };

            return { updateInfo, hasForceUpdate, isUpdating, setIsUpdating, progress, startUpdate };
        };

        // ===== LỖI TIẾNG VIỆT (v1.10.6) =====
        // Server dịch mọi lỗi (server.py _vi_error_text) thành 3 dòng: "<chuyện gì>\nCách khắc phục: …\nChi tiết kỹ thuật: …".
        // viErr làm y hệt cho lỗi phát sinh NGAY TRONG trình duyệt (fetch hỏng, JSON hỏng, thiếu bộ nhớ);
        // ErrText hiện 3 dòng đó thành 3 phần. Câu tiếng Việt thường (1 dòng) → in nguyên.
        const ERR_FIX = 'Cách khắc phục:', ERR_DETAIL = 'Chi tiết kỹ thuật:';
        const viErr = (e) => {
            const raw = String((e && e.message) || e || '').trim();
            if (!raw || raw.includes(ERR_FIX)) return raw;
            const pack = (what, fix) => `${what}\n${ERR_FIX} ${fix}\n${ERR_DETAIL} ${raw.slice(0, 180)}`;
            if (/Failed to fetch|NetworkError|Load failed|ERR_CONNECTION|ERR_INTERNET/i.test(raw))
                return pack('Không kết nối được tới phần chạy nền của DataStudio.', 'Đóng hẳn DataStudio rồi mở lại. Vẫn lỗi thì khởi động lại máy.');
            if (/Unexpected token|Unexpected end of JSON|JSON\.parse|is not valid JSON/i.test(raw))
                return pack('Phần chạy nền trả về dữ liệu hỏng (thường do truy vấn bị ngắt giữa chừng).', 'Bấm lại. Vẫn lỗi thì đóng DataStudio và mở lại.');
            if (/Invalid array length|out of memory|Maximum call stack|allocation failed|Array buffer allocation/i.test(raw))
                return pack('Trình duyệt không đủ bộ nhớ để xử lý chừng này dòng.', 'Giảm số dòng mỗi trang, thu hẹp kỳ, hoặc xuất Excel dạng XLSX/CSV (máy chủ ghi file, không qua trình duyệt).');
            if (/[À-ỹđĐ]/.test(raw)) return raw;
            return pack('Có lỗi chưa rõ nguyên nhân.', 'Thử lại. Vẫn lỗi thì chụp màn hình này gửi người hỗ trợ DataStudio.');
        };
        const ErrText = ({ text, className = '' }) => (
            <div className={`ds-errtext ${className}`}>
                {String(text || '').split('\n').filter(l => l.trim()).map((l, i) =>
                    l.startsWith(ERR_FIX) ? <p key={i} className="ds-err-fix"><b>{ERR_FIX}</b>{l.slice(ERR_FIX.length)}</p>
                    : l.startsWith(ERR_DETAIL) ? <p key={i} className="ds-err-raw">{l}</p>
                    : <p key={i} className="ds-err-what">{l}</p>)}
            </div>
        );

        // Ngày phát hành (ISO, UTC) → dd/mm/yyyy giờ máy
        const fmtRelDate = s => { const d = new Date(s || ''); return isNaN(d) ? '' : d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
        // Hộp bắt buộc cập nhật. Từ v1.10.5 kèm "Nội dung cập nhật": server (/api/check_update → changes) liệt kê từng bản
        // nằm giữa bản đang cài và bản mới nhất, mỗi bản vài gạch đầu dòng rút từ ghi chú release. Không có changes
        // (mạng lỗi, server cũ) → hộp như trước. LƯU Ý: hộp này là code của bản ĐANG CÀI — máy còn bản cũ thấy hộp cũ.
        const ForceUpdateModal = ({ updateInfo, onStartUpdate }) => {
            if (!updateInfo || !updateInfo.has_update) return null;
            const sizeMb = updateInfo.file_size ? (updateInfo.file_size / (1024 * 1024)).toFixed(1) : '';
            const changes = Array.isArray(updateInfo.changes) ? updateInfo.changes : [];
            const olderMore = updateInfo.changes_more || 0;
            const steps = changes.length + olderMore;
            const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
            return (
                <div className="ds-scrim z-[99999]">
                    <div className={`ds-dialog ds-upd-force ${changes.length ? 'has-log' : ''}`} role="dialog" aria-modal="true">
                        <div className="ds-upd-hero">
                            <div className="ds-upd-badge">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            </div>
                            <h2>Phiên bản mới đã sẵn sàng</h2>
                            <p className="ds-upd-ver">
                                <span className="ds-upd-old">v{updateInfo.current_version}</span>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                                <span className="ds-upd-new">{updateInfo.latest_version}</span>
                            </p>
                            {steps > 1 && <p className="ds-upd-steps">Gồm {steps} bản cập nhật</p>}
                        </div>
                        <div className="ds-dlg-body ds-upd-body">
                            <div className="ds-note is-info">
                                <Icon name="alert-circle" size={15} stroke={2} />
                                <span>Vui lòng cập nhật để tiếp tục sử dụng ứng dụng. Phiên bản hiện tại không còn được hỗ trợ.</span>
                            </div>
                            {changes.length > 0 && <>
                                <div className="ds-upd-logh">Nội dung cập nhật</div>
                                <div className="ds-upd-log" tabIndex={0} aria-label="Nội dung cập nhật">
                                    {changes.map(c => (
                                        <section key={c.version} className="ds-upd-rel">
                                            <header><b>{c.version}</b>{fmtRelDate(c.published_at) && <span>{fmtRelDate(c.published_at)}</span>}</header>
                                            {c.title && <p className="ds-upd-reltitle">{cap(c.title)}</p>}
                                            {(c.items || []).length
                                                ? <ul>{c.items.map((it, i) => <li key={i}>{it}</li>)}</ul>
                                                : <p className="ds-upd-more">Không có ghi chú.</p>}
                                            {c.more > 0 && <p className="ds-upd-more">… và {c.more} thay đổi khác</p>}
                                        </section>
                                    ))}
                                    {olderMore > 0 && <p className="ds-upd-more ds-upd-older">… và {olderMore} bản cũ hơn</p>}
                                </div>
                            </>}
                            {(sizeMb || (updateInfo.release_name && !changes.length)) && (
                                <div className="ds-upd-meta">
                                    {updateInfo.release_name && !changes.length && <div className="ds-upd-mrow"><span className="ds-upd-mk">Bản phát hành</span><span className="ds-upd-mv">{updateInfo.release_name}</span></div>}
                                    {sizeMb && <div className="ds-upd-mrow"><span className="ds-upd-mk">Dung lượng tải</span><span className="ds-upd-mv">{sizeMb} MB</span></div>}
                                </div>
                            )}
                        </div>
                        <div className="ds-dlg-foot ds-upd-foot">
                            <button onClick={onStartUpdate} className="ds-btn ds-btn-pri ds-upd-go"><Icon name="download" size={16} stroke={2} /> Cập nhật ngay</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AutoUpdateModal = ({ isUpdating, progress, onClose }) => {
            if (!isUpdating) return null;
            const isDone = progress.status === 'ready';
            const isErr = progress.status === 'error';
            const pct = progress.progress || 0;
            const downloadedMb = ((progress.downloaded_bytes || 0) / (1024 * 1024)).toFixed(1);
            const totalMb = ((progress.total_bytes || 0) / (1024 * 1024)).toFixed(1);
            return (
                <div className="ds-scrim z-[99999]">
                    <div className="ds-dialog" role="dialog" aria-modal="true">
                        <div className="ds-dlg-head">
                            <div className={`ds-dlg-ic ${isDone ? 'is-ok' : isErr ? 'is-bad' : ''}`}>
                                {isDone ? <Icon name="check" size={18} stroke={2.5} /> : isErr ? <Icon name="alert-circle" size={18} stroke={2} /> : <Icon name="download" size={18} stroke={2} />}
                            </div>
                            <div className="min-w-0">
                                <h3>{isDone ? 'Cập nhật hoàn tất' : isErr ? 'Không cập nhật được' : 'Đang cập nhật...'}</h3>
                                <div className="ds-dlg-sub">
                                    {isDone ? 'Đang mở lại ứng dụng ở phiên bản mới' : isErr ? 'Ứng dụng hiện tại vẫn dùng bình thường' : `Đang tải ${progress.target_version || 'bản mới'} — không tắt ứng dụng`}
                                </div>
                            </div>
                        </div>
                        <div className="ds-dlg-body space-y-3">
                            {!isErr && (
                                <div>
                                    <div className="flex justify-between items-baseline mb-1.5 text-[12px]">
                                        <span className="text-ink-3">{progress.status === 'applying' ? 'Đang thay file ứng dụng...' : isDone ? 'Hoàn thành' : 'Tiến trình tải'}</span>
                                        <span className="text-[13px] font-semibold text-ink tabular-nums">{pct}%</span>
                                    </div>
                                    <div className="ds-progress"><i className={isDone ? 'is-ok' : ''} style={{ width: `${Math.min(100, Math.max(5, pct))}%` }}></i></div>
                                    {progress.total_bytes > 0 && (
                                        <div className="text-[11.5px] text-ink-3 text-right mt-1 tabular-nums">{downloadedMb} MB / {totalMb} MB</div>
                                    )}
                                </div>
                            )}
                            {isDone && <div className="ds-note">Cửa sổ này sẽ tự đóng, ứng dụng mở lại sau vài giây</div>}
                            {isErr && <div className="ds-note is-bad"><ErrText text={progress.error_message} /></div>}
                        </div>
                        {isErr && (
                            <div className="ds-dlg-foot">
                                <button onClick={onClose} className="ds-btn">Đóng</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const APP_NAME = 'DataStudio';
        const REPORT_TYPES = [
            { id: 'BC013', name: 'BẢNG KÊ THUẾ GTGT (BÁN RA / MUA VÀO)' },
            { id: 'BC005', name: 'BẢNG CÂN ĐỐI KẾ TOÁN' },
            { id: 'BC006', name: 'BẢNG CÂN ĐỐI PHÁT SINH' },
            { id: 'BC007', name: 'SỔ NHẬT KÝ CHUNG (S03a-DN)' },
            { id: 'BC008', name: 'SỔ CHI TIẾT TÀI KHOẢN' },
            { id: 'BC014', name: 'SỔ CHI TIẾT TÀI KHOẢN CÔNG NỢ' },
            { id: 'BC011', name: 'TỔNG HỢP PHÁT SINH CÔNG NỢ' },
            { id: 'BC009', name: 'LƯU CHUYỂN TIỀN TỆ - TRỰC TIẾP (B03-DN)' },
            { id: 'BC010', name: 'LƯU CHUYỂN TIỀN TỆ - GIÁN TIẾP (B03-DN)' },
            { id: 'BC012', name: 'SỔ TIỀN MẶT VÀ TIỀN NGÂN HÀNG' },
            { id: 'BC015', name: 'BÁO CÁO NHẬP XUẤT TỒN' },
        ];

        // Mẫu số + tiêu đề — DÙNG CHUNG cho tờ báo cáo trên màn hình và file Excel (trước đây mỗi nơi tự ghi một kiểu:
        // BC006 trên web hiện "Mẫu B02 - DN" = mẫu Báo cáo KQKD, file .xls cũ lại ghi "B09 - DN" = Thuyết minh BCTC).
        // Bảng cân đối phát sinh (bảng cân đối tài khoản) theo TT200 là Mẫu F01 - DN; BC011 không có mẫu nhà nước.
        const REPORT_FORM_CODE = {
            BC005: 'Mẫu B01 - DN', BC006: 'Mẫu F01 - DN', BC007: 'Mẫu S03a - DN', BC008: 'Mẫu S38 - DN',
            BC009: 'Mẫu B03 - DN', BC010: 'Mẫu B03 - DN', BC011: '', BC012: 'Mẫu S07 - DN', BC014: 'Mẫu S38 - DN', BC015: '',   // BC013: theo loại — VAT_KINDS
        };
        const REPORT_TITLE = {
            BC005: 'BẢNG CÂN ĐỐI KẾ TOÁN', BC006: 'BẢNG CÂN ĐỐI PHÁT SINH', BC007: 'SỔ NHẬT KÝ CHUNG',
            BC008: 'SỔ CHI TIẾT TÀI KHOẢN', BC014: '2.3 - SỔ CHI TIẾT TÀI KHOẢN CÔNG NỢ', BC009: 'BÁO CÁO LƯU CHUYỂN TIỀN TỆ (Trực tiếp)',
            BC010: 'BÁO CÁO LƯU CHUYỂN TIỀN TỆ (Gián tiếp)', BC011: 'BẢNG TỔNG HỢP PHÁT SINH CÔNG NỢ',
            BC012: 'SỔ TIỀN MẶT VÀ TIỀN NGÂN HÀNG', BC015: 'BÁO CÁO NHẬP XUẤT TỒN',   // BC013: theo loại — VAT_KINDS
        };
        // BC015 — Nhập xuất tồn (v1.12.2). /api/inventory_summary trả mỗi (Kho, Hàng) 1 dòng, đã sắp theo kho rồi hàng:
        // oq/oa tồn đầu, iq/ia nhập, xq/xa xuất, cq/ca tồn cuối (q = số lượng theo ĐVT kho, a = tiền), cls/cls_name = nhóm hàng.
        // Cách nhóm (v1.12.3, Trum 10/10/2026): 'none' = gộp mọi kho, mỗi hàng 1 dòng · 'wh' = theo kho · 'cls' = gộp mọi kho rồi
        // chia theo nhóm hàng. Dòng nhóm (t: 'grp') đứng TRƯỚC các hàng của nhóm và mang luôn tổng của nhóm. Dòng nhóm và Tổng cộng
        // cộng cả số lượng lẫn tiền (Trum chốt, dù khác đơn vị tính). Dòng dựng ở đây DÙNG CHUNG cho tờ báo cáo và file Excel
        // (payload → xlsx_report.rows_bc015).
        const NXT_KEYS = ['oq', 'oa', 'iq', 'ia', 'xq', 'xa', 'cq', 'ca'];
        const NXT_MODES = [
            { id: 'none', label: 'Không nhóm', desc: 'Gộp mọi kho, mỗi hàng một dòng', file: 'KhongNhom' },
            { id: 'wh', label: 'Theo kho', desc: 'Mỗi kho một nhóm, dòng kho có tổng', file: 'TheoKho' },
            { id: 'cls', label: 'Theo nhóm hàng', desc: 'Gộp mọi kho, chia theo nhóm hàng', file: 'TheoNhom' },
        ];
        const nxtViewRows = (res, mode) => {
            if (!res || !Array.isArray(res.data) || res.data.length === 0) return [];
            const add = (a, r) => NXT_KEYS.forEach(k => { a[k] = (a[k] || 0) + (Number(r[k]) || 0); });
            const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
            const out = [];
            // mỗi nhóm: dòng nhóm (tổng các hàng bên dưới) rồi tới các hàng
            const pushGroups = (groups) => groups.forEach(g => {
                const h = { t: 'grp', label: g.label };
                g.rows.forEach(n => add(h, n));
                out.push(h);
                g.rows.forEach(n => out.push(n));
            });
            if (mode === 'none' || mode === 'cls') {
                const by = new Map();
                res.data.forEach(r => {
                    let n = by.get(r.item);
                    if (!n) { n = { t: 'item', item: r.item, name: r.name, unit: r.unit, cls: r.cls || '', cls_name: r.cls_name || '' }; by.set(r.item, n); }

            { id: '417', name: '7. Chênh lệch tỷ giá hối đoái', type: 'item' },
            { id: '418', name: '8. Quỹ đầu tư phát triển', type: 'item' },
            { id: '419', name: '9. Quỹ hỗ trợ sắp xếp doanh nghiệp', type: 'item' },
            { id: '420', name: '10. Quỹ khác thuộc vốn chủ sở hữu', type: 'item' },

            { id: '440', name: 'TỔNG CỘNG NGUỒN VỐN  (440 = 300 + 400)', type: 'total' },
