        // ===== Global format helpers — tránh tạo closure mỗi render =====
        // Giữ sẵn Intl.NumberFormat: toLocaleString(locale, options) tạo bộ định dạng mới MỖI lần gọi (chậm khi vẽ hàng nghìn ô
        // lúc cuộn bảng); format() của bộ giữ sẵn cho đúng chuỗi đó (ECMA-402 định nghĩa toLocaleString bằng chính NumberFormat).
        const _numFmt = {};
        const _intFmt = new Intl.NumberFormat('en-US');
        const fmtNum = (v, d = 2) => {
            if (v === null || v === undefined || v === '') return '';
            const n = Number(v);
            if (!Number.isFinite(n)) return '';
            return (_numFmt[d] || (_numFmt[d] = new Intl.NumberFormat('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }))).format(n);
        };


        const fmtInt = (v) => {
            if (v === null || v === undefined || v === '') return '';
            const n = Number(v);
            return Number.isFinite(n) ? _intFmt.format(Math.round(n)) : '';
        };
        
        const { createPortal } = ReactDOM;


        // Chunked spacer rows for virtual scroll - splits large heights into multiple <tr>
        // to avoid browser ignoring large single-row heights in <table>
        // Dùng SVG làm spacer: SVG là replaced element, browser LUÔN respect height attribute
        // dù rất lớn (1M+ px) — tránh được trường hợp <tr style="height"> bị collapse trong table layout
        const VirtualSpacer = ({ height }) => {
            if (height <= 0) return null;
            return (
                <tr aria-hidden="true">
                    <td colSpan="100" style={{ padding: 0, border: 0, lineHeight: 0, fontSize: 0, verticalAlign: 'top' }}>
                        <svg width="1" height={height} style={{ display: 'block' }} aria-hidden="true" />
                    </td>
                </tr>
            );
        };

        // Kéo thanh cuộn / vuốt mạnh: 1 sự kiện cuộn nhảy quá VS_FAST_JUMP dòng → chế độ nhanh, chỉ vẽ VS_OVERSCAN_FAST dòng
        // dự phòng mỗi phía (bình thường 50). Xem handleScroll.
        const VS_FAST_JUMP = 20;
        const VS_OVERSCAN_FAST = 8;

        function useVirtualScroll(dataArray, itemHeight, containerRef) {
            const totalItems = Array.isArray(dataArray) ? dataArray.length : (Number(dataArray) || 0);
            // top = vị trí cuộn đã vẽ theo; fast = đang kéo thanh cuộn / vuốt mạnh
            const [pos, setPos] = React.useState({ top: 0, fast: false });
            const scrollTop = pos.top;
            const [containerHeight, setContainerHeight] = React.useState(() => (typeof window !== 'undefined' ? window.innerHeight : 800));
            // Chiều cao dòng THỰC TẾ đo từ DOM. Hằng số itemHeight truyền vào chỉ là ước lượng ban đầu;
            // dùng sai (vd 28 trong khi dòng thật ~20) làm topPadding/startIndex lệch tích lũy qua hàng nghìn
            // dòng → khối render trôi khỏi viewport → "trắng bên dưới". Đo thật để tự khớp mọi danh sách.
            const [rowH, setRowH] = React.useState(itemHeight);
            const rowHRef = React.useRef(itemHeight);   // cho handleScroll (gắn 1 lần) đọc chiều cao dòng mới nhất
            rowHRef.current = rowH;
            const calibRef = React.useRef(0);   // số lần đo liên tiếp đã khớp → ngừng đo (tránh reflow mỗi lần cuộn)
            React.useLayoutEffect(() => {
                const c = containerRef.current;
                if (!c) return;
                // GIỚI HẠN CỨNG số lần đo/1 dataset: dù dòng cao thấp lệch nhau cũng KHÔNG lặp setRowH vô hạn
                // -> chặn crash "Maximum update depth exceeded" (React ném ra 'Script error' qua CDN). Reset khi đổi data.
                if (calibRef.current > 12) return;
                calibRef.current += 1;
                // Đo dòng dữ liệu, bỏ dòng gom nhóm (tab kho: dòng nhóm 31px, dòng thường 21px) — trừ khi chỉ còn dòng nhóm (thu gọn hết).
                // Dòng thật cao hơn số đo thì vẫn phủ kín khung; thấp hơn mới hở trắng → đo theo dòng thường.
                const all = [...c.querySelectorAll('tbody tr')].filter(tr => tr.children.length > 1);
                const plain = all.filter(tr => !tr.classList.contains('ds-grp'));
                const rows = plain.length ? plain : all;
                const hs = rows.slice(0, 16).map(tr => tr.getBoundingClientRect().height).filter(h => h > 4 && h < 200);
                if (hs.length) {
                    hs.sort((a, b) => a - b);
                    const med = hs[Math.floor(hs.length / 2)];   // trung vị: bền với dòng lẻ cao bất thường
                    if (med > 4 && Math.abs(med - rowH) > 0.5) setRowH(med);
                }
            });

            // Gắn scroll listener + ResizeObserver vào ĐÚNG khung cuộn đang có trong DOM — KHÔNG phụ thuộc totalItems.
            // Trước 27/09/2026 effect lấy deps [containerRef.current]: giá trị đọc lúc RENDER, khi khung vừa mount ref còn null
            // → chỉ gắn được ở lần App vẽ lại SAU đó; không có lần vẽ lại ấy (hoặc khung bị gắn lại) là bảng đứng im, trắng dưới
            // đáy (bắt được 1/4 lần chạy thử). Nay chạy sau MỖI render và so phần tử: rẻ, gắn ngay trong commit khung xuất hiện.
            const boundRef = React.useRef({ el: null, off: null });
            React.useEffect(() => { const b = boundRef.current; return () => { if (b.off) b.off(); b.el = null; b.off = null; }; }, []);
            React.useEffect(() => {
                const container = containerRef.current;
                const b = boundRef.current;
                if (container === b.el) return;
                if (b.off) b.off();
                b.el = container; b.off = null;
                if (!container) return;
                // Chỉ đổi state khi cuộn đủ ~10 dòng (overscan 50 dòng mỗi phía vẫn phủ kín màn hình). Trước 27/09/2026 mỗi
                // pixel cuộn là một setState → cả bảng vẽ lại theo từng pixel. Trả về prev = React bỏ qua.
                // Kéo thanh cuộn (27/09/2026): mỗi sự kiện nhảy qua cả khối 130 dòng đã vẽ → mỗi khung hình vẽ lại toàn bộ,
                // đo 10.000 dòng: 67–77 ms/khung (CPU ×4: 340 ms), và vẽ SAU khi khung hình đã hiện → thấy trắng rồi mới có
                // dòng. Chế độ nhanh: ít dòng dự phòng + flushSync để vẽ ngay trong khung hình đang dựng. Ngừng 150 ms → về 50 dòng.
                let lastTop = container.scrollTop, fast = false, idle = 0;
                const handleScroll = () => {
                    const st = container.scrollTop;
                    const rh = rowHRef.current > 4 ? rowHRef.current : itemHeight;
                    const jump = Math.abs(st - lastTop) > VS_FAST_JUMP * rh;
                    lastTop = st;
                    if (jump || fast) {
                        fast = true;
                        clearTimeout(idle);
                        idle = setTimeout(() => { fast = false; setPos({ top: container.scrollTop, fast: false }); }, 150);
                        ReactDOM.flushSync(() => setPos(prev => (prev.fast && Math.abs(st - prev.top) < rh) ? prev : { top: st, fast: true }));
                        return;
                    }
                    const step = 10 * rh;
                    setPos(prev => (Math.abs(st - prev.top) >= step || st === 0) ? { top: st, fast: false } : prev);
                };
                container.addEventListener('scroll', handleScroll, { passive: true });

                const measure = () => {
                    const h = container.clientHeight || container.getBoundingClientRect().height;
                    if (h > 0) setContainerHeight(h);
                };
                const ro = new ResizeObserver(() => measure());
                ro.observe(container);

                measure();
                const raf1 = requestAnimationFrame(measure);
                const raf2 = requestAnimationFrame(() => requestAnimationFrame(measure));
                const onResize = () => measure();
                window.addEventListener('resize', onResize);

                b.off = () => {
                    container.removeEventListener('scroll', handleScroll);
                    clearTimeout(idle);
                    ro.disconnect();
                    cancelAnimationFrame(raf1);
                    cancelAnimationFrame(raf2);
                    window.removeEventListener('resize', onResize);
                };
            });

            // Khi data đổi → reset scroll về đầu + đo lại để tránh state lệch DOM
            React.useLayoutEffect(() => {
                const container = containerRef.current;
                if (!container) return;
                container.scrollTop = 0;
                setPos({ top: 0, fast: false });
                calibRef.current = 0;   // data đổi → đo lại chiều cao dòng
                const h = container.clientHeight || container.getBoundingClientRect().height;
                if (h > 0) setContainerHeight(h);
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [dataArray, containerRef]);

            const eff = rowH > 4 ? rowH : itemHeight;   // chiều cao dòng hiệu dụng (đo thật)
            const overscan = pos.fast ? VS_OVERSCAN_FAST : 50;
            let startIndex = Math.max(0, Math.floor(scrollTop / eff) - overscan);
            let endIndex = Math.min(totalItems - 1, Math.floor((scrollTop + containerHeight) / eff) + overscan);
            if(totalItems === 0) { startIndex=0; endIndex=-1; }

            const topPadding = startIndex * eff;
            const totalHeight = totalItems * eff;
            const bottomPadding = Math.max(0, totalHeight - (endIndex + 1) * eff);

            return { startIndex, endIndex, topPadding, bottomPadding, totalHeight, fast: pos.fast };
        }

        // Thân bảng ảo dùng chung 7 bảng dữ liệu. State cuộn nằm TRONG component này: trước 27/09/2026 hook gọi trong App
        // nên mỗi lần cuộn là vẽ lại cả App (thanh lọc, 34 ô tiêu đề, 34 ô tìm theo cột…) chứ không chỉ các dòng.
        // renderRow(row, i): i = chỉ số tuyệt đối trong data, trả về <tr> có key.
        const VirtualRows = ({ data, rowHeight, scrollRef, renderRow }) => {
            const vs = useVirtualScroll(data, rowHeight, scrollRef);
            // Cột chỉ RỘNG THÊM, không hẹp lại khi cuộn (v1.10.3): bảng tự co giãn cột theo các dòng ĐANG VẼ → cuộn tới đoạn có tên dài là
            // cả bảng xô ngang, cuộn qua lại xô tới xô lui (đo dữ liệu kiểu thật 28/09: 24–32/250 bước cuộn, xô tới 176px). Giữ bề rộng
            // lớn nhất đã thấy làm min-width của tiêu đề; đổi dữ liệu (Truy vấn, gõ lọc) thì thả ra đo lại. th theo key cột nên đổi chỗ
            // cột vẫn mang đúng bề rộng của nó.
            const heads = () => scrollRef.current ? scrollRef.current.querySelectorAll('thead tr:first-child > th') : [];
            React.useLayoutEffect(() => { heads().forEach(th => { th.style.minWidth = ''; }); }, [data]);
            React.useLayoutEffect(() => {
                heads().forEach(th => {
                    const w = th.getBoundingClientRect().width;
                    if (w > (parseFloat(th.style.minWidth) || 0)) th.style.minWidth = w + 'px';
                });
            });
            return (
                <React.Fragment>
                    {vs.topPadding > 0 && <tr><td colSpan={100} style={{ height: vs.topPadding, padding: 0, border: 0 }}></td></tr>}
                    {data.slice(vs.startIndex, vs.endIndex + 1).map((row, i) => {
                        const el = renderRow(row, vs.startIndex + i);
                        // Đang kéo nhanh: key theo VỊ TRÍ trong khối → React giữ nguyên các <tr> đã có, chỉ thay chữ
                        // (khỏi tạo/huỷ ~1.000 ô mỗi khung hình). Hết kéo → về key của renderRow.
                        return vs.fast ? React.cloneElement(el, { key: 'f' + i }) : el;
                    })}
                    {vs.bottomPadding > 0 && <tr><td colSpan={100} style={{ height: vs.bottomPadding, padding: 0, border: 0 }}></td></tr>}
                </React.Fragment>
            );
        };

        // State global cho expand/collapse node
        const expandState = new Map();

        function buildGroupedData(rawData, groupCols, sumFields) {
            if (!groupCols || groupCols.length === 0) return rawData;
            const rootGroups = new Map();
            for(let i=0; i<rawData.length; i++) {
                const row = rawData[i];
                let currentMap = rootGroups;
                let parentKey = '';
                for(let j=0; j<groupCols.length; j++) {
                    const col = groupCols[j];
                    const val = row[col] || '(Trống)';
                    
                    let key = parentKey ? parentKey + '|' + val : val;
                    parentKey = key; // Save for next level

                    if (!currentMap.has(key)) {
                        let exp = expandState.has(key) ? expandState.get(key) : true;
                        currentMap.set(key, { id: key, name: val, col, level: j, sums: {}, children: [], map: new Map(), expanded: exp });
                        if(sumFields) sumFields.forEach(f => currentMap.get(key).sums[f] = 0);
                    }
                    const node = currentMap.get(key);
                    if(sumFields) {
                        if(row.DEBIT_CREDIT === 'DEB') node.sums.DEBIT = (node.sums.DEBIT || 0) + (parseFloat(row.AMOUNT) || 0);
                        if(row.DEBIT_CREDIT === 'CRD') node.sums.CREDIT = (node.sums.CREDIT || 0) + (parseFloat(row.AMOUNT) || 0);
                        if(row.TOTAL_AMOUNT) node.sums.TOTAL_AMOUNT = (node.sums.TOTAL_AMOUNT || 0) + (parseFloat(row.TOTAL_AMOUNT) || 0);
                        if(row.AMOUNT && row.DEBIT_CREDIT !== 'DEB' && row.DEBIT_CREDIT !== 'CRD') node.sums.AMOUNT = (node.sums.AMOUNT || 0) + (parseFloat(row.AMOUNT) || 0);
                    }
                    
                    if (j === groupCols.length - 1) {
                        node.children.push(row);
                    } else {
                        currentMap = node.map;
                    }
                }
            }
            const flat = [];
            const flatten = (map) => {
                for (const [key, node] of map.entries()) {
                    flat.push({ isGroup: true, ...node });
                    if (node.expanded) {
                        if (node.children.length > 0) {
                            for(let i = 0; i < node.children.length; i++) {
                                flat.push(node.children[i]);
                            }
                        }
                        else flatten(node.map);
                    }
                }
            };
            flatten(rootGroups);
            return flat;
        }

        // ===== BỐ CỤC CỘT 8 BẢNG DỮ LIỆU (v1.10.0, 28/09/2026) — đổi chỗ + ẩn/hiện cột, nhớ theo tab trên máy =====
        // Mỗi bảng khai báo MỘT mảng cột (*_GRID.cols). Tiêu đề, hàng tìm theo cột, dòng dữ liệu, dòng gom nhóm, dòng tổng và
        // "Xuất Excel → Như đang xem" cùng đi theo danh sách cột đang hiện → đổi chỗ/ẩn cột không làm số lệch sang cột khác.
        // (Trước đây 5 nơi viết cứng thứ tự cột — dòng gom nhóm tab bán hàng từng đặt tổng tiền dưới cột "Số lượng".)
        // Cột: { id, label, sort?, th, align?, search?, td, v?, exp? }
        //   id     khoá duy nhất trong bảng = tên trường dữ liệu (sổ cái: DEBIT/CREDIT là cột tính từ DEBIT_CREDIT + AMOUNT)
        //   sort   trường gửi đi khi bấm sắp xếp; không có → tiêu đề thường (không sắp xếp, không kéo vào "Gom nhóm")
        //   th     class ô tiêu đề; align canh chữ tiêu đề có sắp xếp ('left' | 'right', mặc định giữa)
        //   search có ô tìm theo cột, khoá = id: 1 = chỉ lọc các dòng đang tải trên trang; 2 = như 1 + bấm Truy vấn thì server
        //          lọc toàn bộ dữ liệu (khoá có trong build…Query của tab VÀ _build_…_where của server đọc tham số đó).
        //          Tooltip ô lọc ghi theo giá trị này → đổi 1 ↔ 2 phải khớp code gửi/nhận tham số, không thì tooltip nói sai.
        //   sv     chữ dùng khi lọc trên trang (mặc định r[id]) — cho cột cờ hiện chữ khác giá trị gốc; sh = gợi ý gõ gì (tooltip)
        //   q      kiểu so khi lọc (v1.10.2): 'num' = cột số, so số đang hiện bắt đầu bằng chữ số đã gõ (search 2 → gửi n_<ID>,
        //          server so cùng luật trong _num_prefix_where); 'pre' = cột mã/tài khoản, bắt đầu bằng; không có = chứa
        //   td     class ô dữ liệu (giá trị = v(r) nếu có, không thì r[id]) — hoặc hàm (r, key) => <td key={key} …/> cho ô đặc biệt
        //   exp    khoá cột khi xuất "Như đang xem" (mặc định [id]) — phải có trong *_EXPORT_COLS (App) và *_CSV_COLS (server.py)
        // Bảng: grid.grp = tổng dòng gom nhóm; grid.foot = ô dòng tổng { id cột: { k: khoá trong summary server, dec, cls, v? } } (footCells)
        // Mọi ô đều có border-r; CSS bỏ viền phải của ô cuối hàng → cột nào đứng cuối cũng đúng. Thêm cột = thêm 1 phần tử; máy
        // đã lưu bố cục thấy cột mới ngay sau cột đứng trước nó trong thứ tự mặc định.
        // Bố cục lưu ở localStorage['ds_cols_<tab>'] = { order: [id…], hidden: [id…] } (trùng mặc định thì xoá khoá). Cột # luôn đầu.
        const COL_DND = 'application/x-ds-col';   // kiểu dữ liệu khi kéo tiêu đề cột — vùng "Gom nhóm" vẫn đọc 'text/plain' như cũ
        let colDropEl = null;                       // tiêu đề đang hiện vạch "thả vào đây" (gắn thẳng data-drop, không qua state → không vẽ lại App)
        const colDropClear = () => { if (colDropEl) { delete colDropEl.dataset.drop; colDropEl = null; } };
        const colDropProps = (id, onMove) => ({
            onDragOver: e => {
                if (!e.dataTransfer.types.includes(COL_DND)) return;
                e.preventDefault();
                const el = e.currentTarget, rc = el.getBoundingClientRect();
                const side = e.clientX < rc.left + rc.width / 2 ? 'before' : 'after';
                if (colDropEl !== el) colDropClear();
                if (el.dataset.drop !== side) el.dataset.drop = side;
                colDropEl = el;
            },
            onDragLeave: e => { if (e.currentTarget === colDropEl && !e.currentTarget.contains(e.relatedTarget)) colDropClear(); },
            onDrop: e => {
                if (!e.dataTransfer.types.includes(COL_DND)) return;
                e.preventDefault();
                const from = e.dataTransfer.getData(COL_DND), after = e.currentTarget.dataset.drop === 'after';
                colDropClear();
                if (from && from !== id) onMove(from, id, after);
            },
            onDragEnd: colDropClear,
        });

        const readColLayout = (tab, ids) => {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem('ds_cols_' + tab) || 'null'); } catch (e) {}
            const order = [];
            if (saved && Array.isArray(saved.order)) saved.order.forEach(id => { if (ids.includes(id) && !order.includes(id)) order.push(id); });
            // Cột có ở bản mới mà bố cục đã lưu chưa có → chèn ngay sau cột đứng trước nó trong thứ tự mặc định
            ids.forEach((id, i) => { if (!order.includes(id)) order.splice(i ? order.indexOf(ids[i - 1]) + 1 : 0, 0, id); });
            const hidden = saved && Array.isArray(saved.hidden) ? saved.hidden.filter(id => ids.includes(id)) : [];
            // v1.11.4: widths = độ rộng kéo tay { id: px } — khoá có thể là cột tháng M202601 của DT theo tháng (không nằm trong ids)
            // nên chỉ lọc theo giá trị; pin = cột đóng băng { id: 'l' | 'r' } (trái = đầu danh sách, phải = cuối danh sách).
            const widths = {}, pin = {};
            if (saved && saved.widths && typeof saved.widths === 'object') Object.keys(saved.widths).forEach(id => { const w = Number(saved.widths[id]); if (w >= COL_MIN_W && w <= 2000) widths[id] = Math.round(w); });
            if (saved && saved.pin && typeof saved.pin === 'object') Object.keys(saved.pin).forEach(id => { if (ids.includes(id) && (saved.pin[id] === 'l' || saved.pin[id] === 'r')) pin[id] = saved.pin[id]; });
            return { order, hidden: hidden.length < ids.length ? hidden : [], widths, pin };
        };
        const COL_MIN_W = 40;   // cột kéo hẹp nhất 40px — hẹp hơn là mất luôn mép kéo, khó kéo rộng lại
        // Thứ tự VẼ: cột ghim trái → cột thường → cột ghim phải; trong mỗi nhóm giữ thứ tự của layout.order.
        const pinOrder = (order, pin) => [...order.filter(id => pin[id] === 'l'), ...order.filter(id => !pin[id]), ...order.filter(id => pin[id] === 'r')];
        // onHide(id): gọi khi ẩn một cột — tab xoá ô tìm theo cột đó (không để bảng bị lọc bằng cột không nhìn thấy).
        const useColLayout = (tab, grid, onHide) => {
            const ids = useMemo(() => grid.cols.map(c => c.id), [grid]);
            const [layout, setLayout] = useState(() => readColLayout(tab, ids));
            // list = mọi cột (cả cột ẩn) theo thứ tự vẽ; cols = cột đang hiện theo thứ tự vẽ
            const list = useMemo(() => pinOrder(layout.order, layout.pin), [layout]);
            const cols = useMemo(() => {
                const byId = {};
                grid.cols.forEach(c => { byId[c.id] = c; });
                return list.filter(id => !layout.hidden.includes(id)).map(id => byId[id]);
            }, [list, layout, grid]);
            const save = next => {
                next = { ...next, order: pinOrder(next.order, next.pin) };   // order luôn xếp theo nhóm ghim → thứ tự lưu = thứ tự vẽ
                setLayout(next);
                try {
                    if (!next.hidden.length && next.order.every((id, i) => id === ids[i]) && !Object.keys(next.widths).length && !Object.keys(next.pin).length) localStorage.removeItem('ds_cols_' + tab);
                    else localStorage.setItem('ds_cols_' + tab, JSON.stringify(next));
                } catch (e) {}
            };
            const pinWith = (pin, id, side) => { const p = { ...pin }; if (side) p[id] = side; else delete p[id]; return p; };
            // Thả trên tiêu đề bảng: đưa cột `from` sang trước/sau cột `to`. Thả vào giữa nhóm cột đóng băng → cột theo nhóm đó
            // (thả lên cột ghim trái = ghim trái, lên cột thường = bỏ ghim).
            const move = (from, to, after) => {
                if (!list.includes(from)) return;
                const order = list.filter(id => id !== from);
                const at = order.indexOf(to);
                if (at < 0) return;
                order.splice(after ? at + 1 : at, 0, from);
                save({ ...layout, order, pin: pinWith(layout.pin, from, layout.pin[to]) });
            };
            // Kéo trong bảng "Cột": `from` chiếm chỗ của `over` (kéo xuống → đứng sau, kéo lên → đứng trước), theo nhóm ghim của `over`
            const moveOver = (from, over) => {
                const at = list.indexOf(over);
                if (from === over || at < 0 || !list.includes(from)) return;
                const order = list.filter(id => id !== from);
                order.splice(at, 0, from);
                save({ ...layout, order, pin: pinWith(layout.pin, from, layout.pin[over]) });
            };
            const toggle = id => {
                if (layout.hidden.includes(id)) { save({ ...layout, hidden: layout.hidden.filter(x => x !== id) }); return; }
                if (layout.order.length - layout.hidden.length <= 1) return;   // bảng phải còn ít nhất 1 cột
                save({ ...layout, hidden: [...layout.hidden, id] });
                if (onHide) onHide(id);
            };
            const showAll = () => save({ ...layout, hidden: [] });
            const reset = () => save({ order: ids.slice(), hidden: [], widths: {}, pin: {} });
            // w = null → bỏ độ rộng kéo tay, cột về tự co giãn theo chữ
            const setWidth = (id, w) => {
                const widths = { ...layout.widths };
                if (w) widths[id] = Math.max(COL_MIN_W, Math.round(w)); else delete widths[id];
                save({ ...layout, widths });
            };
            // Lưu độ rộng đồng loạt cho nhiều cột (dùng cho Auto-Fit vừa khít tất cả cột)
            const setWidths = nextWidths => {
                const widths = {};
                if (nextWidths && typeof nextWidths === 'object') {
                    Object.keys(nextWidths).forEach(id => {
                        const w = Number(nextWidths[id]);
                        if (w >= COL_MIN_W && w <= 2000) widths[id] = Math.round(w);
                    });
                }
                save({ ...layout, widths });
            };
            const resetWidths = () => save({ ...layout, widths: {} });
            // side: 'l' ghim trái | 'r' ghim phải | '' bỏ ghim
            const setPin = (id, side) => save({ ...layout, order: list, pin: pinWith(layout.pin, id, side) });
            return { cols, list, layout, move, moveOver, toggle, showAll, reset, setWidth, setWidths, resetWidths, setPin };
        };

        // Ô trống vẽ '\u00a0' (v1.10.3): ô có py-1.5 (Diễn giải, Ghi chú…) mà trống thì cả dòng thấp 21px thay vì 31px → dòng cao thấp lệch
        // nhau, bảng ảo đặt sai vị trí (xem CSS "MỌI DÒNG CÙNG CHIỀU CAO"). Ô dạng hàm (td: (r, k) => …) không có py nên không cần.
        const gridCell = (c, r) => {
            if (typeof c.td === 'function') return c.td(r, c.id);
            const x = c.v ? c.v(r) : r[c.id];
            return <td key={c.id} className={c.td}>{x == null || x === '' ? '\u00a0' : x}</td>;
        };
        const GridRow = memo(({ grid, cols, r, idx }) => (
            <tr className={typeof grid.tr === 'function' ? grid.tr(r) : grid.tr}>
                <td className={grid.numTd}>{idx}</td>
                {cols.map(c => gridCell(c, r))}
            </tr>
        ));

        // Nhãn dòng tổng / dòng gom nhóm đứng TRƯỚC ô tổng đầu tiên. Ô tổng bị kéo lên sát đầu bảng (đứng trước nó < 2 cột) mà
        // phía sau ô tổng cuối còn ≥ 2 cột → nhãn chuyển ra sau, khỏi nhét vào cột # hẹp (nhãn gom nhóm không xuống dòng → nong cột #).
        const labelAfter = (first, last, n) => first >= 0 && first < 2 && n - 1 - last >= 2;

        // Dòng gom nhóm: nhãn trải qua các cột đứng trước cột có tổng đầu tiên, tổng nằm đúng dưới cột của nó (grid.grp).
        const GridGroupRow = ({ grid, cols, node, toggleExpand }) => {
            const grp = grid.grp || {};
            const first = cols.findIndex(c => grp[c.id]);
            let last = -1;
            cols.forEach((c, i) => { if (grp[c.id]) last = i; });
            const after = labelAfter(first, last, cols.length);
            const lv0 = node.level === 0;
            const sums = [];
            let gap = 0;
            for (let i = first; first >= 0 && i <= last; i++) {
                const s = grp[cols[i].id];
                if (!s) { gap++; continue; }
                if (gap) { sums.push(<td key={'g' + i} colSpan={gap > 1 ? gap : undefined} className="border-r border-indigo-200/30"></td>); gap = 0; }
                const val = node.sums[s.sum];
                sums.push(
                    <td key={cols[i].id} data-c={cols[i].id} className={`border-r border-indigo-200/30 text-right font-mono ${s.bold ? 'font-black ' : ''}px-2 ${lv0 ? 'text-white' : s.color}`}>
                        {val !== undefined && val !== 0 ? val.toLocaleString('en-US', { minimumFractionDigits: s.dec, maximumFractionDigits: s.dec }) : ''}
                    </td>
                );
            }
            const labelTd = (
                <td colSpan={after ? cols.length - 1 - last : 1 + (first >= 0 ? first : cols.length)} className="px-4 py-1.5 border-r border-indigo-200/30 whitespace-nowrap">
                    <div className="flex items-center gap-2" style={{ paddingLeft: `${node.level * 20}px` }}>
                        <span className={`inline-flex items-center justify-center w-3 h-3 border rounded-sm font-mono text-[9px] leading-none ${lv0 ? 'border-indigo-400 bg-indigo-500' : 'border-indigo-300 bg-white'}`}>
                            {node.expanded ? '-' : '+'}
                        </span>
                        <span>{node.col}: {node.name}</span>
                        <span className={`text-[10px] ml-2 ${lv0 ? 'text-indigo-200' : 'text-indigo-400'}`}>({node.children ? node.children.length : 0} dòng)</span>
                    </div>
                </td>
            );
            return (
                <tr className={`border-b border-slate-200 font-bold text-[11px] cursor-pointer transition-colors ${lv0 ? 'ds-grp ds-grp-0' : 'ds-grp ds-grp-1'}`} onClick={() => toggleExpand(node.id)}>
                    {after ? <td colSpan={1 + first} className="border-r border-indigo-200/30"></td> : labelTd}
                    {sums}
                    {after ? labelTd : first >= 0 && <td colSpan={100}></td>}
                </tr>
            );
        };

        // Tooltip ô tìm theo cột: nói rõ ô lọc tới đâu (search 1/2 ở comment đầu khối) + gợi ý gõ gì với cột cờ.
        const colSearchTitle = c => (c.search === 2
            ? 'Gõ để lọc ngay các dòng đang tải · Bấm Truy vấn để lọc trên toàn bộ dữ liệu'
            : 'Chỉ lọc các dòng đang tải trên trang này — bấm Truy vấn không lọc thêm')
            + (c.q === 'num' ? ' · Số bắt đầu bằng chữ số đã gõ: 145 → 145; 1,450; 145,000 (không ra 2,145) · số âm gõ dấu -'
                : c.q === 'pre' ? ' · Mã bắt đầu bằng chữ đã gõ: 511 → 511, 5111 (không ra 1511)' : ' · Tìm chữ nằm ở bất kỳ đâu')
            + (c.sh ? ' · ' + c.sh : '');

        // ===== ĐỘ RỘNG CỘT KÉO TAY + CỘT ĐÓNG BĂNG (v1.11.4, 03/10/2026) =====
        // CSS sinh ra ghi vào 2 thẻ <style> riêng của từng bảng (table[data-g]) — không qua state → kéo mép cột không vẽ lại React
        // mỗi pixel. Ô thân bảng chọn theo VỊ TRÍ (nth-child, cột # là ô 1) để khỏi gắn thuộc tính lên hàng nghìn ô; dòng gom nhóm
        // (ds-grp) có ô gộp cột nên loại ra — ô tổng của nó và ô dòng tổng chọn theo data-c. Bảng vẫn table-layout auto (Bẫy 16):
        // width + min-width !important (đè min-width VirtualRows ghi thẳng lên tiêu đề) + max-width → Chrome giữ đúng độ rộng, chữ
        // dài bị cắt. Đóng băng = position: sticky; vị trí left/right đo từ bề rộng thật của tiêu đề (ResizeObserver đo lại khi cột
        // tự giãn theo dữ liệu). Nền ô đóng băng đặt trong :where() (độ ưu tiên 0) để nền rê chuột / ô tô màu sẵn (ds-im-*) vẫn thắng.
        let gridSeq = 0;
        let colResizing = false;   // đang kéo mép cột → chặn dragstart của tiêu đề (khỏi đổi chỗ / gom nhóm nhầm)
        const colPin = (layout, c) => { const p = layout.pin || {}; return p[c.id] || (c.month ? p.MONTHS : '') || ''; };
        const gridWidthCss = (T, cols, widths) => cols.map((c, i) => {
            const w = widths[c.id]; if (!w) return '';
            const k = i + 2;
            return `${T}>thead>tr>:nth-child(${k}),${T}>tbody>tr:not(.ds-grp)>td:nth-child(${k}),${T} [data-c="${c.id}"]{width:${w}px;min-width:${w}px!important;max-width:${w}px;overflow:hidden;text-overflow:ellipsis}`;
        }).join('');
        const gridPinCss = (T, thead, cols, layout) => {
            const row = thead && thead.rows[0];
            if (!row || row.cells.length !== cols.length + 1) return '';
            const pins = cols.map(c => colPin(layout, c));
            let nL = 0; while (nL < pins.length && pins[nL] === 'l') nL++;
            let nR = 0; while (nR < pins.length - nL && pins[pins.length - 1 - nR] === 'r') nR++;
            if (!nL && !nR) return '';
            const ws = Array.from(row.cells, th => th.getBoundingClientRect().width);
            let css = '';
            const one = (k, id, side, x, edge) => {
                const head = `${T}>thead>tr>:nth-child(${k})`, body = `${T}>tbody>tr:not(.ds-grp)>td:nth-child(${k})`;
                const foot = id ? `,${T}>tfoot [data-c="${id}"]` : '', pos = `position:sticky;${side}:${Math.round(x * 100) / 100}px;`;
                css += `${head}{${pos}z-index:4}${body}${foot}{${pos}z-index:2}`
                    + `:where(${body}){background-color:#fff}:where(${T}>tbody>tr.bg-red-50\\/40>td:nth-child(${k})){background-color:#FEF9F9}`;
                if (edge) css += `${head}:not([data-drop]),${body}${foot}{box-shadow:${side === 'left' ? '6px' : '-6px'} 0 6px -4px rgba(14,26,43,.22)}`;
            };
            let x = 0;   // trái: cột # đóng băng cùng
            for (let j = 0; nL && j <= nL; j++) { one(j + 1, j ? cols[j - 1].id : '', 'left', x, j === nL); x += ws[j]; }
            x = 0;
            for (let j = 0; j < nR; j++) { const ci = cols.length - 1 - j; one(ci + 2, cols[ci].id, 'right', x, j === nR - 1); x += ws[ci + 1]; }
            return css;
        };
        const useGridCss = (theadRef, cols, lay) => {
            const st = useRef(null);
            if (!st.current) { const g = 'g' + (++gridSeq); st.current = { g, T: `table.ds-grid[data-g="${g}"]`, prevW: {} }; }
            const s = st.current;
            s.cols = cols; s.lay = lay;   // mép kéo + ResizeObserver luôn đọc bản mới nhất
            const tag = k => { if (!s[k]) { s[k] = document.createElement('style'); document.head.appendChild(s[k]); } return s[k]; };
            s.writeW = widths => { const css = s.lay ? gridWidthCss(s.T, s.cols, widths) : ''; if (tag('w').textContent !== css) s.w.textContent = css; };
            s.writeP = () => { const css = s.lay ? gridPinCss(s.T, theadRef.current, s.cols, s.lay.layout) : ''; if (tag('p').textContent !== css) s.p.textContent = css; };
            React.useLayoutEffect(() => {
                const th = theadRef.current;
                if (th && th.parentElement) th.parentElement.dataset.g = s.g;
                const widths = lay ? lay.layout.widths : {};
                // Cột vừa bỏ độ rộng kéo tay: xoá min-width VirtualRows đã ghi lúc cột còn rộng → cột co lại theo chữ (VirtualRows đo lại ngay sau)
                if (th) Object.keys(s.prevW).forEach(id => { if (widths[id]) return; const i = cols.findIndex(c => c.id === id); if (i >= 0 && th.rows[0].cells[i + 1]) th.rows[0].cells[i + 1].style.minWidth = ''; });
                s.prevW = widths;
                s.writeW(widths);
                s.writeP();
            });
            const key = cols.map(c => c.id).join('|');
            useEffect(() => {
                const th = theadRef.current;
                if (!th || typeof ResizeObserver === 'undefined') return;
                let raf = 0;
                const ro = new ResizeObserver(() => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; s.writeP(); }); });
                Array.from(th.rows[0].cells).forEach(c => ro.observe(c));
                return () => { ro.disconnect(); cancelAnimationFrame(raf); };
            }, [key]);
            useEffect(() => () => { if (s.w) s.w.remove(); if (s.p) s.p.remove(); s.w = s.p = null; }, []);
            // Kéo mép phải tiêu đề: vẽ thẳng vào thẻ style theo chuột, thả chuột mới lưu bố cục (1 lần vẽ lại React)
            s.startResize = (e, id) => {
                if (e.button !== 0 || !s.lay) return;
                e.preventDefault(); e.stopPropagation();
                const handle = e.currentTarget, x0 = e.clientX, w0 = handle.parentElement.getBoundingClientRect().width;
                const base = { ...s.lay.layout.widths };
                let w = null;
                colResizing = true;
                handle.classList.add('is-on');
                document.body.classList.add('ds-col-resizing');
                const onMove = ev => { w = Math.max(COL_MIN_W, Math.round(w0 + ev.clientX - x0)); s.writeW({ ...base, [id]: w }); s.writeP(); };
                const swallow = ev => { ev.stopPropagation(); ev.preventDefault(); };   // nuốt cú click sau khi thả chuột → không sắp xếp nhầm
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp, true);
                    handle.classList.remove('is-on');
                    document.body.classList.remove('ds-col-resizing');
                    window.addEventListener('click', swallow, true);
                    setTimeout(() => { window.removeEventListener('click', swallow, true); colResizing = false; }, 0);
                    if (w != null && Math.abs(w - w0) >= 1) s.lay.setWidth(id, w);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp, true);
            };
            return s;
        };
        // Mép kéo độ rộng ở cạnh phải ô tiêu đề (bấm đúp = về tự co giãn theo chữ)
        const colRz = (g, id) => (
            <span className="ds-col-rz" title="Kéo để đổi độ rộng cột · Bấm đúp để về độ rộng tự động"
                  onMouseDown={e => g.startResize(e, id)} onClick={e => e.stopPropagation()}
                  onDoubleClick={e => { e.stopPropagation(); if (g.lay) g.lay.setWidth(id, null); }}></span>
        );

        // Tiêu đề + hàng tìm theo cột (setSearch không có → bảng không có hàng tìm). Kéo tiêu đề thả lên tiêu đề khác = đổi chỗ.
        // lay (useColLayout) → có mép kéo độ rộng + cột đóng băng; cols phải là lay.cols (DT theo tháng: lay.cols đã bung tháng).
        const GridHead = ({ grid, cols, sort, onSort, onMove, search, setSearch, lay }) => {
            const ref = useRef(null);
            const g = useGridCss(ref, cols, lay);
            return (
            <thead ref={ref} className="sticky top-0 z-30">
                <tr className="text-center">
                    <th className={grid.numTh}>#</th>
                    {cols.map(c => c.sort
                        ? <SortableHeader key={c.id} field={c.sort} sort={sort} onSort={onSort} className={c.th} align={c.align} colId={c.id} onColMove={onMove} rz={lay ? colRz(g, c.id) : null}>{c.label}</SortableHeader>
                        : <th key={c.id} className={`${c.th} cursor-move`} title="Kéo sang cột khác để đổi chỗ" draggable
                              onDragStart={e => { if (colResizing) { e.preventDefault(); return; } e.dataTransfer.setData(COL_DND, c.id); }} {...colDropProps(c.id, onMove)}>{c.label}{lay ? colRz(g, c.id) : null}</th>)}
                </tr>
                {setSearch && (
                    <tr className="ds-search-row">
                        <th className="border-r px-1 py-1"></th>
                        {cols.map(c => (
                            <th key={c.id} className="border-r px-1 py-1">
                                {c.search ? <input
                                    type="text"
                                    value={search[c.id] || ''}
                                    onChange={e => setSearch(p => ({...p, [c.id]: e.target.value}))}
                                    className="ds-colsearch"
                                    title={colSearchTitle(c)}
                                /> : null}
                            </th>
                        ))}
                    </tr>
                )}
            </thead>
            );
        };

        // Dòng tổng: nhãn trải qua các cột đứng trước ô tổng đầu tiên, ô tổng nằm đúng dưới cột của nó, cột không có tổng để
        // trống (ô trống liền nhau gộp 1 ô như bản cũ). cells: { [id cột]: <td …/> }.
        // Ô tổng bị kéo lên sát đầu bảng (trước nó < 2 cột) → nhãn sang ĐOẠN CỘT TRỐNG DÀI NHẤT phía sau (≥ 2 cột), khỏi nhét vào cột #
        // hẹp. v1.10.3: tab bán hàng có ô tổng ở gần cuối (Doanh thu 511…) nên không còn chỗ "ra cuối" như labelAfter.
        const GridFoot = ({ cols, trClass, labelClass, label, cells }) => {
            const n = cols.length, at = cols.map(c => !!cells[c.id]);
            const first = at.indexOf(true);
            const labelTd = span => <td key="lab" colSpan={span} className={labelClass}>{label}</td>;
            let lab = null;   // đoạn trống đặt nhãn [từ, tới) theo chỉ số cols; null = trải từ cột # tới trước ô tổng đầu (mặc định)
            if (first >= 0 && first < 2) {
                for (let i = first + 1, s = -1; i <= n; i++) {
                    if (i < n && !at[i]) { if (s < 0) s = i; continue; }
                    if (s >= 0 && i - s >= 2 && (!lab || i - s > lab[1] - lab[0])) lab = [s, i];
                    s = -1;
                }
            }
            const out = [first < 0 ? labelTd(n + 1) : lab ? <td key="lead" colSpan={1 + first} className="border-r"></td> : labelTd(1 + first)];
            for (let i = first, s = -1; first >= 0 && i <= n; i++) {
                if (i < n && !at[i]) { if (s < 0) s = i; continue; }
                if (s >= 0) {
                    if (lab && lab[0] === s) out.push(labelTd(i - s));
                    else if (i < n) out.push(<td key={'g' + s} colSpan={i - s > 1 ? i - s : undefined} className="border-r"></td>);
                    else out.push(<td key="tail" colSpan={i - s}></td>);
                    s = -1;
                }
                if (i < n) out.push(React.cloneElement(cells[cols[i].id], { key: cols[i].id, 'data-c': cols[i].id }));
            }
            return (
                <tfoot className="sticky-footer">
                    <tr className={trClass}>{out}</tr>
                </tfoot>
            );
        };

        // Ô dòng tổng theo grid.foot (v1.10.3). sums = summary của server (tổng toàn bộ truy vấn) hoặc footRowSums. Khoá thiếu trong
        // summary (vd DB không có cột Doanh thu 511) → ô trống, không ghi 0.
        const footCells = (grid, sums) => {
            const o = {};
            Object.keys(grid.foot).forEach(id => {
                const f = grid.foot[id], x = (sums || {})[f.k], n = Number(x || 0);
                o[id] = <td className={f.cls}>{x == null ? '' : f.dec ? n.toLocaleString('en-US', { minimumFractionDigits: f.dec, maximumFractionDigits: f.dec }) : Math.round(n).toLocaleString('en-US')}</td>;
            });
            return o;
        };
        // Ô lọc cột loại bớt dòng trên trang (Trum chốt 28/09) → dòng tổng cộng đúng các dòng đang hiện; không loại dòng nào (chưa gõ,
        // hoặc Truy vấn đã lọc sẵn ở server) → null = dùng tổng toàn bộ truy vấn của server. Cùng số lẻ với ô trên bảng: cộng giá trị gốc.
        const footRowSums = (grid, all, shown) => {
            if (shown.length >= all.length) return null;
            const s = {};
            Object.keys(grid.foot).forEach(id => {
                const f = grid.foot[id];
                let t = 0, any = false;
                shown.forEach(r => { const x = f.v ? f.v(r) : r[id]; if (x != null && x !== '') { any = true; t += Number(x) || 0; } });
                s[f.k] = any || f.v || !shown.length ? t : undefined;
            });
            return s;
        };
        const footShownLabel = (n, unit = 'dòng') => `Tổng các ${unit} đang lọc trên trang (${n.toLocaleString()} ${unit}):`;

        // Nút "Cột" ở chân bảng (góc trái, cạnh phân trang): bật/tắt từng cột, kéo đổi thứ tự, đóng băng trái/phải, khôi phục mặc định;
        // bảng chọn mở lên trên. KHÔNG đặt trên thanh lọc: đo 28/09 thêm 1 nút ở đó là thanh lọc sổ cái ở 1366 px (thanh bên mở) rớt
        // xuống 2 hàng. lay = kết quả useColLayout.
        // Hình nút đóng băng: khung bảng tô đặc mảng bên trái / bên phải (bộ icon chung không có hình hợp — Bẫy 9)
        const PinIcon = ({ side }) => (
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" aria-hidden="true" style={{ display: 'inline-block', verticalAlign: '-2px', flex: 'none' }}>
                <rect x="1.5" y="2.5" width="13" height="11" rx="2"/>
                <rect x={side === 'l' ? 3 : 9} y="4" width="4" height="8" rx="0.5" fill="currentColor" stroke="none"/>
            </svg>
        );
        const PIN_GROUP = { l: 'Đóng băng bên trái', '': 'Cột cuộn ngang', r: 'Đóng băng bên phải' };
        // Tự động tính toán độ rộng vừa khít (AutoFit) cho tất cả các cột theo tiêu đề và nội dung dữ liệu
        // Thiết kế tối ưu quét toàn bộ 100.000+ dòng siêu tốc (<150ms) không gây giật lag main thread
        let measureCanvas = null;
        const autoFitCols = (activeCols, data) => {
            if (!activeCols || !activeCols.length) return {};
            if (!measureCanvas) measureCanvas = document.createElement('canvas');
            const ctx = measureCanvas.getContext('2d');
            const widths = {};
            const rows = Array.isArray(data) ? data : [];
            const nRows = rows.length;

            activeCols.forEach(c => {
                // 1. Đo tiêu đề cột
                ctx.font = '500 12px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif';
                const labelW = ctx.measureText(c.label || '').width;
                // Tiêu đề gồm: label + icon sort (14px) + mép resize (7px) + padding (20px) + khoảng thở (7px)
                let maxW = Math.max(c.search ? 64 : 50, Math.ceil(labelW + 48));

                // 2. Đo nội dung toàn bộ các dòng dữ liệu (tối ưu quét siêu tốc cho cả 100.000+ dòng)
                if (nRows > 0) {
                    ctx.font = '400 12px "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif';
                    let maxDataW = 0;
                    const cid = c.id;
                    const isNum = c.q === 'num';

                    if (isNum) {
                        // Cột số: chỉ tìm giá trị min và max (số âm/dương lớn nhất) trong toàn bộ dữ liệu
                        let maxVal = -Infinity, minVal = Infinity, hasNum = false;
                        for (let i = 0; i < nRows; i++) {
                            const r = rows[i];
                            if (!r || r.isGroup) continue;
                            let v = r[cid];
                            if (v == null) {
                                if (cid === 'DEBIT') v = r.DEBIT_CREDIT === 'DEB' ? r.AMOUNT : null;
                                else if (cid === 'CREDIT') v = r.DEBIT_CREDIT === 'CRD' ? r.AMOUNT : null;
                                else if (typeof c.v === 'function') {
                                    try { v = c.v(r); } catch (e) {}
                                }
                            }
                            if (typeof v === 'string') {
                                const num = parseFloat(v.replace(/,/g, ''));
                                if (!isNaN(num)) v = num;
                            }
                            if (typeof v === 'number' && !isNaN(v)) {
                                hasNum = true;
                                if (v > maxVal) maxVal = v;
                                if (v < minVal) minVal = v;
                            }
                        }
                        if (hasNum) {
                            const cands = [];
                            if (typeof c.v === 'function') {
                                try {
                                    if (cid === 'DEBIT') {
                                        cands.push(c.v({ DEBIT_CREDIT: 'DEB', AMOUNT: maxVal }));
                                    } else if (cid === 'CREDIT') {
                                        cands.push(c.v({ DEBIT_CREDIT: 'CRD', AMOUNT: maxVal }));
                                    } else {
                                        cands.push(c.v({ [cid]: maxVal }));
                                        if (minVal !== maxVal) cands.push(c.v({ [cid]: minVal }));
                                    }
                                } catch (e) {}
                            }
                            if (!cands.length) {
                                cands.push(Math.round(maxVal).toLocaleString('vi-VN'));
                                if (minVal !== maxVal) cands.push(Math.round(minVal).toLocaleString('vi-VN'));
                            }
                            for (let k = 0; k < cands.length; k++) {
                                const candStr = cands[k] != null ? String(cands[k]) : '';
                                if (candStr) {
                                    const tw = ctx.measureText(candStr).width;
                                    if (tw > maxDataW) maxDataW = tw;
                                }
                            }
                        }
                    } else {
                        // Cột văn bản/chuỗi: Thu thập Top 3 chuỗi dài nhất theo ký tự rồi đo Canvas chính xác
                        let t1 = '', t2 = '', t3 = '';
                        let l1 = 0, l2 = 0, l3 = 0;

                        for (let i = 0; i < nRows; i++) {
                            const r = rows[i];
                            if (!r || r.isGroup) continue;
                            let val = r[cid];
                            if (val == null || val === '') {
                                if (cid === 'DESCRIPTION') val = r.DESCRIPTION || r.COMMENTS;
                                else if (typeof c.v === 'function') {
                                    try {
                                        const rendered = c.v(r);
                                        if (rendered != null) {
                                            if (typeof rendered === 'string' || typeof rendered === 'number') val = rendered;
                                            else if (React.isValidElement(rendered)) {
                                                const ch = rendered.props && rendered.props.children;
                                                if (typeof ch === 'string' || typeof ch === 'number') val = ch;
                                                else if (Array.isArray(ch)) val = ch.filter(x => typeof x === 'string' || typeof x === 'number').join('');
                                            }
                                        }
                                    } catch (e) {}
                                }
                            }
                            if (val == null) continue;
                            const str = typeof val === 'string' ? val : String(val);
                            const len = str.length;
                            if (len <= l3) continue;

                            if (len > l1) {
                                t3 = t2; l3 = l2;
                                t2 = t1; l2 = l1;
                                t1 = str; l1 = len;
                            } else if (len > l2) {
                                t3 = t2; l3 = l2;
                                t2 = str; l2 = len;
                            } else {
                                t3 = str; l3 = len;
                            }
                        }

                        // Đo Canvas cho Top 3 chuỗi dài nhất
                        const topCandidates = [t1, t2, t3];
                        for (let k = 0; k < topCandidates.length; k++) {
                            if (!topCandidates[k]) continue;
                            const tw = ctx.measureText(topCandidates[k]).width;
                            if (tw > maxDataW) maxDataW = tw;
                        }
                    }

                    if (maxDataW > 0) {
                        // Ô dữ liệu gồm: text + padding (px-3 = 24px) + border + khoảng thở an toàn (8px) = 33px
                        const cellW = Math.ceil(maxDataW + 33);
                        if (cellW > maxW) maxW = cellW;
                    }
                }

                // Cận: tối thiểu COL_MIN_W (40), tối đa 650px tránh một ô text quá dài kéo tràn bảng
                widths[c.id] = Math.max(COL_MIN_W, Math.min(maxW, 650));
            });

            return widths;
        };

        const ColumnConfigurator = ({ grid, lay, data, cols }) => {
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState(null);
            const [dragId, setDragId] = useState(null);   // chỉ để tô dòng đang kéo
            const dragRef = useRef(null);                  // cột đang kéo — ref vì dragover tới liền sau dragstart, state chưa kịp cập nhật
            const btnRef = useRef(null), panelRef = useRef(null);
            const labels = {};
            grid.cols.forEach(c => { labels[c.id] = c.label; });
            const total = lay.layout.order.length, shown = total - lay.layout.hidden.length;
            const pin = lay.layout.pin, nPin = Object.keys(pin).length;
            const place = () => {
                const b = btnRef.current; if (!b) return;
                const r = b.getBoundingClientRect(), w = Math.min(390, window.innerWidth - 32);
                setPos({ bottom: window.innerHeight - r.top + 8, left: Math.max(16, Math.min(r.left, window.innerWidth - w - 16)), width: w });
            };
            useEffect(() => {
                if (!open) return;
                const onDown = e => { if ((panelRef.current && panelRef.current.contains(e.target)) || (btnRef.current && btnRef.current.contains(e.target))) return; setOpen(false); };
                const onKey = e => { if (e.key === 'Escape') setOpen(false); };
                window.addEventListener('resize', place);
                document.addEventListener('mousedown', onDown);
                document.addEventListener('keydown', onKey);
                return () => { window.removeEventListener('resize', place); document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
            }, [open]);

            const handleAutoFit = () => {
                const targetCols = cols || lay.cols;
                const newWidths = autoFitCols(targetCols, data);
                lay.setWidths(newWidths);
            };

            return (
                <>
                    <button ref={btnRef} type="button" onClick={() => { if (open) setOpen(false); else { place(); setOpen(true); } }}
                            title={'Chọn cột hiện trên bảng, thứ tự cột, đóng băng cột' + (nPin ? ` · Đang đóng băng ${nPin} cột` : '')}
                            className={`ds-colbtn ${shown < total || nPin ? 'is-on' : ''} ${open ? 'is-open' : ''}`}>
                        <Icon name="columns" size={14} stroke={2}/>
                        <span>Cột</span>
                        {shown < total && <span className="tabular-nums">{shown}/{total}</span>}
                        {nPin > 0 && <PinIcon side={Object.values(pin).includes('l') ? 'l' : 'r'}/>}
                        <Icon name={open ? 'chevron-down' : 'chevron-up'} size={12} stroke={2}/>
                    </button>
                    {open && pos && (
                        <div ref={panelRef} className="ds-pop ds-pop-in ds-afp ds-colcfg" style={{ bottom: pos.bottom, left: pos.left, width: pos.width }} role="dialog" aria-label="Cột hiển thị">
                            <div className="ds-afp-head">
                                <Icon name="columns" size={16} stroke={2}/>
                                <b>Cột hiển thị</b>
                                <span className="ds-badge is-soft tabular-nums">{shown}/{total}</span>
                                <button type="button" className="ds-afp-link" disabled={shown === total} onClick={lay.showAll}>Hiện tất cả</button>
                                <button type="button" className="ds-iconbtn" onClick={() => setOpen(false)} title="Đóng (Esc)"><Icon name="x" size={16} stroke={2}/></button>
                            </div>
                            <div className="ds-afp-hint">Bật để hiện cột, kéo để đổi thứ tự, bấm <PinIcon side="l"/> / <PinIcon side="r"/> để đóng băng cột bên trái / bên phải (cuộn ngang vẫn đứng yên). Đổi độ rộng: kéo mép phải tiêu đề cột trên bảng, bấm đúp mép để về tự động.</div>
                            <div className="ds-afp-list custom-scrollbar">
                                {lay.list.map((id, i) => {
                                    const on = !lay.layout.hidden.includes(id);
                                    const lastOne = on && shown <= 1;
                                    const side = pin[id] || '';
                                    const head = nPin > 0 && (i === 0 || (pin[lay.list[i - 1]] || '') !== side);
                                    return (
                                        <React.Fragment key={id}>
                                            {head && <div className="ds-afp-grp">{PIN_GROUP[side]}</div>}
                                            <div draggable className={`ds-afp-row ${dragId === id ? 'is-drag' : ''}`}
                                                 onDragStart={e => { dragRef.current = id; setDragId(id); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('application/x-ds-colcfg', id); }}
                                                 onDragOver={e => { if (!dragRef.current) return; e.preventDefault(); lay.moveOver(dragRef.current, id); }}
                                                 onDrop={e => e.preventDefault()}
                                                 onDragEnd={() => { dragRef.current = null; setDragId(null); }}>
                                                <Icon name="grip" size={16} stroke={2}/>
                                                <span className={`ds-colname ${on ? 'is-on' : ''}`} title={labels[id]}>{labels[id]}</span>
                                                <span className="ds-pin">
                                                    {['l', 'r'].map(s => (
                                                        <button key={s} type="button" aria-pressed={side === s} className={side === s ? 'is-on' : ''}
                                                                title={side === s ? 'Bỏ đóng băng cột này' : s === 'l' ? 'Đóng băng bên trái (đầu danh sách)' : 'Đóng băng bên phải (cuối danh sách)'}
                                                                onClick={() => lay.setPin(id, side === s ? '' : s)}><PinIcon side={s}/></button>
                                                    ))}
                                                </span>
                                                <button type="button" role="switch" aria-checked={on} aria-label={`Hiện cột "${labels[id]}"`} disabled={lastOne}
                                                        title={lastOne ? 'Bảng phải còn ít nhất 1 cột' : ''}
                                                        onClick={() => lay.toggle(id)} className={`ds-switch ${on ? 'is-on' : ''}`}><i></i></button>
                                            </div>
                                        </React.Fragment>
                                    );
                                })}
                            </div>
                            <div className="ds-afp-foot">
                                <div className="flex items-center gap-1.5 mr-auto">
                                    <button type="button" className="ds-btn" onClick={lay.reset} title="Hiện đủ cột, về thứ tự ban đầu, bỏ đóng băng và trả độ rộng về mặc định">Khôi phục mặc định</button>
                                    <button type="button" className="ds-btn" onClick={handleAutoFit} title="Tự động căn chỉnh độ rộng tất cả các cột vừa khít theo nội dung">Độ rộng tự động</button>
                                </div>
                                <button type="button" className="ds-btn ds-btn-pri" onClick={() => setOpen(false)}>Xong</button>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const fmtRate = r => {
            if (r.VAT_TAX_RATE == null || r.VAT_TAX_RATE === '') return '';
            if (r.VAT_TAX_RATE === -1 || r.VAT_TAX_RATE === '-1' || r.VAT_TAX_RATE === 'KCT') return 'KCT';
            return r.VAT_TAX_RATE + '%';
        };
        const GRP_TOTAL  = { TOTAL_AMOUNT: { sum: 'TOTAL_AMOUNT', dec: 0, bold: true, color: 'text-emerald-600' } };
        const GRP_AMOUNT = { AMOUNT: { sum: 'AMOUNT', dec: 0, bold: true, color: 'text-emerald-600' } };

        const LEDGER_GRID = {
            numTh: 'border-r w-14', numTd: 'border-r text-center', tr: 'hover:bg-indigo-50 border-b border-slate-50',
            grp: { DEBIT: { sum: 'DEBIT', dec: 2, color: 'text-indigo-700' }, CREDIT: { sum: 'CREDIT', dec: 2, color: 'text-indigo-700' } },
            foot: {
                DEBIT:  { k: 'total_debit',  dec: 2, v: r => r.DEBIT_CREDIT === 'DEB' ? r.AMOUNT : null, cls: 'border-r text-right px-4 text-emerald-700 bg-emerald-100/40' },
                CREDIT: { k: 'total_credit', dec: 2, v: r => r.DEBIT_CREDIT === 'CRD' ? r.AMOUNT : null, cls: 'border-r text-right px-4 text-red-700 bg-red-100/40' },
            },
            cols: [
                { id: 'TRAN_DATE',             label: 'Ngày CT',        sort: 'TRAN_DATE',           th: 'border-r w-28',                     search: 2, td: 'border-r text-center font-bold' },
                { id: 'TRAN_NO',               label: 'Số chứng từ',    sort: 'TRAN_NO',             th: 'border-r w-36 px-3',                search: 2, td: 'border-r font-black px-3', q: 'pre' },
                { id: 'TRAN_ID',               label: 'Mã CT',          sort: 'TRAN_ID',             th: 'border-r w-16',                     search: 2, td: 'border-r text-center italic', q: 'pre' },
                { id: 'TRAN_NAME',             label: 'Tên chứng từ',   sort: 'TRAN_ID',             th: 'border-r w-40 px-3',                search: 1, td: 'border-r whitespace-nowrap px-3 italic' },
                { id: 'ACCOUNT_ID',            label: 'Tài khoản',      sort: 'ACCOUNT_ID',          th: 'border-r w-24',                     search: 2, td: 'border-r text-center font-black text-indigo-600', q: 'pre' },
                { id: 'ACCOUNT_ID_CONTRA',     label: 'Đối ứng',        sort: 'ACCOUNT_ID_CONTRA',   th: 'border-r w-24',                     search: 2, td: 'border-r text-center', q: 'pre' },
                { id: 'DESCRIPTION',           label: 'Diễn giải',      sort: 'DESCRIPTION',         th: 'border-r w-64 px-3', align: 'left', search: 2, td: 'border-r whitespace-nowrap truncate max-w-[250px] px-3 py-1.5', v: r => r.DESCRIPTION || r.COMMENTS },
                { id: 'DEBIT',                 label: 'Nợ',             sort: 'AMOUNT',              th: 'border-r w-44 px-4', align: 'right', search: 2, td: 'border-r text-right font-mono font-black text-emerald-600 px-4', v: r => r.DEBIT_CREDIT === 'DEB' ? fmtNum(r.AMOUNT) : '', q: 'num' },
                { id: 'CREDIT',                label: 'Có',             sort: 'AMOUNT',              th: 'border-r w-44 px-4', align: 'right', search: 2, td: 'border-r text-right font-mono font-black text-red-600 px-4', v: r => r.DEBIT_CREDIT === 'CRD' ? fmtNum(r.AMOUNT) : '', q: 'num' },
                { id: 'PR_DETAIL_ID',          label: 'Mã ĐT',          sort: 'PR_DETAIL_ID',        th: 'border-r w-24',                     search: 1, td: 'border-r text-center italic', q: 'pre' },
                { id: 'PR_DETAIL_NAME',        label: 'Đối tượng',      sort: 'PR_DETAIL_ID',        th: 'border-r w-56 px-3', align: 'left', search: 2, td: 'border-r whitespace-nowrap italic px-3' },
                { id: 'PR_DETAIL_ID_CONTRA',   label: 'Mã ĐT ĐƯ',       sort: 'PR_DETAIL_ID_CONTRA', th: 'border-r w-24',                     search: 1, td: 'border-r text-center font-bold text-teal-700', q: 'pre' },
                { id: 'PR_DETAIL_NAME_CONTRA', label: 'Đối tượng ĐƯ',   sort: 'PR_DETAIL_ID_CONTRA', th: 'border-r w-56 px-3', align: 'left', search: 1, td: 'border-r whitespace-nowrap italic px-3 text-teal-700' },
                { id: 'EXPENSE_ID',            label: 'Mã MCP',         sort: 'EXPENSE_ID',          th: 'border-r w-24',                     search: 1, td: 'border-r text-center italic', q: 'pre' },
                { id: 'EXPENSE_NAME',          label: 'Mục chi phí',    sort: 'EXPENSE_ID',          th: 'border-r w-44 px-4', align: 'left', search: 2, td: 'border-r whitespace-nowrap italic px-4' },
                { id: 'EXPENSE_ID_CONTRA',     label: 'Mã MCP ĐƯ',      sort: 'EXPENSE_ID_CONTRA',   th: 'border-r w-24',                     search: 1, td: 'border-r text-center font-bold text-teal-700', q: 'pre' },

                { id: 'ITEM_NAME_CONTRA',      label: 'Hàng hóa ĐƯ',    sort: 'ITEM_ID_CONTRA',      th: 'border-r w-44 px-4', align: 'left', search: 1, td: 'border-r px-4 whitespace-nowrap italic text-teal-700' },
                { id: 'JOB_ID',                label: 'Mã CV',          sort: 'JOB_ID',              th: 'border-r w-24',                     search: 1, td: 'border-r text-center italic', q: 'pre' },
                { id: 'JOB_NAME',              label: 'Công việc',      sort: 'JOB_ID',              th: 'border-r w-44 px-4', align: 'left', search: 1, td: 'border-r px-4 whitespace-nowrap italic' },
                { id: 'JOB_ID_CONTRA',         label: 'Mã CV ĐƯ',       sort: 'JOB_ID_CONTRA',       th: 'border-r w-24',                     search: 1, td: 'border-r text-center font-bold text-teal-700', q: 'pre' },
                { id: 'JOB_NAME_CONTRA',       label: 'Công việc ĐƯ',   sort: 'JOB_ID_CONTRA',       th: 'border-r w-44 px-4', align: 'left', search: 1, td: 'border-r px-4 whitespace-nowrap italic text-teal-700' },
                { id: 'PRODUCT_ID',            label: 'Mã SP',          sort: 'PRODUCT_ID',          th: 'border-r w-24',                     search: 1, td: 'border-r text-center italic', q: 'pre' },
                { id: 'PRODUCT_NAME',          label: 'Sản phẩm',       sort: 'PRODUCT_ID',          th: 'border-r w-44 px-4', align: 'left', search: 2, td: 'border-r px-4 whitespace-nowrap italic' },
                { id: 'BANK_ID',               label: 'Mã NH',          sort: 'BANK_ID',             th: 'border-r w-24',                     search: 1, td: 'border-r text-center font-bold text-indigo-700', q: 'pre' },
                { id: 'BANK_NAME',             label: 'Ngân hàng',      sort: 'BANK_ID',             th: 'border-r w-44 px-4', align: 'left', search: 1, td: 'border-r px-4 whitespace-nowrap italic text-indigo-700' },
                { id: 'BANK_ID_CONTRA',        label: 'Mã NH ĐƯ',       sort: 'BANK_ID_CONTRA',      th: 'border-r w-24',                     search: 1, td: 'border-r text-center font-bold text-teal-700', q: 'pre' },

        const incomeMonthRangeMeta = (range) => {
            let a = ymIdx(range.from), b = ymIdx(range.to);
            if (b < a) [a, b] = [b, a];
            if (b - a + 1 > MONTH_RANGE_MAX) a = b - MONTH_RANGE_MAX + 1;
            const months = [];
            for (let i = a; i <= b; i++) { const p = ymOf(i); months.push({ key: `M${p.y}${String(p.m).padStart(2, '0')}`, year: p.y, month: p.m }); }

            const qs = Object.keys(cs).filter(k => (cs[k] || '').trim() !== '').map(k => [k, cs[k].trim().toLowerCase()]);
