        const SortableHeader = ({ field, sort, onSort, className = '', children, align = 'center', colId, onColMove, rz }) => {
            const active = sort.field === field;
            const dir = active ? sort.dir : null;
            const justify = align === 'right' ? 'justify-end' : align === 'left' ? 'justify-start' : 'justify-center';
            return (
                <th
                    className={`sortable-th ${className} ${active ? 'is-sorted' : ''} cursor-move`}
                    onClick={() => onSort(field)}
                    title={onColMove ? 'Bấm để sắp xếp · Kéo sang cột khác để đổi chỗ · Kéo vào "Gom nhóm" để gom nhóm' : 'Bấm để sắp xếp / Nắm kéo thả để gom nhóm'}
                    draggable
                    onDragStart={e => { if (colResizing) { e.preventDefault(); return; } e.dataTransfer.setData('text/plain', field); if (onColMove) e.dataTransfer.setData(COL_DND, colId); }}
                    {...(onColMove ? colDropProps(colId, onColMove) : null)}
                >
                    <div className={`flex items-center gap-1 ${justify}`}>
                        <span>{children}</span>
                        <span className="sort-icon inline-flex">
                            {dir === 'asc'  ? <Icon name="arrow-up"     size={10}/>
                             : dir === 'desc' ? <Icon name="arrow-down"   size={10}/>
                             : <Icon name="arrows-updown" size={10}/>}
                        </span>
                    </div>
                    {rz}
                </th>
            );
        };

        // ===== BỘ LỌC NÂNG CAO (27/09/2026) — thay nút "Bộ lọc khác" xổ hàng lọc thứ 2 =====
        // items: [{ key, label, node, active, clear }] — node là JSX ô lọc CŨ của tab (props/handler giữ nguyên, chỉ đổi chỗ đặt).
        // Ô nằm trong defaultOutside (= hàng chính cũ) hiện ngoài thanh lọc; còn lại nằm trong panel. Người dùng bật/tắt (tối đa
        // FILTER_OUT_MAX) và kéo đổi thứ tự; nhớ theo tab ở localStorage['ds_filters_<tab>']. Kỳ + ô ngày luôn cố định, không nằm đây.
        const FILTER_OUT_MAX = 4;
        const readFilterCfg = (tab, keys, defaultOutside) => {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem('ds_filters_' + tab) || 'null'); } catch (e) {}
            const order = saved && Array.isArray(saved.order) ? saved.order.filter(k => keys.includes(k)) : [];
            keys.forEach(k => { if (!order.includes(k)) order.push(k); });   // ô lọc mới thêm sau → nối cuối
            const outside = (saved && Array.isArray(saved.outside) ? saved.outside : defaultOutside).filter(k => keys.includes(k)).slice(0, FILTER_OUT_MAX);
            return { order, outside };
        };
        const FilterConfigurator = ({ tab, items, defaultOutside, onApply, setActiveDropdown }) => {
            const keys = items.map(i => i.key);
            const byKey = {}; items.forEach(i => { byKey[i.key] = i; });
            const [cfg, setCfg] = useState(() => readFilterCfg(tab, keys, defaultOutside));
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState(null);
            const [cfgOpen, setCfgOpen] = useState(() => { try { return localStorage.getItem('ds_filters_cfg_open') !== '0'; } catch (e) { return true; } });
            const [dragKey, setDragKey] = useState(null);   // chỉ để tô dòng đang kéo
            const dragRef = useRef(null);                   // ô đang kéo — ref vì dragover tới liền sau dragstart, state chưa kịp cập nhật
            const btnRef = useRef(null), panelRef = useRef(null);
            const order = cfg.order.filter(k => byKey[k]);
            const outside = order.filter(k => cfg.outside.includes(k));
            const hidden = order.filter(k => !cfg.outside.includes(k));
            const hiddenActive = hidden.filter(k => byKey[k].active).length;
            const save = next => { setCfg(next); try { localStorage.setItem('ds_filters_' + tab, JSON.stringify(next)); } catch (e) {} };
            const place = () => {
                const b = btnRef.current; if (!b) return;
                const r = b.getBoundingClientRect(), w = Math.min(760, window.innerWidth - 32);
                setPos({ top: r.bottom + 8, left: Math.max(16, Math.min(r.left, window.innerWidth - w - 16)), width: w });
            };
            const close = () => { setActiveDropdown(null); setOpen(false); };
            useEffect(() => {
                if (!open) return;
                const onDown = e => { if ((panelRef.current && panelRef.current.contains(e.target)) || (btnRef.current && btnRef.current.contains(e.target))) return; close(); };
                const onKey = e => { if (e.key === 'Escape') close(); };
                window.addEventListener('resize', place);
                document.addEventListener('mousedown', onDown);
                document.addEventListener('keydown', onKey);
                return () => { window.removeEventListener('resize', place); document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
            }, [open]);
            const switchOut = k => {
                const on = cfg.outside.includes(k);
                if (!on && cfg.outside.length >= FILTER_OUT_MAX) return;
                save({ ...cfg, outside: on ? cfg.outside.filter(x => x !== k) : [...cfg.outside, k] });
            };
            const moveOver = overKey => {
                const dk = dragRef.current;
                if (!dk || dk === overKey) return;
                const next = order.filter(k => k !== dk);
                next.splice(order.indexOf(overKey), 0, dk);
                save({ ...cfg, order: next });
            };
            const toggleCfg = () => { const v = !cfgOpen; setCfgOpen(v); try { localStorage.setItem('ds_filters_cfg_open', v ? '1' : '0'); } catch (e) {} };
            return (
                <>
                    {outside.map(k => <div key={k} className="ds-slot">{byKey[k].node}</div>)}
                    <button ref={btnRef} type="button" onClick={() => { if (open) close(); else { place(); setActiveDropdown(null); setOpen(true); } }}
                            title="Bộ lọc nâng cao — chọn ô lọc hiện ra ngoài"
                            className={`ds-chip ${open || hiddenActive > 0 ? 'is-on' : ''} ${open ? 'is-open' : ''}`}>
                        <Icon name="sliders" size={14} stroke={2}/>
                        <span>Bộ lọc khác</span>
                        {hiddenActive > 0 && <span className="ds-badge">{hiddenActive}</span>}
                        <Icon name={open ? 'chevron-up' : 'chevron-down'} size={12} stroke={2}/>
                    </button>
                    {open && pos && (
                        <div ref={panelRef} className="ds-pop ds-pop-in ds-afp" style={{ top: pos.top, left: pos.left, width: pos.width }} role="dialog" aria-label="Bộ lọc nâng cao">
                            <div className="ds-afp-head">
                                <Icon name="sliders" size={16} stroke={2}/>
                                <b>Bộ lọc nâng cao</b>
                                <button type="button" className="ds-afp-link" disabled={hiddenActive === 0} onClick={() => hidden.forEach(k => byKey[k].active && byKey[k].clear())}>Xoá tất cả</button>
                                <button type="button" className="ds-iconbtn" onClick={close} title="Đóng (Esc)"><Icon name="x" size={16} stroke={2}/></button>
                            </div>
                            <div className="ds-afp-body">
                                {hidden.length > 0
                                    ? <div className="ds-afp-grid">{hidden.map(k => <div key={k}>{byKey[k].node}</div>)}</div>
                                    : <div className="ds-afp-empty">Mọi ô lọc đang hiện ngoài thanh lọc. Tắt bớt ở phần cấu hình bên dưới để đưa vào đây.</div>}
                            </div>
                            <div className="ds-afp-cfg">
                                <button type="button" className="ds-afp-cfghead" onClick={toggleCfg} aria-expanded={cfgOpen}>
                                    <b>Cấu hình tham số lọc</b>
                                    <span className="ds-badge is-soft">{outside.length}</span>
                                    <span>tối đa chọn {FILTER_OUT_MAX} ô lọc để đưa ra bên ngoài</span>
                                    <Icon name={cfgOpen ? 'chevron-up' : 'chevron-down'} size={14} stroke={2}/>
                                </button>
                                {cfgOpen && (
                                    <>
                                        <div className="ds-afp-hint">Bật để hiện ngoài, kéo để đổi thứ tự</div>
                                        <div className="ds-afp-list custom-scrollbar">
                                            {order.map(k => {
                                                const on = cfg.outside.includes(k);
                                                const full = !on && cfg.outside.length >= FILTER_OUT_MAX;
                                                return (
                                                    <div key={k} draggable className={`ds-afp-row ${dragKey === k ? 'is-drag' : ''}`}
                                                         onDragStart={e => { dragRef.current = k; setDragKey(k); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('application/x-ds-filter', k); }}
                                                         onDragOver={e => { if (!dragRef.current) return; e.preventDefault(); moveOver(k); }}
                                                         onDrop={e => e.preventDefault()}
                                                         onDragEnd={() => { dragRef.current = null; setDragKey(null); }}>
                                                        <Icon name="grip" size={16} stroke={2}/>
                                                        <span className={on ? 'is-on' : ''}>{byKey[k].label}</span>
                                                        <button type="button" role="switch" aria-checked={on} aria-label={`Hiện "${byKey[k].label}" ngoài thanh lọc`} disabled={full}
                                                                title={full ? `Đã đủ ${FILTER_OUT_MAX} ô lọc bên ngoài — tắt bớt một ô trước` : ''}
                                                                onClick={() => switchOut(k)} className={`ds-switch ${on ? 'is-on' : ''}`}><i></i></button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </>
                                )}
                            </div>
                            <div className="ds-afp-foot">
                                <button type="button" className="ds-btn" onClick={close}>Đóng</button>
                                <button type="button" className="ds-btn ds-btn-pri" onClick={() => { close(); onApply(); }}>Lọc</button>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const IssueReceiveDropdown = ({ value, onChange, isActive, onToggle }) => {
            const ref = useRef(null);
            useEffect(() => {
                const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) onToggle(null); };
                if (isActive) document.addEventListener('mousedown', handler);

            const OPTIONS = [

            return (

                    <button type="button" onClick={() => onToggle(isActive ? null : 'issueReceive')}

            { id: 'ledger',    name: 'Danh sách chứng từ tổng hợp' },

            // Tồn kho thực tế: ẩn khỏi thanh bên theo Trum (28/09/2026, v1.10.4). Code tab + /api/warehouse_balance giữ nguyên
            // — bật lại = bỏ comment dòng dưới. activeTab không nhớ qua lần mở app nên không máy nào kẹt ở tab đã ẩn.

        // ===== KHUNG APP DataStudio (Đợt 1 nâng cấp giao diện — 27/09/2026) =====
        // Thanh bên trái thay thanh đen trên cùng + dropdown "Danh sách chứng từ"; thanh trạng thái dưới đáy.
        // Chỉ đổi khung — nội dung từng tab giữ nguyên. Danh sách lấy từ DOC_TABS / REPORT_TYPES (thêm tab/báo cáo ở đó là
        // tự hiện ở đây); map dưới chỉ thêm tên ngắn + icon. CSS: class ds-* trong <style> đầu file.
        const NAV_DOC_META = {

            warehouse:         ['Chứng từ kho', 'package'],
            income_alloc:      ['Doanh thu chờ phân bổ', 'clock'],
            income_alloc_month: ['Doanh thu chờ phân bổ theo tháng', 'calendar'],
            warehouse_balance: ['Tồn kho thực tế', 'layers'],
            pr_detail:         ['Danh mục đối tượng', 'user'],

        const NAV_REPORT_META = {
            BC005: ['Cân đối kế toán', 'Bảng cân đối kế toán'],
            BC006: ['Cân đối phát sinh', 'Bảng cân đối phát sinh'],
            BC007: ['Nhật ký chung', 'Sổ nhật ký chung (S03a-DN)'],
            BC008: ['Sổ chi tiết tài khoản', 'Sổ chi tiết tài khoản'],
            BC009: ['LCTT trực tiếp', 'Lưu chuyển tiền tệ — trực tiếp (B03-DN)'],
            BC010: ['LCTT gián tiếp', 'Lưu chuyển tiền tệ — gián tiếp (B03-DN)'],
            BC011: ['TH phát sinh công nợ', 'Tổng hợp phát sinh công nợ'],
            BC012: ['Sổ quỹ tiền mặt, NH', 'Sổ tiền mặt và tiền ngân hàng'],
            BC013: ['Bảng kê thuế GTGT', 'Bảng kê thuế GTGT bán ra / mua vào'],
            BC014: ['Sổ chi tiết TK công nợ', 'Sổ chi tiết tài khoản công nợ'],
            BC015: ['Nhập xuất tồn', 'Báo cáo nhập xuất tồn'],
        };
        const NAV_DOCS = DOC_TABS.map(t => ({ id: t.id, label: (NAV_DOC_META[t.id] || [t.name])[0], icon: (NAV_DOC_META[t.id] || [])[1] || 'table' }));
        const NAV_REPORTS = [...REPORT_TYPES].sort((a, b) => a.id.localeCompare(b.id))
            .map(r => ({ id: r.id, label: (NAV_REPORT_META[r.id] || [r.name])[0], full: (NAV_REPORT_META[r.id] || [])[1] || r.name }));

        const NAV_SECS = [
            { id: 'data',   label: 'Dữ liệu', icon: 'table' },
            { id: 'report', label: 'Báo cáo', icon: 'file-text' },
        ];
        // Tooltip tên bảng / báo cáo ở thanh bên (v1.10.6, Trum 29/09: "tên nào quá dài thì rê chuột mở tooltip"). Rê chuột 280 ms → hiện
        // cạnh mục, có hiệu ứng hiện mờ (.ds-navtip). CHỈ hiện khi: tên bị cắt "…" (đo scrollWidth), thanh bên thu gọn (chỉ còn icon /
        // mã), hoặc báo cáo đang hiện tên viết tắt (full ≠ label, vd "LCTT trực tiếp"). Thay title gốc của trình duyệt (hiện chậm ~1 s).
        const useNavTip = (collapsed) => {
            const [tip, setTip] = useState(null);
            const timer = useRef(null);
            const hide = () => { clearTimeout(timer.current); setTip(null); };
            const show = (e, text, sub, force) => {
                const el = e.currentTarget, lab = el.querySelector('.ds-label');
                const cut = !!lab && lab.scrollWidth > lab.clientWidth + 1;
                clearTimeout(timer.current);
                if (!collapsed && !cut && !force) { setTip(null); return; }
                timer.current = setTimeout(() => {
                    const r = el.getBoundingClientRect();
                    setTip({ text, sub, x: Math.round(r.right + 10), y: Math.round(r.top + r.height / 2) });
                }, 280);
            };
            useEffect(() => () => clearTimeout(timer.current), []);
            useEffect(hide, [collapsed]);
            const node = tip && createPortal(<div className="ds-navtip" role="tooltip" style={{ left: tip.x, top: tip.y }}>{tip.text}{tip.sub && <small>{tip.sub}</small>}</div>, document.body);
            return { show, hide, node };
        };

        // refresh = metaRefresh của App: null | { phase: 'busy' | 'ok' | 'err', title, text, ms, id }
        const AppSidebar = ({ collapsed, onToggleCollapsed, activeTab, reportType, onPickTab, onPickReport, refresh, onRefresh, onLogout }) => {
            const tip = useNavTip(collapsed);
            // Thẻ Dữ liệu / Báo cáo chỉ đổi DANH SÁCH đang xem — trang đang mở giữ nguyên tới khi bấm 1 mục.
            // Trang đang mở chuyển nhóm (chọn báo cáo, chọn tab dữ liệu) → thẻ đi theo.
            const pageSec = activeTab === 'report' ? 'report' : 'data';
            const [sec, setSec] = useState(pageSec);
            useEffect(() => { setSec(pageSec); }, [pageSec]);
            const phase = refresh ? refresh.phase : null;
            const refreshTitle = phase === 'busy' ? 'Đang tải lại danh mục…'
                : phase ? `${refresh.title}${refresh.text ? '\n' + refresh.text : ''}`

            return (
                <aside className={`app-sidebar ds-rail ${collapsed ? 'is-collapsed' : ''}`} onScroll={tip.hide}>
                    <div className="ds-brand">
                        <svg viewBox="0 0 200 200" width="22" height="22" className="shrink-0" aria-hidden="true">
                            <rect width="200" height="200" rx="45" fill="#FF9D3D"/>
                            <rect x="40" y="40" width="120" height="120" rx="30" fill="none" stroke="white" strokeWidth="20"/>
                        </svg>
                        <b>{APP_NAME}</b>
                        <button type="button" className="ds-toggle" onClick={onToggleCollapsed} title={collapsed ? 'Mở rộng thanh bên' : 'Thu gọn thanh bên'}>
                            <Icon name="panel-left" size={16} stroke={1.75} />
                        </button>
                    </div>
                    <div className="ds-navtabs" role="tablist" aria-label="Nhóm chức năng">
                        {NAV_SECS.map(s => (
                            <button key={s.id} type="button" role="tab" aria-selected={sec === s.id} onClick={() => setSec(s.id)}
                                title={pageSec === s.id && sec !== s.id ? `${s.label} — trang đang mở nằm ở đây` : s.label}
                                className={`${sec === s.id ? 'is-on' : ''} ${pageSec === s.id && sec !== s.id ? 'has-page' : ''}`}>
                                <Icon name={s.icon} size={15} stroke={1.75} /><span className="ds-label">{s.label}</span>
                            </button>
                        ))}
                    </div>
                    {/* key={sec}: đổi thẻ là lắp lại danh sách → chạy hiệu ứng hiện (dsNavIn) */}
                    <div key={sec} className="ds-navlist" role="tabpanel">
                        {sec === 'data' ? NAV_DOCS.map(t => (
                            <button key={t.id} type="button" aria-label={t.label} onClick={() => { tip.hide(); onPickTab(t.id); }} className={`ds-nav ${activeTab === t.id ? 'is-on' : ''}`}
                                onMouseEnter={e => tip.show(e, t.label)} onMouseLeave={tip.hide} onFocus={e => tip.show(e, t.label)} onBlur={tip.hide}>
                                <Icon name={t.icon} size={16} stroke={1.75} /><span className="ds-label">{t.label}</span>
                            </button>
                        )) : NAV_REPORTS.map(r => (
                            <button key={r.id} type="button" aria-label={`${r.id} · ${r.full}`} onClick={() => { tip.hide(); onPickReport(r.id); }} className={`ds-nav ${activeTab === 'report' && reportType === r.id ? 'is-on' : ''}`}
                                onMouseEnter={e => tip.show(e, r.full, r.id, r.full !== r.label)} onMouseLeave={tip.hide} onFocus={e => tip.show(e, r.full, r.id, r.full !== r.label)} onBlur={tip.hide}>
                                <span className="ds-code">{r.id}</span><span className="ds-label">{r.label}</span>
                            </button>
                        ))}
                    </div>
                    {tip.node}
                    <div className="ds-spacer"></div>
                    <button id="btn-refresh-meta" type="button" onClick={onRefresh} disabled={phase === 'busy'} title={refreshTitle}
                        className={`ds-nav ${phase === 'busy' ? 'is-busy' : phase === 'ok' ? 'is-done' : phase === 'err' ? 'is-fail' : ''}`}>
                        {phase === 'ok' ? <span key={refresh.id} className="ds-okdot"><Icon name="check" size={11} stroke={3} className="ds-draw" /></span>
                            : <Icon name={phase === 'err' ? 'alert-circle' : 'refresh-cw'} size={16} stroke={1.75} />}
                        <span className="ds-label">{phase === 'busy' ? 'Đang tải danh mục…' : phase === 'ok' ? 'Đã cập nhật danh mục' : phase === 'err' ? 'Tải danh mục lỗi' : 'Tải lại danh mục'}</span>
                    </button>
                    <button type="button" onClick={onLogout} title="Đăng xuất" className="ds-nav">
                        <Icon name="log-out" size={16} stroke={1.75} /><span className="ds-label">Đăng xuất</span>
                    </button>
                </aside>
            );
        };

        // Thẻ báo kết quả "Tải lại danh mục" — đứng cạnh nút, trên thanh trạng thái. Tự ẩn do App (hẹn giờ theo metaRefresh);
        // --ds-toast-out cho hiệu ứng mờ dần chạy ngay trước lúc App gỡ thẻ.
        const META_TOAST_MS = { ok: 3600, err: 8000 };
        const MetaToast = ({ refresh, collapsed, onClose }) => {
            if (!refresh || refresh.phase === 'busy') return null;
            const ok = refresh.phase === 'ok', life = META_TOAST_MS[refresh.phase];
            return (
                <div key={refresh.id} className={`ds-toast ${ok ? 'is-ok' : 'is-bad'}`} role={ok ? 'status' : 'alert'}
                    style={{ left: (collapsed ? 56 : 216) + 12, '--ds-toast-out': (life - 200) + 'ms' }}>
                    <span className="ds-toast-ic">{ok ? <Icon name="check" size={13} stroke={3} className="ds-draw" /> : <Icon name="alert-circle" size={15} stroke={2} />}</span>
                    <div className="ds-toast-body">
                        <b>{refresh.title}</b>
                        {refresh.parts ? <span>{refresh.parts.map((p, i) => <React.Fragment key={i}>{i ? ' · ' : ''}<em>{p}</em></React.Fragment>)}</span>
                            : refresh.text && <ErrText text={refresh.text} />}
                        {ok && refresh.ms != null && <small>Xong sau {fmtSec(refresh.ms)}</small>}
                    </div>
                    <button type="button" className="ds-toast-x" onClick={onClose} title="Đóng"><Icon name="x" size={14} stroke={2} /></button>
                    <i className="ds-toast-bar" style={{ animationDuration: life + 'ms' }} />
                </div>
            );
        };

        // Nút "Xuất Excel" của 8 tab dữ liệu → mở hộp Xuất danh sách (v1.12.1, Trum 05/10: "giống như xuất bên báo cáo") — chọn định
        // dạng, cột, tên file, thư mục ngay trong hộp (ReportExportDialog, cfg dựng ở App: listExportCfg). Trước đây là menu thả xuống.
        // Khai báo ngoài App: component khai trong thân App bị gỡ-lắp lại mỗi lần App vẽ (từng làm menu cũ chớp nháy — v1.10.5).
        const ExportButton = ({ kind, onOpen }) => (
            <button type="button" onClick={() => onOpen(kind)} className="ds-btn shrink-0" title="Xuất Excel hoặc CSV: chọn cột, tên file, thư mục lưu">
                <Icon name="file-spreadsheet" size={14} stroke={2} className="ds-ic-ok"/>
                <span>Xuất Excel</span>
            </button>
        );
        // Tên file mặc định của từng danh sách — giữ đúng tên máy chủ vẫn đặt trước v1.12.1 (…_<từ ngày>-<đến ngày>)
        const LIST_FILE_PREFIX = {
            ledger: 'ChungTuTongHop', sale: 'ChungTuBanHang', voucher: 'ChungTuTien', purchase: 'PhieuNhapKho', warehouse: 'ChungTuKho',
            income_alloc: 'DoanhThuChoPhanBo', income_alloc_month: 'DoanhThuChoPhanBoTheoThang', warehouse_balance: 'TonKhoThucTe',
            pr_detail: 'DanhMucDoiTuong',
        };

        // children: nút nằm cùng dòng tiêu đề (hiện chỉ có Bán ra | Mua vào của BC013)
        const AppPageHeader = ({ activeTab, reportType, children }) => {
            if (activeTab === 'report') {
                const r = NAV_REPORTS.find(x => x.id === reportType);
                return <div className="app-pagehead ds-head"><h1>{r ? r.label : reportType}</h1><span>{reportType}{r ? ` · ${r.full}` : ''}</span>{children}</div>;
            }
            const d = NAV_DOCS.find(x => x.id === activeTab);
            return <div className="app-pagehead ds-head"><h1>{d ? d.label : ''}</h1></div>;
        };

        // Server-Timing "count;dur=6123.4, page;dur=…, mode;desc="offset,parallel"" → { count: 6123.4, …, mode: 'offset,parallel' } (ms)
        const parseServerTiming = (h) => {
            const out = {};
            (h || '').split(',').forEach(part => {
                const [name, ...kv] = part.trim().split(';');
                if (!name) return;
                kv.forEach(x => { const [k, v] = x.split('='); if (k === 'dur') out[name] = Number(v); if (k === 'desc') out[name] = (v || '').replace(/"/g, ''); });
            });
            return out;
        };
        const fmtSec = ms => (Math.max(0, ms || 0) / 1000).toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' s';
        // Thời gian lần Truy vấn gần nhất (sổ cái; DT chờ phân bổ theo tháng từ v1.10.7): tổng · SQL · tải + đọc · vẽ; rê chuột xem đủ
        // từng khâu (đo tốc độ trên DB thật). mode: 'totals' = tổng tính luôn trong câu lấy trang; t.sale = tra Số HĐ (tab theo tháng).
        const QueryTiming = ({ t }) => {
            const mode = (t.mode || '').split('+');
            const parallel = mode.includes('parallel'), reuse = mode.includes('count-reuse'), inPage = mode.includes('totals');
            const sql = (reuse || inPage ? (t.page || 0) : parallel ? Math.max(t.count || 0, t.page || 0) : (t.count || 0) + (t.page || 0)) + (t.sale || 0);
            const detail = [
                reuse ? 'SQL đếm + cộng tổng: dùng lại (bộ lọc không đổi)' : inPage ? 'SQL đếm + cộng tổng: tính luôn trong câu lấy trang'
                    : `SQL đếm + cộng tổng: ${fmtSec(t.count)}${parallel ? ' (chạy song song)' : ''}`,
                `SQL lấy trang: ${fmtSec(t.page)} (${mode.includes('offset') ? 'OFFSET/FETCH' : 'ROW_NUMBER'})`,
                ...(t.sale != null ? [`SQL tra Số HĐ / Số hợp đồng: ${fmtSec(t.sale)} (${t.lookups || 0} lượt)`] : []),
                `Máy chủ dựng dòng: ${fmtSec(t.build)} · đóng JSON: ${fmtSec(t.json)}${t.gzip ? ` · nén: ${fmtSec(t.gzip)}` : ''}`,
                `Chờ máy chủ (gồm các khâu trên): ${fmtSec(t.wait)}`,
                `Tải + đọc dữ liệu: ${fmtSec(t.read)} · vẽ bảng: ${fmtSec(t.draw)}`,
                `${(t.rows || 0).toLocaleString('vi-VN')} dòng trang này`,
            ].join('\n');
            return <span className="ds-timing" title={detail}>Truy vấn <b>{fmtSec(t.total)}</b><span> (SQL {fmtSec(sql)} · tải {fmtSec(t.read)} · vẽ {fmtSec(t.draw)})</span></span>;
        };

        const AppStatusBar = ({ meta, filters, appVersion, timing }) => (
            <div className="app-statusbar ds-status">
                <span><span className="ds-dot"></span><b>Đã kết nối</b></span>
                <span>CSDL <b>{meta.db_info?.database}</b></span>
                <span><b>{meta.global_total?.toLocaleString()}</b> bản ghi sổ cái</span>
                <div className="ds-right">
                    {timing && <QueryTiming t={timing} />}
                    <span>Kỳ {filters.from_date} – {filters.to_date}</span>
                    <span>{appVersion}</span>
                </div>
            </div>
        );

        
        const PageSizeDropdown = ({ value, onChange }) => {
            const [open, setOpen] = useState(false);
            const ref = React.useRef(null);
            
            React.useEffect(() => {
                const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                if (open) document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [open]);

            const options = [
                { value: 1000, label: '1,000 dòng' },
                { value: 10000, label: '10,000 dòng' },
                { value: 50000, label: '50,000 dòng' },
                { value: 100000, label: '100,000 dòng' },
                { value: 200000, label: '200,000 dòng' },
                { value: 500000, label: '500,000 dòng' },
            ];

            return (
                <div className="relative" ref={ref}>
                    <button type="button" onClick={() => setOpen(!open)} className={`ds-chip ${open ? 'is-open' : ''}`}>
                        <span className="ds-k">Hiển thị</span>
                        <span className="tabular-nums">{value.toLocaleString()}</span>
                        <Icon name="chevron-down" size={12} stroke={2} className={`transition-transform ${open ? 'rotate-180' : ''}`} />
                    </button>
                    {open && (
                        <div className="ds-pop ds-pop-in absolute top-full mt-1.5 right-0 z-[6000] min-w-[140px] p-1">
                            {options.map(opt => (
                                <div
                                    key={opt.value}
                                    onClick={() => { onChange(opt.value); setOpen(false); }}
                                    className={`ds-opt tabular-nums ${value === opt.value ? 'is-sel' : ''}`}
                                >
                                    <span className="flex-1">{opt.label}</span>
                                    {value === opt.value && <Icon name="check" size={12} stroke={2.5} className="text-brand"/>}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        // ===== MÀN ĐĂNG NHẬP — NỬA PHẢI (v1.10.8, Trum 30/09 — phương án B "Kết nối gần đây" + họa tiết công nghệ) =====
        // Mở app → thẻ kết nối dùng gần nhất chọn sẵn, bấm Kết nối (Enter / bấm đúp thẻ) là vào. Danh sách + mật khẩu do MÁY CHỦ giữ
        // (server.py "KẾT NỐI ĐÃ LƯU": %LocalAppData%\iPOS_Ledger_Studio\saved_logins.json, mật khẩu mã hoá DPAPI) — trang chỉ nhận
        // máy chủ / CSDL / tài khoản + cờ has_pw, đăng nhập bằng thẻ gửi saved_id. "Kết nối khác" = form 4 ô như cũ + Ghi nhớ mật khẩu.
        // Phiên đăng nhập chỉ sống trong 1 lần chạy app (phiên RAM phía máy chủ) → tắt app mở lại luôn về màn này.
        const LOGIN_SAVED_MAX = 5;   // = _SAVED_MAX (server.py)

        const loginAgo = (sec) => {
            if (!sec) return '';
            const d = Date.now() / 1000 - sec, t = new Date(sec * 1000), now = new Date();
            if (d < 60) return 'vừa xong';
            if (d < 3600) return `${Math.floor(d / 60)} phút trước`;
            const days = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(t.getFullYear(), t.getMonth(), t.getDate())) / 86400000);
            if (days <= 0) return `${Math.floor(d / 3600)} giờ trước`;
            if (days === 1) return 'hôm qua';
            if (days < 7) return `${days} ngày trước`;
            return fmtDMY(t);
        };

        // Mạch in 1 góc (khung 300×230 = viewBox, gốc phải-trên); góc trái-dưới = cùng hình xoay 180°. Mạch là SVG TĨNH; vạch sáng
        // chạy trên đoạn thẳng là <span> đặt theo % toạ độ viewBox (x/300, y/230), chạy bằng transform trong khe overflow: hidden
        // → card đồ hoạ tự lo, không vẽ lại. Đo 30/09: xung cũ vẽ bằng animation stroke-dashoffset trong SVG làm CPU Chrome lúc
        // đứng yên ở màn đăng nhập 4,5% → 9,0% một nhân (bỏ xung còn 3,5%) — đừng quay lại animate thuộc tính SVG.
        const LOGIN_CIRCUIT = (
            <>
                <svg viewBox="0 0 300 230">
                    <path className="tr" d="M300 22 H238 L214 46 H128" />
                    <path className="tr" d="M300 64 H252 L238 78 V120 L222 136 H158" />
                    <path className="tr" d="M300 108 H278 L264 122 V196" />
                    <path className="tr" d="M128 60 H160 L176 76 V94" />
                    <path className="tr" d="M96 78 V104 L110 118 H126" />
                    <path className="tr" d="M108 30 V0" />
                    <path className="tr" d="M84 30 V16 L68 0" />
                    <path className="tr" d="M72 46 H40 L26 32 V0" />
                    <rect className="chip" x="72" y="30" width="56" height="48" rx="6" />
                    <rect className="core" x="84" y="42" width="32" height="24" rx="3" />
                    <circle className="pad" cx="158" cy="136" r="3.5" /><circle className="pad" cx="264" cy="196" r="3.5" />
                    <circle className="pad" cx="176" cy="94" r="3.5" /><circle className="pad" cx="126" cy="118" r="3.5" />
                    <circle className="via" cx="200" cy="100" r="2" /><circle className="via" cx="246" cy="160" r="2" />
                    <circle className="via" cx="286" cy="150" r="2" /><circle className="via" cx="150" cy="18" r="2" />
                </svg>
                <span className="ds-lg-trk is-h" style={{ left: '79.333%', top: '9.565%', width: '20.667%' }}><i></i></span>
                <span className="ds-lg-trk is-h" style={{ left: '42.667%', top: '20%', width: '28.667%' }}><i style={{ animationDelay: '-1.7s' }}></i></span>
                <span className="ds-lg-trk is-h" style={{ left: '52.667%', top: '59.13%', width: '21.333%' }}><i style={{ animationDelay: '-3.2s' }}></i></span>
                <span className="ds-lg-trk is-v" style={{ left: '88%', top: '53.043%', height: '32.174%' }}><i style={{ animationDelay: '-0.8s' }}></i></span>
                <span className="ds-lg-trk is-v is-up" style={{ left: '8.667%', top: '0%', height: '13.913%' }}><i style={{ animationDelay: '-2.5s' }}></i></span>
            </>
        );
        const LoginTech = React.memo(() => (
            <div className="ds-lg-tech" aria-hidden="true">
                <div className="ds-lg-dots"></div>
                <div className="ds-lg-rail"></div>
                <div className="ds-lg-circuit is-tr">{LOGIN_CIRCUIT}</div>
                <div className="ds-lg-circuit is-bl">{LOGIN_CIRCUIT}</div>
            </div>
        ));

        const LoginPanel = ({ appVersion, blocked, onLoggedIn }) => {
            const [saved, setSaved] = useState(null);         // null = đang đọc danh sách; [] = chưa có kết nối nào
            const [canSavePw, setCanSavePw] = useState(true);
            const [selId, setSelId] = useState(null);
            const [mode, setMode] = useState('saved');        // 'saved' = thẻ kết nối gần đây · 'form' = nhập 4 ô
            const [form, setForm] = useState(() => {
                let server = '', database = '';
                try { server = localStorage.getItem('iacc_server') || ''; database = localStorage.getItem('iacc_db') || ''; } catch (e) {}
                return { driver: 'SQL Server', server, database, user: '', password: '' };
            });
            const [pw, setPw] = useState('');                 // mật khẩu gõ cho thẻ chưa lưu mật khẩu / mật khẩu đã lưu bị từ chối
            const [needPw, setNeedPw] = useState(false);
            const [remember, setRemember] = useState(true);
            const [showPw, setShowPw] = useState(false);      // nút con mắt (chỉ đổi type ô mật khẩu)
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const [confirmDel, setConfirmDel] = useState(null);
            const pwRef = useRef(null);

            useEffect(() => {
                fetch('/api/saved_logins').then(r => r.json()).then(res => {
                    const items = res.items || [];
                    setSaved(items);
                    setCanSavePw(res.can_save_pw !== false);
                    if (items.length) setSelId(items[0].id); else setMode('form');
                }).catch(() => { setSaved([]); setMode('form'); });
            }, []);

            const sel = (saved || []).find(s => s.id === selId) || null;
            const askPw = mode === 'saved' && !!sel && (needPw || !sel.has_pw);

            const pick = (id) => {
                if (id === selId) return;
                setSelId(id); setPw(''); setNeedPw(false); setShowPw(false); setError(''); setConfirmDel(null);
            };

            const login = async (body) => {
                setBusy(true); setError('');
                try {
                    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    const res = await r.json();
                    if (res.status === 'ok') {
                        try { localStorage.setItem('iacc_server', res.server || ''); localStorage.setItem('iacc_db', res.database || ''); } catch (e) {}
                        await onLoggedIn();
                        return;
                    }
                    setError(res.message || 'Không kết nối được máy chủ.');
                    if (res.need_password) { setNeedPw(true); setPw(''); setTimeout(() => pwRef.current && pwRef.current.focus(), 0); }
                    if (res.items) {   // thẻ vừa bấm không còn trong danh sách (xoá ở cửa sổ khác)
                        setSaved(res.items);
                        setSelId(res.items.length ? res.items[0].id : null);
                        if (!res.items.length) setMode('form');
                    }
                } catch (err) {
                    setError(viErr('Failed to fetch'));
                } finally {
                    setBusy(false);
                }
            };

            // Bấm đúp / Enter trên thẻ: thẻ đã lưu mật khẩu thì vào luôn, chưa có (hoặc vừa bị từ chối) thì chờ gõ mật khẩu
            const quick = (s) => {
                if (busy) return;
                const rejected = s.id === selId && needPw;
                pick(s.id);
                if (s.has_pw && !rejected) login({ saved_id: s.id });
                else setTimeout(() => pwRef.current && pwRef.current.focus(), 0);
            };
            const cardKey = (e, i) => {
                if (e.key === 'Enter') { e.preventDefault(); quick(saved[i]); return; }
                if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
                e.preventDefault();
                const j = (i + (e.key === 'ArrowDown' ? 1 : saved.length - 1)) % saved.length;
                pick(saved[j].id);
                const btn = e.currentTarget.closest('.ds-lgc-list').querySelectorAll('.ds-lgc')[j];
                const main = btn && btn.querySelector('.ds-lgc-main');
                if (main) main.focus();
            };
            const connectSaved = (e) => {
                e.preventDefault();
                if (!sel || busy) return;
                if (!askPw) login({ saved_id: sel.id });
                else if (pw) login({ saved_id: sel.id, password: pw, remember });
                else if (pwRef.current) pwRef.current.focus();
            };
            const connectForm = (e) => {
                e.preventDefault();
                if (!busy) login({ ...form, remember });
            };
            // "Kết nối khác": giữ máy chủ + tài khoản của thẻ đang chọn (hay đổi CSDL trên cùng máy chủ), để trống CSDL + mật khẩu
            const openForm = () => {
                if (sel) setForm(f => ({ ...f, server: sel.server, user: sel.user, database: '', password: '' }));
                setMode('form'); setError(''); setShowPw(false); setRemember(true); setConfirmDel(null);
            };
            const backToSaved = () => { setMode('saved'); setError(''); setShowPw(false); setRemember(true); };
            const delSaved = async (id) => {
                try {
                    const r = await fetch('/api/saved_logins/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                    const res = await r.json();
                    const items = res.items || [];
                    setSaved(items); setConfirmDel(null);
                    if (!items.some(s => s.id === selId)) { setSelId(items.length ? items[0].id : null); setPw(''); setNeedPw(false); setError(''); }
                    if (!items.length) setMode('form');
                    if (res.status !== 'ok') setError(res.message || 'Không xoá được kết nối.');
                } catch (err) {
                    setError(viErr('Failed to fetch'));
                }
            };

            const eyeBtn = (
                <button type="button" tabIndex={-1} onMouseDown={e => e.preventDefault()} onClick={() => setShowPw(v => !v)} className="ds-iconbtn ds-eye" title={showPw ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'}><Icon name={showPw ? 'eye-off' : 'eye'} size={16} stroke={2} /></button>
            );
            const rememberBox = canSavePw && (
                <label className="ds-lg-check">
                    <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)} />
                    <span className="ds-cbox"><Icon name="check" size={11} stroke={3} /></span>
                    Ghi nhớ mật khẩu trên máy này
                </label>
            );
            const errBox = error && <div className="ds-note is-bad mb-3"><Icon name="alert-circle" size={15} stroke={2} /><ErrText text={error} /></div>;
            const goLabel = (txt) => busy
                ? <><Icon name="loader" size={15} className="animate-spin" /> Đang kết nối</>
                : <>{txt}<Icon name="arrow-right" size={15} stroke={2} className="ds-arrow" /></>;
            const firstEmpty = !form.server ? 'server' : !form.database ? 'database' : !form.user ? 'user' : 'password';

            return (
                <div className={`ds-login-side${blocked ? ' ds-login-blocked' : ''}`}>
                    <LoginTech />
                    <div className="ds-login-form">
                        <div className="ds-login-logo">
                            <svg viewBox="0 0 200 200" width="44" height="44" aria-hidden="true">
                                <rect width="200" height="200" rx="45" fill="#FF9D3D"/>
                                <rect x="40" y="40" width="120" height="120" rx="30" fill="none" stroke="white" strokeWidth="20"/>
                            </svg>
                            <div>
                                <h1>{APP_NAME}</h1>
                                <span>Tra cứu sổ sách và báo cáo kế toán iPOS</span>
                            </div>
                        </div>

                        {saved === null ? <div className="ds-lg-wait"></div> : (mode === 'saved' && sel) ? (
                            <form onSubmit={connectSaved}>
                                <div className="ds-lg-h"><span>Kết nối gần đây</span><span>{saved.length}/{LOGIN_SAVED_MAX}</span></div>
                                <div className="ds-lgc-list" role="radiogroup" aria-label="Kết nối gần đây">
                                    {saved.map((s, i) => confirmDel === s.id ? (
                                        <div key={s.id} className="ds-lgc is-del">
                                            <span>Xoá <b>{s.database}</b> khỏi danh sách?</span>
                                            <button type="button" className="ds-btn" onClick={() => setConfirmDel(null)}>Không</button>
                                            <button type="button" className="ds-btn ds-btn-danger" autoFocus onClick={() => delSaved(s.id)}>Xoá</button>
                                        </div>
                                    ) : (
                                        <div key={s.id} className={`ds-lgc${s.id === selId ? ' is-on' : ''}${busy && s.id === selId ? ' is-busy' : ''}`}>
                                            <button type="button" role="radio" aria-checked={s.id === selId} className="ds-lgc-main" disabled={busy}
                                                onClick={() => pick(s.id)} onDoubleClick={() => quick(s)} onKeyDown={e => cardKey(e, i)}>
                                                <span className="ds-lgc-ic"><Icon name="database" size={18} stroke={2} /></span>
                                                <span className="ds-lgc-txt"><b>{s.database}</b><small>{s.server} · {s.user}</small></span>
                                                <span className="ds-lgc-meta">
                                                    <span>{loginAgo(s.last_used)}</span>
                                                    {s.has_pw ? <span title="Đã lưu mật khẩu"><Icon name="lock" size={12} stroke={2} /></span> : <span>chưa lưu mật khẩu</span>}
                                                </span>
                                            </button>
                                            <button type="button" className="ds-lgc-del" disabled={busy} title="Xoá khỏi danh sách" aria-label={`Xoá ${s.database} khỏi danh sách`}
                                                onClick={() => setConfirmDel(s.id)}><Icon name="x" size={12} stroke={2.5} /></button>
                                        </div>
                                    ))}
                                </div>
                                <button type="button" className="ds-lg-link" disabled={busy} onClick={openForm}><Icon name="plus" size={14} stroke={2.2} />Kết nối khác</button>
                                {askPw && (
                                    <div className="ds-fld ds-lg-pw">
                                        <label htmlFor="lg-spw">Mật khẩu của <b>{sel.user}</b></label>
                                        <div className="ds-ipt"><Icon name="lock" size={16} stroke={2} />
                                            <input id="lg-spw" ref={pwRef} required autoFocus type={showPw ? 'text' : 'password'} className="has-eye" autoComplete="current-password"
                                                value={pw} onChange={e => setPw(e.target.value)} placeholder="••••••••" />
                                            {eyeBtn}
                                        </div>
                                    </div>
                                )}
                                {askPw && rememberBox}
                                {errBox}
                                <button type="submit" disabled={busy} autoFocus={!askPw} className={`ds-btn ds-btn-pri ds-login-go${askPw ? '' : ' ds-lg-saved-go'}`}>
                                    {goLabel(<>Kết nối <span className="ds-lg-db">{sel.database}</span></>)}
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={connectForm}>
                                {saved.length > 0 && <button type="button" className="ds-lg-link is-back" disabled={busy} onClick={backToSaved}><Icon name="chevron-left" size={14} stroke={2.2} />Kết nối gần đây</button>}
                                <div className="ds-fld"><label htmlFor="lg-server">Máy chủ</label><div className="ds-ipt"><Icon name="server" size={16} stroke={2} /><input id="lg-server" required autoFocus={firstEmpty === 'server'} value={form.server} onChange={e => setForm({ ...form, server: e.target.value })}/></div></div>
                                <div className="ds-fld"><label htmlFor="lg-db">Cơ sở dữ liệu</label><div className="ds-ipt"><Icon name="database" size={16} stroke={2} /><input id="lg-db" required autoFocus={firstEmpty === 'database'} value={form.database} onChange={e => setForm({ ...form, database: e.target.value })}/></div></div>
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="ds-fld"><label htmlFor="lg-user">Tài khoản</label><div className="ds-ipt"><Icon name="user" size={16} stroke={2} /><input id="lg-user" required autoFocus={firstEmpty === 'user'} value={form.user} onChange={e => setForm({ ...form, user: e.target.value })} placeholder="sa"/></div></div>
                                    <div className="ds-fld"><label htmlFor="lg-pw">Mật khẩu</label><div className="ds-ipt"><Icon name="lock" size={16} stroke={2} />
                                        <input id="lg-pw" required autoFocus={firstEmpty === 'password'} type={showPw ? 'text' : 'password'} className="has-eye" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} placeholder="••••••••"/>
                                        {eyeBtn}
                                    </div></div>
                                </div>
                                {rememberBox}
                                {errBox}
                                <button disabled={busy} type="submit" className="ds-btn ds-btn-pri ds-login-go">{goLabel('Kết nối ')}</button>
                            </form>
                        )}
                        {canSavePw && saved !== null && <p className="ds-lg-secure"><Icon name="shield-check" size={14} stroke={2} />Mật khẩu đã lưu được mã hoá theo tài khoản Windows, chỉ dùng được trên máy này.</p>}
                    </div>
                    <div className="ds-login-foot"><span>© {new Date().getFullYear()} iPOS.vn · IACC</span><span>{appVersion}</span></div>
                </div>
            );
        };

        const App = () => {
            const appVersion = useAppVersion();   // lấy từ /api/version — hiện ở màn hình login + header
            const autoUpdate = useAutoUpdate();   // kiểm tra + tự cập nhật bản mới từ GitHub Releases
            const [groupByPurchase, setGroupByPurchase] = useState([]);
            const [toggleGroupRenderPurchase, setToggleGroupRenderPurchase] = useState(0);
            const purchaseScrollRef = useRef();

            const [groupByWarehouse, setGroupByWarehouse] = useState([]);
            const [toggleGroupRenderWarehouse, setToggleGroupRenderWarehouse] = useState(0);
            const warehouseScrollRef = useRef();
            const [groupByLedger, setGroupByLedger] = useState([]);
            const [toggleGroupRender, setToggleGroupRender] = useState(0); // Để ép update khi toggle expand
            const ledgerScrollRef = useRef();
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('ledger');
            const [data, setData] = useState([]);
            const [reportData, setReportData] = useState({});
            const [monthList, setMonthList] = useState([]);
            const [monthlyData, setMonthlyData] = useState({});
            const [jobList, setJobList] = useState([]);
            const [jobData, setJobData] = useState({});
            const [reportType, setReportType] = useState('BC005');
            const [trialBalanceData, setTrialBalanceData] = useState([]);
            const [cashBookData, setCashBookData] = useState({ rows: [], pagination: { total_rows: 0, total_pages: 1, page: 1 } });
        const [vatSalesTotals, setVatSalesTotals] = useState({ total_amount_item: 0, taxable_amount_item: 0, total_vat_amount: 0 });
        const [vatSalesMode, setVatSalesMode] = useState('detail');
        const [nxtMode, setNxtMode] = useState('wh');   // BC015 cách nhóm: none / wh / cls (NXT_MODES) — không tải lại
        const [vatKind, setVatKind] = useState('BR');   // bảng kê thuế GTGT: 'BR' bán ra | 'MV' mua vào (VAT_KINDS)
        const [vatReloadTick, setVatReloadTick] = useState(0);   // tăng = tải lại bảng kê ở lượt vẽ sau (changeVatView)
        const [journalViewMode, setJournalViewMode] = useState('detail');
            const [trialBalanceTotal, setTrialBalanceTotal] = useState(null);
            const [pendingReportType, setPendingReportType] = useState(null);
            const [showClearModal, setShowClearModal] = useState(false);
            const [noticeModal, setNoticeModal] = useState(null); // { title: string, message: string }
            const showNotice = (message, title = 'Thông báo') => setNoticeModal({ title, message });
            const [meta, setMeta] = useState({ accounts: [], orgs: [], pr_details: [], tran_ids: [], jobs: [], items: [], products: [], expenses: [], warehouses: [], db_info: {}, global_total: 0 });
            const [loading, setLoading] = useState(false);
            const [activeDropdown, setActiveDropdown] = useState(null);
            const [timeMode, setTimeMode] = useState('month');   // bộ lọc Thời gian: lần mở sau vào đúng chế độ vừa chọn (ngày / tuần / tháng)
            const [queryTiming, setQueryTiming] = useState(null);   // đo lần Truy vấn sổ cái gần nhất (thanh trạng thái)
            const ledgerCountKeyRef = useRef('');   // bộ lọc của lần ĐẾM tổng gần nhất — trùng thì dùng lại tổng
            // rpt_wh_ids = ô Kho của BC015. KHÔNG đặt tên wh_ids: vài tab dữ liệu gửi nguyên mọi khoá của filters lên server, mà
            // /api/purchase, /api/warehouse, /api/sale, /api/warehouse_balance đều đọc wh_ids → chọn kho ở báo cáo sẽ lọc ngầm các tab đó.
            const [filters, setFilters] = useState({ from_date: '01/01/2026',to_date: '31/01/2026', tran_ids: [], org_ids: [], acc_ids: [], contra_acc_ids: [], job_ids: [], pr_detail_ids: [], item_ids: [], product_ids: [], expense_ids: [], rpt_wh_ids: [], rpt_cls_ids: [], tran_no: '', page: 1, page_size: 10000 });
            // Kỳ báo cáo (tiêu đề "Tháng 8 Năm 2026"…) suy từ khoảng ngày của bộ lọc Thời gian — trước v1.10.7 là state riêng của ô "Kỳ"
            const period = useMemo(() => rangePeriod(filters.from_date, filters.to_date), [filters.from_date, filters.to_date]);
            const [pagination, setPagination] = useState({ total_rows: 0, total_pages: 1, page: 1 });
            const [summary, setSummary] = useState({ total_debit: 0, total_credit: 0 });
            const [colSearch, setColSearch] = useState({});
            // "Tải lại danh mục": null | { phase: 'busy' | 'ok' | 'err', title, text, ms, id } — nút ở thanh bên + thẻ MetaToast đọc chung
            const [metaRefresh, setMetaRefresh] = useState(null);
            useEffect(() => {
                if (!metaRefresh || metaRefresh.phase === 'busy') return;
                const t = setTimeout(() => setMetaRefresh(null), META_TOAST_MS[metaRefresh.phase]);
                return () => clearTimeout(t);
            }, [metaRefresh]);
            // Thanh bên thu gọn: nhớ theo máy (localStorage có thể bị chặn → bọc try)
            const [sidebarCollapsed, setSidebarCollapsed] = useState(() => { try { return localStorage.getItem('ds_sidebar_collapsed') === '1'; } catch (e) { return false; } });
            const toggleSidebar = useCallback(() => setSidebarCollapsed(v => {
                try { localStorage.setItem('ds_sidebar_collapsed', v ? '0' : '1'); } catch (e) {}
                return !v;
            }), []);

            // Sort state cho 3 danh sách. field=null → dùng default backend.
            const [ledgerSort, setLedgerSort]       = useState({ field: null, dir: 'desc' });
            

            const [purchaseSort, setPurchaseSort]   = useState({ field: null, dir: 'desc' });
            const [warehouseSort, setWarehouseSort] = useState({ field: null, dir: 'desc' });

            const cycleSort = (cur, field) => {
                // null → desc → asc → null
                if (cur.field !== field) return { field, dir: 'desc' };
                if (cur.dir === 'desc')  return { field, dir: 'asc' };
                return { field: null, dir: 'desc' };
            };

            const [showDriverDialog, setShowDriverDialog] = useState(false);
            const [driverInstalling, setDriverInstalling] = useState(false);
            const [driverDropdownOpen, setDriverDropdownOpen] = useState(false);
            const driverOptions = [
                { value: "ODBC Driver 17 for SQL Server", label: "ODBC Driver 17 for SQL Server" },
                { value: "ODBC Driver 13 for SQL Server", label: "ODBC Driver 13 for SQL Server" },
                { value: "SQL Server", label: "SQL Server (mặc định)" }
            ];

            // AbortController để hủy request cũ khi có request mới
            const abortRef = useRef(null);

            // Debounce colSearch 400ms — chờ người dùng ngừng gõ mới bắn query
            const debouncedColSearch = useDebounce(colSearch, 400);

            useEffect(() => {
                // Check driver khi app load
                // .catch bắt buộc: server tắt/chưa sẵn sàng -> hiện banner "Mất kết nối", KHÔNG để
                // rơi xuống handler unhandledrejection (đổ stack trace đỏ ra màn hình người dùng).
                fetch('/api/check_driver').then(r => r.json()).then(res => {
                    if (!res.has_driver) {
                        setShowDriverDialog(true);
                    }
                }).catch(err => { if (window.isNetworkError(err)) window.showConnectionLost(); });

                fetch('/api/metadata').then(r => {
                    if (r.status === 401) { setIsLoggedIn(false); }
                    else return r.json();
                }).then(res => { if(res) { setMeta(res); setIsLoggedIn(true); } })
                  .catch(err => { if (window.isNetworkError(err)) window.showConnectionLost(); });

                // Giữ 1 kết nối /api/presence suốt lúc trang mở (v1.10.8): máy chủ không theo dõi được cửa sổ (Chrome bàn giao cho
                // instance cũ, trình duyệt mặc định) thì tự tắt khi không còn trang nào giữ kết nối — tắt app là tắt hẳn (_watch_presence).
                let presence = null;
                try { presence = new EventSource('/api/presence'); } catch (e) {}
                return () => { if (presence) presence.close(); };
            }, []);

            // LoginPanel gọi sau khi /api/login trả ok — như handleLogin cũ: vào app rồi mới nạp danh mục
            const handleLoggedIn = async () => {
                setIsLoggedIn(true);
                const metaRes = await fetch('/api/metadata').then(r => r.json());
                setMeta(metaRes);
            };

            const handleLogout = async () => {
                await fetch('/api/logout', { method: 'POST' });
                setIsLoggedIn(false);
                setMeta({ accounts: [], orgs: [], pr_details: [], tran_ids: [], jobs: [], items: [], products: [], expenses: [], warehouses: [], db_info: {}, global_total: 0 });

                    s = String.fromCharCode(65 + m) + s;

            // Trả về ws object dạng {!ref, A1:{v,t}, ...} compatible XLSX writer.
            const buildSheetManual = async (cols, rows, extractor, onProgress) => {
                const headers = cols.map(([_, label]) => label);
                const truncate = rows.length > EXCEL_MAX_ROWS;
                const useRows = truncate ? rows.slice(0, EXCEL_MAX_ROWS) : rows;
                const ws = {};
                const nCols = headers.length;
                const nRows = useRows.length + 1; // +header

                // Header row
                for (let c = 0; c < nCols; c++) {
                    ws[colLetter(c) + '1'] = { v: headers[c], t: 's' };
                }

                const CHUNK = 10000;
                for (let i = 0; i < useRows.length; i++) {
                    const arr = extractor(useRows[i]);
                    const rowExcel = i + 2; // 1-based, +header
                    for (let c = 0; c < nCols; c++) {
                        const v = arr[c];
                        if (v === '' || v == null) continue; // skip empty cell
                        const ref = colLetter(c) + rowExcel;
                        if (typeof v === 'number') ws[ref] = { v, t: 'n' };
                        else                       ws[ref] = { v: String(v), t: 's' };
                    }
                    if (i > 0 && i % CHUNK === 0) {
                        if (onProgress) onProgress(i, useRows.length);
                        await yieldToUI();
                    }
                }
                if (onProgress) onProgress(useRows.length, useRows.length);

                ws['!ref'] = `A1:${colLetter(nCols - 1)}${nRows}`;
                return { ws, truncated: truncate ? rows.length - EXCEL_MAX_ROWS : 0 };

                    url = `/api/warehouse?${buildWarehouseQuery(1, 1, null, { export_all: '1' }).toString()}`;
                }
                const r = await fetch(url, { signal });
                if (r.status === 401) { setIsLoggedIn(false); return { status: 'cancelled' }; }
                const res = await r.json();
                if (res.status !== 'ok') return { status: 'error', message: res.message || `Máy chủ báo lỗi (HTTP ${r.status}).` };
                const rows = res.data || [];
                if (!rows.length) return { status: 'error', message: 'Không có dòng nào khớp bộ lọc đang chọn.' };

                const fullCols = EXPORT_COLS_BY_KIND[kind] || WAREHOUSE_EXPORT_COLS;
                // khối 'MONTHS' (bố cục DT chờ phân bổ theo tháng) → bung ra các khoá tháng
                const keys = viewKeys && viewKeys.flatMap(k => (k === 'MONTHS' ? incomeMonthView.months.map(m => m.key) : [k]));
                const cols = keys ? pickExportCols(fullCols, keys) : fullCols;
                const extractor = kind === 'ledger' ? (row) => extractLedgerRow(row, cols) : (row) => extractRowGeneric(cols, row);

                // Group theo ORGANIZATION_ID
                const groups = new Map();
                for (let i = 0; i < rows.length; i++) {
                    const id = (rows[i].ORGANIZATION_ID || '').toString().trim() || '__NONE__';
                    let g = groups.get(id);
                    if (!g) { g = []; groups.set(id, g); }
                    g.push(rows[i]);
                }
                const ids = [...groups.keys()].sort();
                // 1 sheet Excel tối đa 1.048.576 dòng — trước v1.12.1 đơn vị vượt mốc bị cắt bớt dòng mà không báo
                const big = ids.find(id => groups.get(id).length > EXCEL_MAX_ROWS);
                if (big) return { status: 'error', message: `Đơn vị ${big === '__NONE__' ? '(không có mã)' : big} có ${fmtCount(groups.get(big).length)} dòng, quá ${fmtCount(EXCEL_MAX_ROWS)} dòng của 1 sheet Excel.\nCách khắc phục: thu hẹp khoảng ngày, hoặc chọn Excel (tự tách sheet khi vượt 1.000.000 dòng).` };
                const onm = orgNameMap();
                const wb = XLSX.utils.book_new();
                let done = 0;
                step('write', 0, rows.length);
                for (const id of ids) {
                    const grp = groups.get(id);
                    const { ws } = await buildSheetManual(cols, grp, extractor, (c) => step('write', done + c, rows.length));
                    const orgName = id === '__NONE__' ? 'Khac' : (onm[id] || id);
                    XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName(`${id}-${orgName}`));
                    done += grp.length;
                    step('write', done, rows.length);
                    await yieldToUI();
                }
                step('finalize', rows.length, rows.length);
                await yieldToUI();
                // Dùng XLSX.write (mảng byte) → tránh writeFile internal heavy enumeration

                // Máy chủ ghi file vào thư mục lưu của tab (v1.10.9). Thư mục vừa hỏng → hỏi chọn lại rồi ghi lại, file dựng sẵn giữ nguyên.

                    formats: [
                        { id: 'xlsx', icon: 'file-spreadsheet', title: 'Excel', ext: '.xlsx', desc: 'Một bảng, có nút lọc, dòng tên cột đứng yên khi cuộn.', badge: 'Khuyên dùng' },

                    formatNote: (format, est) => (format !== 'org' ? undefined : est > 200000
