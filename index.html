<!DOCTYPE html>
<html lang="vi">
<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
window.addEventListener("error", function(e) {
    console.error("GLOBAL ERROR:", e.error);
    var errDiv = document.createElement("div");
    errDiv.style = "color:red; background:white; padding:20px; z-index:999999; position:fixed; top:0; left:0; width:100%; border-bottom: 5px solid red; font-family: monospace; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);";
    errDiv.innerHTML = "<b>LỖI XẢY RA:</b> " + e.message + " <br><b>Tại file:</b> " + e.filename + " <br><b>Dòng:</b> " + e.lineno + ":" + e.colno + "<br><pre>" + (e.error && e.error.stack ? e.error.stack : '') + "</pre>";
    document.documentElement.appendChild(errDiv);
});
window.addEventListener("unhandledrejection", function(e) {
    console.error("UNHANDLED PROMISE:", e.reason);
    // Mất kết nối server (server tắt / chưa khởi động xong) -> báo tiếng Việt, KHÔNG đổ stack trace ra màn hình.
    if (window.isNetworkError(e.reason)) { window.showConnectionLost(); return; }
    var errDiv = document.createElement("div");
    errDiv.style = "color:red; background:white; padding:20px; z-index:999999; position:fixed; top:0; left:0; width:100%; border-bottom: 5px solid red; font-family: monospace; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);";
    errDiv.innerHTML = "<b>UNHANDLED PROMISE REJECTION:</b> " + e.reason + "<br><pre>" + (e.reason && e.reason.stack ? e.reason.stack : '') + "</pre>";
    document.documentElement.appendChild(errDiv);
});

// "Failed to fetch" = không gọi được server ở :5050 (EXE đã tắt, hoặc đang khởi động).
// Đây KHÔNG phải lỗi code -> hiện banner hướng dẫn thay vì stack trace debug.
window.isNetworkError = function(x) {
    return !!x && (x.name === "TypeError") && /fetch|network|load failed/i.test(String(x.message || ""));
};
window.showConnectionLost = function() {
    if (document.getElementById("conn-lost")) return;   // chỉ hiện 1 lần dù nhiều request cùng fail
    var d = document.createElement("div");
    d.id = "conn-lost";
    // Kiểu hộp thoại DataStudio (Đợt 5) viết inline — script này chạy trước React/Tailwind, lúc server có thể đã tắt
    d.style = "position:fixed; inset:0; z-index:999999; background:rgba(14,26,43,.55); display:flex; align-items:center; justify-content:center; padding:16px; font-family:Inter,'Segoe UI',system-ui,sans-serif;";
    d.innerHTML =
        '<div style="max-width:440px; width:100%; background:#fff; border:1px solid #E3E8EF; border-radius:14px; box-shadow:0 24px 64px rgba(14,26,43,.22); overflow:hidden; color:#0E1A2B">' +
        '<div style="display:flex; gap:12px; padding:20px 24px 0">' +
        '<div style="width:36px; height:36px; flex:none; border-radius:10px; background:#FBE7EB; color:#C12640; display:grid; place-items:center; font-weight:700; font-size:18px">!</div>' +
        '<div style="font-size:16px; line-height:22px; font-weight:600; padding-top:7px">Mất kết nối tới máy chủ</div></div>' +
        '<div style="padding:14px 24px 20px; font-size:13px; line-height:1.6; color:#44546A">Ứng dụng không gọi được server (cổng 5050).<br>Thường do <b>đã tắt ứng dụng</b> nhưng cửa sổ này còn mở, hoặc server <b>chưa khởi động xong</b>.<br>Hãy bấm Thử lại, hoặc đóng cửa sổ này rồi mở lại ứng dụng.</div>' +
        '<div style="display:flex; justify-content:flex-end; padding:12px 20px; background:#F8FAFC; border-top:1px solid #EDF1F5">' +
        '<button id="conn-lost-retry" style="height:32px; padding:0 14px; border:1px solid #0068AC; border-radius:8px; background:#0068AC; color:#fff; font:500 12.5px Inter,\'Segoe UI\',sans-serif; cursor:pointer">Thử lại</button>' +
        '</div></div>';
    document.documentElement.appendChild(d);
    var b = document.getElementById("conn-lost-retry");
    if (b) b.onclick = function() { location.reload(); };
};
</script>
<title>DataStudio</title>

    <link rel="manifest" href="/manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Ghim Babel v7 (classic runtime: React.createElement). KHÔNG dùng latest/v8:
         preset-react v8 mặc định automatic runtime → chèn import "react/jsx-runtime"
         gây lỗi "Cannot use import statement outside a module" trong script type="text/babel". -->
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        // Fallback nếu CDN không load
        window.React = window.React || { createElement: () => null, useState: () => [null, () => {}], useEffect: () => {}, useRef: () => ({current: null}), useCallback: () => () => {} };
        window.ReactDOM = window.ReactDOM || { createRoot: () => ({render: () => {}}), createPortal: () => null };
        if (typeof tailwind !== 'undefined') {
            // Token màu giao diện mới "Sổ cái tĩnh" (Đợt 1, 27/09/2026) — giữ khớp biến --ds-* trong <style> bên dưới.
            // webbuild/build.js đọc nguyên khối object này để build Tailwind cho bản EXE: chỉ ghi giá trị tĩnh, không gọi biến/hàm.
            tailwind.config = {
                theme: { extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5',
                        ink: { DEFAULT: '#0E1A2B', 2: '#44546A', 3: '#728197', 4: '#9AA6B5', off: '#B7C1CE' },
                        line: { DEFAULT: '#E3E8EF', soft: '#EDF1F5', strong: '#CFD8E3' },
                        canvas: '#F4F6F9', wash: '#F8FAFC', tint: '#F1F5F9', rail: '#F7F9FB',
                        brand: { DEFAULT: '#0068AC', hover: '#00568F', soft: '#E6F0F8', line: '#B9D3E8' },
                        ok: { DEFAULT: '#12A36A', ink: '#0A7F50', soft: '#E2F4EB' },
                        warn: { DEFAULT: '#E2A019', ink: '#8A5A00', soft: '#FCF1DA' },
                        bad: { DEFAULT: '#E0435E', ink: '#C12640', soft: '#FBE7EB' },
                    },
                } },
            };
        }
    </script>
    <style>
        /* Fallback font nếu Google Fonts không load */
        @font-face {
            font-family: 'Inter';
            src: local('Inter'), local('Arial'), sans-serif;
            font-weight: 400;
        }
    </style>
    <style>
        body { background-color: #f1f5f9; font-size: 11px; height: 100vh; overflow: hidden; color: #334155; }
        .filter-control { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2px 12px; background: white; height: 32px; transition: all 0.2s; outline: none; display: flex; align-items: center; font-size: 11px; font-weight: 700; cursor: pointer; }
        .filter-control:hover { border-color: #4f46e5; background: #fcfcfc; }
        .filter-control.active { border-color: #4f46e5; background: #eff6ff; color: #1d4ed8; }
        .label-text { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.1em; padding-left: 2px; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; transition: background 0.2s; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; border: 2px solid transparent; background-clip: padding-box; }
        th { background: #f8fafc; border-bottom: 1.5px solid #1e293b; padding: 8px !important; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #000; }
        .sortable-th { cursor: pointer; user-select: none; transition: background-color 0.15s ease, color 0.15s ease; }
        .sortable-th:hover { background: var(--ds-tint) !important; color: var(--ds-ink) !important; }
        .sortable-th .sort-icon { opacity: 0.25; transition: opacity 0.15s ease; }
        .sortable-th:hover .sort-icon { opacity: 0.6; }
        .sortable-th.is-sorted { background: var(--ds-brand-soft) !important; color: var(--ds-brand) !important; }
        .sortable-th.is-sorted .sort-icon { opacity: 1; color: var(--ds-brand); }
        .sticky-footer { position: sticky; bottom: 0; background: var(--ds-wash); border-top: 1px solid var(--ds-line-strong); z-index: 40; }
        .tab-btn { padding: 10px 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; position: relative; }
        .tab-btn.active { color: #4f46e5; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: #4f46e5; border-radius: 3px 3px 0 0; }
        
        .paper-landscape { width: 297mm !important; min-width: 297mm !important; max-width: 297mm !important; }
        .paper-portrait  { width: 210mm !important; min-width: 210mm !important; max-width: 210mm !important; }
        .report-table tbody tr { content-visibility: auto; contain-intrinsic-size: 1px 24px; }
        .report-paper { background: white; width: max-content; min-width: 210mm; max-width: calc(100vw - 64px); min-height: 297mm; padding: 20mm; margin: 20px auto; box-shadow: 0 1px 2px rgba(14,26,43,.06), 0 10px 28px -6px rgba(14,26,43,.14); border-radius: 2px; color: #000; border: 1px solid rgba(14,26,43,.08); }
        
        .report-table { width: max-content; min-width: 100%; border-collapse: collapse; border: 1px solid #000; table-layout: fixed; margin-right: 2px; font-family: 'Inter', sans-serif; }
        .report-table th, .report-table td { border: 1px solid #000; padding: 8px 12px; font-size: 10.5px; line-height: 1.4; color: #000; }
        .report-table th:last-child, .report-table td:last-child { border-right: 1px solid #000 !important; }
        .report-table th { background: #f1f5f9; font-weight: 800; text-align: center; text-transform: uppercase; letter-spacing: 0.02em; }
        .row-group { background: #f8fafc; font-weight: 800; }
        .row-name { white-space: normal; word-break: break-word; }
        .row-sub { padding-left: 24px !important; }
        .row-sub2 { padding-left: 48px !important; font-style: italic; color: #475569; }
        
        .col-code { text-align: center; width: 60px; }
        .col-name { width: 310px; }
        .col-value { text-align: right; width: 130px; }
        .col-rate { text-align: center; width: 55px; color: #1e293b; background: #f1f5f9/30; }
        .force-bold { font-weight: 800 !important; }
        .force-normal { font-weight: 300 !important; }

        
        @keyframes modal-pop {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes fade-in {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            100% { opacity: 1; backdrop-filter: blur(8px); }
        }
        .animate-modal { animation: modal-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-backdrop { animation: fade-in 0.3s ease-out forwards; }

        /* ===== KHUNG APP DataStudio — hướng "Sổ cái tĩnh" (Đợt 1, 27/09/2026) =====
           Token giữ khớp colors trong tailwind.config ở trên. Khung chỉ dùng class ds-* này; nội dung từng tab chưa đổi.
           Thu/mở thanh bên KHÔNG animate bề ngang: bảng 34 cột bên cạnh sẽ phải tính layout lại từng khung hình. */
        :root {
            --ds-ink: #0E1A2B; --ds-ink-2: #44546A; --ds-ink-3: #728197; --ds-ink-4: #9AA6B5;
            --ds-line: #E3E8EF; --ds-line-soft: #EDF1F5;
            --ds-tint: #F1F5F9; --ds-rail: #F7F9FB;
            --ds-brand: #0068AC; --ds-ok: #12A36A;
        }
        .ds-rail { width: 216px; flex: none; display: flex; flex-direction: column; gap: 1px; padding: 10px 8px; background: var(--ds-rail); border-right: 1px solid var(--ds-line); overflow-x: hidden; overflow-y: auto; font-size: 13px; color: var(--ds-ink-2); }
        .ds-rail.is-collapsed { width: 56px; }
        .ds-brand { display: flex; align-items: center; gap: 9px; min-height: 36px; padding: 0 2px 0 6px; margin-bottom: 4px; }
        .ds-brand b { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--ds-ink); white-space: nowrap; }
        .ds-toggle { margin-left: auto; width: 28px; height: 28px; flex: none; border-radius: 7px; display: grid; place-items: center; color: var(--ds-ink-3); transition: background-color .12s, color .12s; }
        .ds-toggle:hover { background: var(--ds-tint); color: var(--ds-ink); }
        /* 2 thẻ Dữ liệu | Báo cáo (v1.10.4): chỉ đổi danh sách đang xem, không đổi trang đang mở.
           has-page = trang đang mở nằm ở thẻ KIA → chấm xanh để biết đường quay lại. */
        .ds-navtabs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 2px; margin: 2px 0 8px; border-radius: 8px; background: var(--ds-line-soft); flex: none; }
        .ds-navtabs button { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; height: 28px; border-radius: 6px; font-size: 12.5px; color: var(--ds-ink-2); white-space: nowrap; transition: background-color .12s, color .12s, box-shadow .12s; }
        .ds-navtabs button svg { flex: none; color: var(--ds-ink-3); transition: color .12s; }
        .ds-navtabs button:hover { color: var(--ds-ink); }
        .ds-navtabs button:focus-visible { outline: 2px solid var(--ds-brand); outline-offset: 1px; }
        .ds-navtabs button.is-on { background: #fff; color: var(--ds-brand); font-weight: 500; box-shadow: 0 1px 2px rgba(14,26,43,.08), 0 0 0 1px var(--ds-line); }
        .ds-navtabs button.is-on svg { color: var(--ds-brand); }
        .ds-navtabs button.has-page::after { content: ''; position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ds-brand); box-shadow: 0 0 0 2px var(--ds-line-soft); }
        .ds-navlist { display: flex; flex-direction: column; gap: 1px; flex: none; animation: dsNavIn .16s cubic-bezier(.2, 0, 0, 1); }
        @keyframes dsNavIn { from { opacity: 0; transform: translateY(3px); } }
        .ds-nav { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 30px; padding: 0 8px; border-radius: 7px; text-align: left; white-space: nowrap; color: var(--ds-ink-2); transition: background-color .12s, color .12s; }
        .ds-nav:hover { background: var(--ds-tint); color: var(--ds-ink); }
        .ds-nav:disabled { opacity: .6; cursor: default; }
        .ds-nav svg { flex: none; color: var(--ds-ink-3); }
        .ds-nav .ds-code { flex: none; width: 40px; font-size: 11.5px; color: var(--ds-ink-4); font-variant-numeric: tabular-nums; }
        .ds-nav .ds-label { overflow: hidden; text-overflow: ellipsis; }
        .ds-nav.is-on { background: #fff; color: var(--ds-brand); font-weight: 500; box-shadow: inset 0 0 0 1px var(--ds-line); }
        .ds-nav.is-on svg, .ds-nav.is-on .ds-code { color: var(--ds-brand); }
        .ds-spacer { flex: 1; min-height: 12px; }
        .ds-rail.is-collapsed .ds-brand { flex-direction: column; gap: 6px; padding: 0; }
        .ds-rail.is-collapsed .ds-brand b, .ds-rail.is-collapsed .ds-label { display: none; }
        .ds-rail.is-collapsed .ds-toggle { margin-left: 0; }
        .ds-rail.is-collapsed .ds-navtabs { grid-template-columns: 1fr; }
        .ds-rail.is-collapsed .ds-navtabs button.has-page::after { top: 4px; right: 4px; }
        .ds-rail.is-collapsed .ds-nav { justify-content: center; padding: 0; }
        .ds-rail.is-collapsed .ds-code { width: auto; font-size: 11px; }
        /* Nút "Tải lại danh mục" (v1.10.4): đang tải = icon xoay; xong = nền xanh lá + dấu ✓ tự vẽ; lỗi = nền đỏ nhạt.
           Kèm thẻ .ds-toast cạnh nút: số danh mục vừa nạp / lý do lỗi. Trạng thái giữ ở App (metaRefresh). */
        .ds-nav.is-busy:disabled { opacity: 1; }
        .ds-nav.is-busy svg { color: var(--ds-brand); animation: dsSpin .9s linear infinite; }
        .ds-nav.is-done { background: var(--ds-ok-soft); color: var(--ds-ok-ink); font-weight: 500; }
        .ds-nav.is-fail { background: var(--ds-bad-soft); color: var(--ds-bad-ink); font-weight: 500; }
        .ds-nav.is-fail svg { color: var(--ds-bad-ink); }
        .ds-okdot { flex: none; width: 16px; height: 16px; display: grid; place-items: center; border-radius: 50%; background: var(--ds-ok); color: #fff; animation: dsOkPop .32s cubic-bezier(.34, 1.56, .64, 1); }
        .ds-nav .ds-okdot svg { color: #fff; }
        .ds-draw polyline { stroke-dasharray: 23; stroke-dashoffset: 23; animation: dsDraw .3s .12s cubic-bezier(.65, 0, .35, 1) forwards; }
        @keyframes dsSpin { to { transform: rotate(360deg); } }
        @keyframes dsOkPop { from { transform: scale(.4); opacity: 0; } }
        @keyframes dsDraw { to { stroke-dashoffset: 0; } }
        .ds-toast { position: fixed; bottom: 38px; z-index: 4000; display: flex; align-items: flex-start; gap: 10px; width: 320px; padding: 11px 10px 12px 12px; overflow: hidden;
            background: #fff; border: 1px solid var(--ds-line); border-radius: 10px; box-shadow: 0 10px 28px -8px rgba(14,26,43,.22), 0 2px 6px rgba(14,26,43,.06);
            animation: dsToastIn .22s cubic-bezier(.2, 0, 0, 1), dsToastOut .2s ease-in var(--ds-toast-out, 3.3s) forwards; }
        .ds-toast-ic { flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; margin-top: 1px; }
        .ds-toast.is-ok .ds-toast-ic { background: var(--ds-ok); color: #fff; animation: dsOkPop .32s .05s cubic-bezier(.34, 1.56, .64, 1) backwards; }
        .ds-toast.is-bad .ds-toast-ic { background: var(--ds-bad-soft); color: var(--ds-bad-ink); }
        .ds-toast-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .ds-toast-body b { font-size: 13px; font-weight: 600; color: var(--ds-ink); }
        .ds-toast-body span { font-size: 12px; line-height: 17px; color: var(--ds-ink-2); overflow-wrap: anywhere; }
        .ds-toast-body em { font-style: normal; white-space: nowrap; }
        .ds-toast-body .ds-errtext p { font-size: 12px; line-height: 17px; color: var(--ds-ink-2); }
        .ds-toast-body small { font-size: 11px; color: var(--ds-ink-4); font-variant-numeric: tabular-nums; }
        .ds-toast-x { flex: none; width: 24px; height: 24px; margin: -3px -2px 0 0; display: grid; place-items: center; border-radius: 6px; color: var(--ds-ink-4); }
        .ds-toast-x:hover { background: var(--ds-tint); color: var(--ds-ink); }
        .ds-toast-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--ds-ok); transform-origin: left; animation: dsToastBar linear forwards; }
        .ds-toast.is-bad .ds-toast-bar { background: var(--ds-bad-ink); opacity: .5; }
        @keyframes dsToastIn { from { opacity: 0; transform: translateY(8px) scale(.98); } }
        @keyframes dsToastOut { to { opacity: 0; transform: translateY(4px); } }
        @keyframes dsToastBar { to { transform: scaleX(0); } }
        @media (prefers-reduced-motion: reduce) {
            .ds-navlist, .ds-okdot, .ds-toast, .ds-toast.is-ok .ds-toast-ic, .ds-toast-bar { animation: none; }
            .ds-draw polyline { animation: none; stroke-dashoffset: 0; }
            .ds-nav.is-busy svg { animation-duration: 2.4s; }
        }
        .ds-head { display: flex; align-items: baseline; gap: 10px; flex: none; padding: 12px 24px 0; background: #fff; }
        .ds-head h1 { margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--ds-ink); }
        .ds-head span { font-size: 12px; color: var(--ds-ink-3); }
        /* nút gạt ở dòng tiêu đề (Bán ra | Mua vào của BC013): thấp hơn nút thanh lọc để dòng tiêu đề chỉ cao thêm ~4px */
        .ds-head .ds-seg { height: 26px; margin-left: 6px; align-self: center; }
        .ds-head .ds-seg button { height: 22px; padding: 0 10px; font-size: 12px; }
        .ds-status { display: flex; align-items: center; gap: 16px; height: 26px; flex: none; padding: 0 14px; background: #fff; border-top: 1px solid var(--ds-line); font-size: 11.5px; color: var(--ds-ink-3); white-space: nowrap; overflow: hidden; }
        .ds-status b { font-weight: 500; color: var(--ds-ink-2); font-variant-numeric: tabular-nums; }
        .ds-status .ds-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--ds-ok); vertical-align: 1px; }
        .ds-status .ds-right { margin-left: auto; display: flex; gap: 16px; }
        .ds-status .ds-timing { color: var(--ds-ink-2); cursor: help; }
        .ds-status .ds-timing span { color: var(--ds-ink-3); }

        /* Bộ lọc thời gian (v1.10.7, TimeRangePicker): trái 3 chế độ, phải 2 lịch; dải chọn nền xanh nhạt liền mạch, 2 đầu mút tròn xanh đậm */

        /* Tooltip tên bảng / báo cáo ở thanh bên (v1.10.6, Trum 29/09): chỉ hiện khi tên bị cắt "…", thanh bên thu gọn, hoặc báo cáo
           đang hiện tên viết tắt. Gắn vào body (portal) + position: fixed → thanh bên (overflow hidden) không cắt mất. */

                     font-size: 12.5px; line-height: 1.4; box-shadow: 0 8px 24px rgba(14,26,43,.22); pointer-events: none; transform: translateY(-50%);
                     animation: dsTipIn .14s cubic-bezier(.2, 0, 0, 1); }

        /* ===== BẢNG DỮ LIỆU (Đợt 3, 27/09/2026) — class ds-grid trên 7 bảng =====
           Đè kiểu cũ trong ô (font-black, italic, chữ xanh/đỏ/teal/chàm, font-mono) bằng CSS thay vì sửa từng ô của 7 component
           dòng (30–44 cột mỗi cái). Giữ nghĩa nhấn: ô font-black/font-bold (số CT, TK, số tiền) = mực đậm vừa, ô italic (tên) = mực phụ.
           Nợ/Có cùng màu mực. Đầu cột chữ thường. Dòng ~30px (ô py-1.5 + line-height 18px). */
        .ds-grid { font-size: 12px; color: var(--ds-ink-2); }
        .ds-grid thead th { height: 34px; padding: 0 10px !important; background: var(--ds-wash); color: var(--ds-ink-3); font-size: 11.5px; font-weight: 500; text-transform: none; letter-spacing: 0; white-space: nowrap; border-bottom: 1px solid var(--ds-line); border-right-color: var(--ds-line-soft); }
        .ds-grid thead tr.ds-search-row th { height: auto; padding: 4px !important; background: #fff; }
        .ds-colsearch { width: 100%; height: 26px; padding: 0 6px; border: 1px solid var(--ds-line); border-radius: 6px; background: #fff; font-size: 12px; font-weight: 400; color: var(--ds-ink); outline: none; transition: border-color .12s, box-shadow .12s; }
        .ds-colsearch:hover { border-color: var(--ds-line-strong); }
        .ds-colsearch:focus { border-color: var(--ds-brand); box-shadow: 0 0 0 2px var(--ds-brand-soft); }
        /* Viền TÁCH, không gộp (27/09/2026): với border-collapse Chrome vẽ sai phần tiêu đề dính → cuộn thì chữ dòng bên dưới lọt
           lên hàng ô tìm theo cột. Chế độ tách bỏ qua viền đặt trên <tr>/<tfoot> → vạch ngang chuyển xuống <td>. */
        table.ds-grid { border-collapse: separate; border-spacing: 0; }
        .ds-grid tbody td { border-bottom: 1px solid var(--ds-line-soft); }
        .ds-grid tbody td { border-color: var(--ds-line-soft); font-weight: 400; font-style: normal; }
        /* MỌI DÒNG CÙNG CHIỀU CAO (v1.10.3): bảng ảo đặt vị trí dòng theo 1 chiều cao đo được. Trước đây ô xuống dòng (mã có gạch nối
           "KL-CRM.CALCENTER" ở cột hẹp, tên dài) cao 39–111px, dòng có Diễn giải trống thấp 21px thay vì 31px → kéo thanh cuộn thấy
           bảng trắng, cuộn giật (video Trum 28/09). Ô 1 dòng ở đây; ô trống vẽ 1 dấu cách không ngắt (gridCell) để cao bằng ô có chữ.
           KHÔNG dùng td:empty::after cho việc này: đo 28/09 mỗi bước cuộn chậm thêm 3–11 ms (Chrome dò lại :empty mỗi lần chữ trong ô đổi). */
        .ds-grid tbody td { white-space: nowrap; }
        .ds-grid tbody tr:hover > td { background: var(--ds-wash); }
        .ds-grid tbody td.font-black, .ds-grid tbody td.font-bold { font-weight: 500; color: var(--ds-ink); }
        .ds-grid tbody td.italic { color: var(--ds-ink-2); }
        .ds-grid tbody td[class*="text-emerald"], .ds-grid tbody td[class*="text-red"], .ds-grid tbody td[class*="text-teal"], .ds-grid tbody td[class*="text-indigo"],
        .ds-grid tbody td[class*="text-blue"], .ds-grid tbody td[class*="text-violet"], .ds-grid tbody td[class*="text-amber"], .ds-grid tbody td[class*="text-orange"] { color: var(--ds-ink); }
        .ds-grid .font-mono { font-family: inherit; font-variant-numeric: tabular-nums; }
        /* DT chờ phân bổ theo tháng (Trum 29/09): dải Lũy kế trước · các tháng · Lũy kế trong kỳ · Giá trị còn lại in đậm, nền xanh
           nhạt để mắt dò theo cột; ô bằng 0 chữ nhạt để số khác 0 nổi lên. Rê chuột dòng vẫn đổi nền cả dòng (luật hover mạnh hơn). */
        .ds-grid thead th.ds-im-h { background: #E4EEF7; color: var(--ds-ink); font-weight: 600; }
        .ds-grid tbody td.ds-im-m { font-weight: 600; color: var(--ds-ink); background: #F5F9FD; }
        .ds-grid tbody td.ds-im-lk { font-weight: 600; color: var(--ds-ink); background: #EBF3FA; }
        .ds-grid tbody td.ds-im-cl { font-weight: 700; color: var(--ds-brand); background: #EBF3FA; }
        .ds-grid tbody td.ds-im-0 { font-weight: 400; color: var(--ds-ink-4); }
        .ds-grid tfoot td.ds-im-f { background: #E4EEF7; }
        .ds-grid tfoot td.ds-im-fcl { background: #E4EEF7; color: var(--ds-brand); font-weight: 700; }
        .ds-grid tr.ds-grp > td { color: var(--ds-ink); font-weight: 500; border-color: var(--ds-line-soft); }

        .ds-grid tr.ds-grp-1 > td { background: var(--ds-wash); }
        .ds-grid tr.ds-grp:hover > td { background: #DDE6F0; }
        .ds-grid tr.ds-grp .ml-2 { color: var(--ds-ink-3); font-weight: 400; }
        .ds-grid tr.ds-grp span.rounded-sm { background: #fff; border-color: var(--ds-line-strong); color: var(--ds-ink-2); }
        .ds-grid tfoot td { padding-top: 8px; padding-bottom: 8px; background: var(--ds-wash); color: var(--ds-ink); font-size: 12px; font-weight: 600; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; border-color: var(--ds-line-soft); }
        .ds-grid tfoot td.uppercase { color: var(--ds-ink-3); font-weight: 500; }
        .ds-grid tfoot td { border-top: 1px solid var(--ds-line-strong); }   /* thay viền trên của .sticky-footer (viền tách bỏ qua viền <tfoot>) */
        /* Bố cục cột (v1.10.0): mọi ô đều có border-r, ô cuối hàng bỏ viền phải → cột nào bị kéo xuống cuối cũng đúng

        .ds-grid tr:not(.ds-search-row) > :last-child { border-right-width: 0; }
        .ds-grid thead th[data-drop="before"] { box-shadow: inset 2px 0 0 var(--ds-brand); }
        .ds-grid thead th[data-drop="after"] { box-shadow: inset -2px 0 0 var(--ds-brand); }
        /* Kéo độ rộng cột (v1.11.4): mép 7px ở cạnh phải ô tiêu đề, rê vào tiêu đề hiện vạch xám, rê đúng mép / đang kéo vạch xanh.
           Độ rộng + vị trí cột đóng băng nằm trong thẻ <style> sinh theo từng bảng (useGridCss), không viết ở đây. */
        .ds-grid thead tr:first-child > th { position: relative; }

        .ds-col-rz::after { content: ''; position: absolute; top: 9px; bottom: 9px; right: 2px; width: 2px; border-radius: 1px; background: transparent; transition: background-color .12s; }
        .ds-grid thead th:hover > .ds-col-rz::after { background: var(--ds-line-strong); }
        .ds-grid thead th > .ds-col-rz:hover::after, .ds-col-rz.is-on::after { top: 4px; bottom: 4px; background: var(--ds-brand); }
        body.ds-col-resizing, body.ds-col-resizing * { cursor: col-resize !important; user-select: none !important; }
        .ds-groupzone { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 36px; margin: 0 0 8px; padding: 4px 8px; border: 1px dashed var(--ds-line-strong); border-radius: 8px; font-size: 12px; color: var(--ds-ink-3); }
        .ds-gchip { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 3px 0 9px; border: 1px solid var(--ds-brand-line); border-radius: 6px; background: var(--ds-brand-soft); color: var(--ds-brand); font-size: 12px; font-weight: 500; cursor: move; }

        .ds-loadbar { position: absolute; top: 0; left: 0; width: 35%; height: 2px; background: var(--ds-brand); animation: dsLoad 1.1s cubic-bezier(.4, 0, .2, 1) infinite; }

        .ds-pager { display: flex; justify-content: space-between; align-items: center; flex: none; z-index: 40; padding: 6px 16px; background: #fff; border-top: 1px solid var(--ds-line); }
        .ds-pgbtn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--ds-ink-3); transition: background-color .12s, color .12s; }

        /* ===== MÀN ĐĂNG NHẬP (Đợt 6, 27/09/2026): trái giấy sổ cái + sóc IACC, phải form =====
           Theo mockup đã duyệt (Desktop\IVT\present IVT\SOC\DataReport-mockup.html). Ảnh: assets/soc-it.webp (1068×1332 gồm bóng đổ, sóc 900×1292,

        .ds-login { display: grid; grid-template-columns: 56% 44%; height: 100vh; background: #fff; color: var(--ds-ink); }

        /* Quầng nền cùng màu panel quanh form: họa tiết công nghệ (v1.10.8) chạy tới đâu cũng mờ dần trước khi tới chữ — màn hẹp /

        .ds-login-side .ds-login-form { background: #FAFCFE; border-radius: 28px; box-shadow: 0 0 36px 30px #FAFCFE; }
