        // Thanh chuyển trang NGANG: nút ‹ ›, ô số trang gõ được — gõ số rồi Enter (hoặc rời ô) để nhảy thẳng tới trang.
        const PageJumper = ({ page, totalPages, onGoto, compact = false }) => {
            const [txt, setTxt] = React.useState(String(page));
            React.useEffect(() => { setTxt(String(page)); }, [page]);
            const go = () => {
                let v = parseInt(txt, 10);
                if (isNaN(v)) { setTxt(String(page)); return; }
                v = Math.max(1, Math.min(totalPages, v));
                setTxt(String(v));
                if (v !== page) onGoto(v);
            };
            const btn = compact ? "w-9 h-9" : "w-10 h-10";
            return (
                <div className="flex items-center gap-1">
                    <button disabled={page <= 1} onClick={() => onGoto(page - 1)} className="ds-pgbtn" title="Trang trước"><Icon name="chevron-left" size={16} stroke={2}/></button>
                    <div className="flex items-center gap-1.5 px-1 text-[12.5px] text-ink-3">
                        <span>Trang</span>
                        <input type="number" min="1" max={totalPages} value={txt}
                            onChange={e => setTxt(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); go(); e.target.blur(); } }}
                            onBlur={go}
                            onFocus={e => e.target.select()}
                            className="ds-input ds-pgnum w-14 h-7 text-center tabular-nums" />
                        <span className="tabular-nums">/ {totalPages}</span>
                    </div>
                    <button disabled={page >= totalPages} onClick={() => onGoto(page + 1)} className="ds-pgbtn" title="Trang sau"><Icon name="chevron-right" size={16} stroke={2}/></button>
                </div>
            );
        };

        // ===== DIALOG XUẤT BÁO CÁO — Excel chuẩn form (.xlsx) hoặc CSV thô, dùng chung cho BC005–BC013 =====
        // Luồng: chọn định dạng / mẫu / tên file → POST /api/report_export/start → poll /api/export/status mỗi 0,4s
        // (tiến trình THẬT: server ghi tới dòng nào báo tới dòng đó) → xong hiện Mở file / Mở thư mục ngay tại chỗ.
        // Thay 4 modal cũ + thanh tiến trình giả chạy bằng setTimeout. cfg do ReportTab dựng (xem exportCfg).
        const fmtCount = (n) => (Number(n) || 0).toLocaleString('vi-VN');
        const fmtBytes = (b) => {
            b = Number(b) || 0;
            if (b < 1024) return `${b} B`;
            if (b < 1048576) return `${Math.round(b / 1024).toLocaleString('vi-VN')} KB`;
            if (b < 1073741824) return `${(b / 1048576).toLocaleString('vi-VN', { maximumFractionDigits: 1 })} MB`;
            return `${(b / 1073741824).toLocaleString('vi-VN', { maximumFractionDigits: 2 })} GB`;
        };
        const fmtClock = (sec) => {
            sec = Math.max(0, Math.round(Number(sec) || 0));
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        // ===== THƯ MỤC LƯU FILE THEO MÀN HÌNH (v1.10.9, Trum 30/09) =====
        // Mỗi màn hình (8 tab dữ liệu + 9 báo cáo) nhớ 1 thư mục lưu file xuất TRÊN MÁY NÀY — server giữ ở %LocalAppData%\
        // iPOS_Ledger_Studio\export_dirs.json, chung mọi CSDL; chưa khai → Downloads\iPOS_Ledger_Studio. Đổi ở dòng "Lưu vào" của menu
        // Xuất Excel (tab dữ liệu) / hộp Xuất báo cáo. Thư mục đã khai mà hỏng (rút USB, mất ổ mạng, bị xoá…) → KHÔNG lưu chỗ khác:
        // cảnh báo + bắt chọn lại (ensureExportDir chạy TRƯỚC khi xuất), chọn xong xuất tiếp. Khoá màn hình = id tab / mã báo cáo —
        // trùng _EXPORT_SCREENS ở server. KHÔNG tính gì từ DOC_TABS ở cấp trên cùng: DOC_TABS khai báo SAU khối này (chạy lúc nạp là undefined).
        const exportScreenName = (s) => NAV_DOC_META[s] ? NAV_DOC_META[s][0] : NAV_REPORT_META[s] ? `${NAV_REPORT_META[s][1]} (${s})` : s;
        // Đường dẫn dài → "D:\…\Thang 08\BC007": giữ ổ / máy chủ + các thư mục cuối cho vừa chỗ hẹp (rê chuột xem đủ)
        const shortPath = (p, max = 46) => {
            p = String(p || '');
            if (p.length <= max) return p;
            const unc = p.startsWith('\\\\'), parts = p.split('\\');
            const head = unc ? '\\\\' + parts[2] : parts[0];
            let tail = parts[parts.length - 1];
            for (let i = parts.length - 2; i > (unc ? 2 : 0); i--) {
                if ((head + '\\…\\' + parts[i] + '\\' + tail).length > max) break;
                tail = parts[i] + '\\' + tail;
            }
            const s = head + '\\…\\' + tail;
            return s.length <= max ? s : '…' + p.slice(-(max - 1));
        };
        const exportDirHost = { open: null };   // ExportDirHost (gắn 1 lần trong App) đặt hàm mở hộp vào đây
        // Mở hộp "Thư mục lưu file" từ bất cứ đâu → Promise: thông tin thư mục sau khi Lưu ({ dir, custom, … }), null khi Hủy.
        // warn = { dir, reason, canCreate }: thư mục đã khai đang hỏng → hộp cảnh báo, nút chính "Lưu và xuất tiếp".
        const askExportDir = (screen, warn) => new Promise(resolve => {
            if (exportDirHost.open) exportDirHost.open({ id: Date.now() + Math.random(), screen, warn: warn || null, resolve });
            else resolve(null);
        });
        // Kiểm thư mục lưu của màn hình TRƯỚC khi xuất → thông tin thư mục (dùng được, hoặc vừa chọn lại); null = người dùng Hủy, thôi xuất.
        const ensureExportDir = async (screen) => {
            let j = null;
            try { j = await fetch(`/api/export/dir?screen=${encodeURIComponent(screen)}`).then(r => r.json()); }
            catch (e) { return {}; }   // không hỏi được phần chạy nền → cứ xuất, job tự báo lỗi như cũ
            if (!j || j.status !== 'ok' || j.ok) return j || {};
            return await askExportDir(screen, { dir: j.dir, reason: j.reason, canCreate: j.can_create });
        };

        const ExportDirDialog = ({ req, onClose }) => {
            const { screen, warn } = req;
            const [info, setInfo] = React.useState(null);        // { dir, default, custom } của màn hình
            const [val, setVal] = React.useState(warn ? warn.dir : '');
            const [all, setAll] = React.useState(false);
            const [busy, setBusy] = React.useState('');          // '' | 'pick' (đang mở hộp chọn của Windows) | 'save'
            const [err, setErr] = React.useState(null);          // { text, canCreate, dir }
            const inputRef = React.useRef(null);
            // đường dẫn dài: đưa con trỏ về cuối để ô hiện phần cuối (tên thư mục) thay vì "C:\Users\…"
            const caretEnd = () => setTimeout(() => { const el = inputRef.current; if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 0);
            React.useEffect(() => {
                let alive = true;
                if (warn) caretEnd();
                fetch(`/api/export/dir?screen=${encodeURIComponent(screen)}&quick=1`).then(r => r.json()).then(j => {
                    if (!alive || j.status !== 'ok') return;
                    setInfo(j);
                    if (!warn) { setVal(v => v || j.dir); caretEnd(); }
                }).catch(() => {});
                return () => { alive = false; };
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, []);
            const save = async (opts = {}) => {
                if (busy) return;
                const dir = opts.dir !== undefined ? opts.dir : val.trim();
                if (!dir) { setErr({ text: 'Chưa có đường dẫn thư mục.' }); return; }
                setBusy('save'); setErr(null);
                try {
                    const r = await fetch('/api/export/dir', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ screen, dir, all, create: !!opts.create }) });
                    const j = await r.json().catch(() => ({}));
                    if (r.ok && j.status === 'ok') { onClose(j); return; }
                    setErr({ text: j.message || `Máy chủ báo lỗi (HTTP ${r.status}).`, canCreate: !!j.can_create, dir: j.dir });
                } catch (e) { setErr({ text: viErr(e) }); }
                setBusy('');
            };
            const pick = async () => {
                if (busy) return;
                setBusy('pick'); setErr(null);
                try {
                    const j = await fetch('/api/export/pick_dir', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ start: val.trim() || (info && info.dir) || '' }) }).then(r => r.json());
                    if (j.status === 'ok' && j.dir) setVal(j.dir);
                    else if (j.status === 'error') setErr({ text: j.message || 'Không mở được hộp chọn thư mục.' });
                } catch (e) { setErr({ text: viErr(e) }); }
                setBusy('');
                caretEnd();
            };
            // Esc / Enter bắt ở pha capture của window + chặn lan: hộp này có thể nằm TRÊN hộp Xuất báo cáo — hộp đó nghe keydown ở window
            // (Enter = xuất, Esc = đóng) → không chặn thì 1 phím chạy cả 2 hộp. Enter trên nút thì để nút tự bấm.
            React.useEffect(() => {
                const onKey = (e) => {
                    if (e.key !== 'Escape' && e.key !== 'Enter') return;
                    e.stopPropagation();
                    if (e.key === 'Escape') { e.preventDefault(); if (!busy) onClose(null); }
                    else if (!e.isComposing && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); save(); }
                };
                window.addEventListener('keydown', onKey, true);
                return () => window.removeEventListener('keydown', onKey, true);
            });
            const def = info ? info.default : '';
            return (
                <div className="ds-scrim" style={{ zIndex: 100001 }} onMouseDown={e => { if (e.target === e.currentTarget && !busy) onClose(null); }}>
                    <div className="ds-dialog is-wide" role="dialog" aria-modal="true">
                        <div className="ds-dlg-head">
                            <div className={`ds-dlg-ic ${warn ? 'is-warn' : ''}`}><Icon name={warn ? 'alert-circle' : 'folder-open'} size={18} stroke={2} /></div>
                            <div className="flex-1 min-w-0">
                                <h3>{warn ? 'Không lưu được vào thư mục đã chọn' : 'Thư mục lưu file'}</h3>
                                <div className="ds-dlg-sub">{exportScreenName(screen)} · nhớ trên máy này</div>
                            </div>
                            <button onClick={() => { if (!busy) onClose(null); }} className="ds-iconbtn ds-dlg-x" title="Đóng (Esc)"><Icon name="x" size={16} stroke={2} /></button>
                        </div>
                        <div className="ds-dlg-body space-y-4">
                            {warn && (
                                <div className="ds-note is-warn">
                                    <Icon name="alert-circle" size={14} stroke={2} />
                                    <div className="min-w-0">
                                        <div><b className="break-all">{warn.dir}</b></div>
                                        <div>{warn.reason}</div>
                                        <div className="mt-1">Chọn lại thư mục để xuất tiếp{warn.canCreate ? ', hoặc tạo lại đúng thư mục cũ.' : '.'}</div>
                                        {warn.canCreate && (
                                            <button type="button" className="ds-btn mt-2" disabled={!!busy} onClick={() => save({ dir: warn.dir, create: true })}>
                                                <Icon name="plus" size={14} stroke={2} /> Tạo lại thư mục này
                                            </button>
                                        )}
                                    </div>
                                </div>
                            )}
                            <div>
                                <div className="ds-field-label">Thư mục lưu file xuất của màn hình này</div>
                                <div className="ds-dirinput">
                                    <div className="ds-filename">
                                        <input ref={inputRef} value={val} autoFocus spellCheck={false} placeholder="D:\KeToan\BaoCao"
                                            onChange={e => { setVal(e.target.value); setErr(null); }} />
                                    </div>
                                    <button type="button" className="ds-btn" disabled={!!busy} onClick={pick}>
                                        {busy === 'pick' ? <><Icon name="loader" size={14} className="animate-spin" /> Đang mở…</> : <><Icon name="folder-open" size={14} stroke={2} /> Chọn thư mục…</>}
                                    </button>
                                </div>
                                <div className="text-[12px] text-ink-3 mt-1.5">
                                    {busy === 'pick' ? 'Chọn thư mục trong hộp của Windows rồi bấm "Chọn thư mục".'
                                        : 'Bấm "Chọn thư mục…", hoặc copy đường dẫn trên thanh địa chỉ của File Explorer rồi dán vào ô.'}
                                </div>
                                {err && (
                                    <div className="ds-note is-bad mt-2">
                                        <Icon name="alert-circle" size={14} stroke={2} />
                                        <div className="min-w-0 flex-1">
                                            <ErrText text={err.text} />
                                            {err.canCreate && (
                                                <button type="button" className="ds-btn mt-2" disabled={!!busy} onClick={() => save({ dir: err.dir, create: true })}>
                                                    <Icon name="plus" size={14} stroke={2} /> Tạo thư mục này
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                            <label className="ds-lg-check" style={{ marginBottom: 0 }}>
                                <input type="checkbox" checked={all} onChange={e => setAll(e.target.checked)} />
                                <span className="ds-cbox"><Icon name="check" size={11} stroke={3} /></span>
                                <span>Áp dụng cho mọi màn hình ({DOC_TABS.length + REPORT_TYPES.length} màn dữ liệu và báo cáo)</span>
                            </label>
                            <div className="ds-savedir">
                                <span className="shrink-0">Mặc định:</span>
                                <span className="ds-sd-path" title={def}>{def ? shortPath(def, 56) : 'Downloads\\iPOS_Ledger_Studio'}</span>
                                <button type="button" className="ds-sd-btn" disabled={!!busy || !def} onClick={() => { setVal(def); setErr(null); caretEnd(); }}>Về mặc định</button>
                            </div>
                        </div>
                        <div className="ds-dlg-foot">
                            <div className="hidden sm:flex items-center gap-1.5 text-[12px] text-ink-3 mr-auto">
                                <span className="ds-kbd">Enter</span> lưu <span className="ds-kbd ml-2">Esc</span> đóng
                            </div>
                            <button onClick={() => onClose(null)} disabled={!!busy} className="ds-btn">Hủy</button>
                            <button onClick={() => save()} disabled={!!busy || !val.trim()} className="ds-btn ds-btn-pri">
                                {busy === 'save' ? <Icon name="loader" size={14} className="animate-spin" /> : <Icon name="check" size={14} stroke={2} />} {warn ? 'Lưu và xuất tiếp' : 'Lưu'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };
        // Gắn 1 lần trong App: giữ hộp "Thư mục lưu file" đang mở (mỗi lần mở là 1 hộp mới — key theo id).
        const ExportDirHost = () => {
            const [req, setReq] = React.useState(null);
            const cur = React.useRef(null);
            React.useEffect(() => {
                const open = (r) => { if (cur.current) cur.current.resolve(null); cur.current = r; setReq(r); };
                exportDirHost.open = open;
                return () => { if (exportDirHost.open === open) exportDirHost.open = null; };
            }, []);
            if (!req) return null;
            return <ExportDirDialog key={req.id} req={req} onClose={(res) => { cur.current = null; req.resolve(res || null); setReq(null); }} />;
        };

        // Hộp Xuất file — DÙNG CHUNG cho báo cáo (ReportTab, cfg dựng từ bản chụp bộ lọc) và 8 tab dữ liệu (App → listExportCfg, v1.12.1).
        // cfg chung: title, fileBase(mẫu, định dạng), estimate(mẫu), periodText, unitText, serverQuery, staleNote, variants, defaultVariant.
        // Báo cáo: code + buildBody → POST /api/report_export/start. Danh sách thêm (đều tuỳ chọn, báo cáo không truyền = như cũ):
        // screen (khoá thư mục lưu, mặc định = code), kicker, noun, formats, variantLabel, onVariant, checks(định dạng, số dòng, số sheet),
        // formatNote (undefined = lời nhắc dữ liệu lớn mặc định), counting (đang đếm dòng), blocked (lý do khoá nút Xuất),
        // start({ variant, format, name, track, signal }) → { status: 'ok', job_id } (job server — hộp tự poll)
        // | { status: 'done' | 'cancelled' | 'error', … } (job chạy ngay trong trình duyệt, báo tiến trình qua track) | { code: 'export_dir', … }.
        const REPORT_EXPORT_FORMATS = [
            { id: 'xlsx', icon: 'file-spreadsheet', title: 'Excel chuẩn form', ext: '.xlsx', desc: 'Y như trên app: tiêu đề, in đậm, màu nền, chữ ký. Số vẫn cộng trừ được.', badge: 'Khuyên dùng' },
            { id: 'csv', icon: 'zap', title: 'CSV dữ liệu thô', ext: '.csv', desc: 'Chỉ bảng dữ liệu, không định dạng. Nhẹ và ghi nhanh nhất.' },
        ];
        const ReportExportDialog = ({ open, onClose, cfg }) => {
            const [step, setStep] = React.useState('options');   // options | running | done | error | cancelled
            const [format, setFormat] = React.useState('xlsx');
            const [variant, setVariant] = React.useState('');
            const [fileBase, setFileBase] = React.useState('');
            const [nameEdited, setNameEdited] = React.useState(false);
            const [exportDir, setExportDir] = React.useState('');
            const [dirInfo, setDirInfo] = React.useState(null);   // thư mục lưu của báo cáo (v1.10.9): { dir, custom, ok, reason }
            const [job, setJob] = React.useState(null);
            const [speed, setSpeed] = React.useState(0);
            const [errorMsg, setErrorMsg] = React.useState('');
            const [cancelling, setCancelling] = React.useState(false);
            const [actionMsg, setActionMsg] = React.useState('');
            const jobIdRef = React.useRef(null);
            const timerRef = React.useRef(null);
            const samplesRef = React.useRef([]);
            const phaseRef = React.useRef('');
            const aliveRef = React.useRef(true);
            const abortRef = React.useRef(null);     // lượt xuất đang chạy — Hủy job chạy trong trình duyệt = abort()
            const retryDirRef = React.useRef(null);  // poll (memo 1 lần) gọi bản retryDir của lượt vẽ mới nhất
            const startRef = React.useRef(null);     // retryDir chạy lại bằng start của lượt vẽ mới nhất (bản cũ còn giữ step 'running' → bỏ qua)

            React.useEffect(() => {
                aliveRef.current = true;
                return () => { aliveRef.current = false; clearTimeout(timerRef.current); if (abortRef.current) abortRef.current.abort(); };
            }, []);

            React.useEffect(() => {
                if (!open) return;
                clearTimeout(timerRef.current);
                jobIdRef.current = null;
                const v = cfg.defaultVariant || '';
                setStep('options'); setFormat('xlsx'); setVariant(v);
                setFileBase(cfg.fileBase(v, 'xlsx')); setNameEdited(false);
                setJob(null); setSpeed(0); setErrorMsg(''); setCancelling(false); setActionMsg(''); setDirInfo(null);
                fetch(`/api/export/dir?screen=${cfg.screen || cfg.code}&quick=1`).then(r => r.json()).then(j => {
                    if (aliveRef.current && j.status === 'ok') { setExportDir(j.dir); setDirInfo(j); }
                }).catch(() => {});
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [open]);

            // 1 bản tin tiến trình (job server qua poll, hoặc job chạy ngay trong trình duyệt qua track) → tốc độ + state
            const track = React.useCallback((s) => {
                const now = Date.now();
                if (s.phase !== phaseRef.current) { phaseRef.current = s.phase; samplesRef.current = []; setSpeed(0); }   // tải → ghi: bộ đếm về 0, đo tốc độ lại
                const arr = samplesRef.current;
                arr.push({ t: now, n: s.current || 0 });
                while (arr.length > 2 && now - arr[0].t > 5000) arr.shift();
                const dt = (arr[arr.length - 1].t - arr[0].t) / 1000;
                if (dt >= 0.8) setSpeed(Math.max(0, (arr[arr.length - 1].n - arr[0].n) / dt));
                setJob(s);
            }, []);

            const poll = React.useCallback(async () => {
                const id = jobIdRef.current;
                if (!id || !aliveRef.current) return;
                let s = null;
                try {
                    const r = await fetch(`/api/export/status?job_id=${id}`);
                    if (r.status === 404) {
                        if (id === jobIdRef.current) { setErrorMsg('Máy chủ không còn giữ tiến trình xuất này (ứng dụng vừa khởi động lại?). Hãy xuất lại.'); setStep('error'); }
                        return;
                    }
                    s = await r.json();
                } catch (e) {
                    if (window.isNetworkError && window.isNetworkError(e)) { window.showConnectionLost(); return; }
                }
                if (id !== jobIdRef.current || !aliveRef.current) return;   // dialog đã đóng hoặc đã xuất lượt khác
                if (s) {
                    track(s);
                    if (s.status === 'done') { setStep('done'); return; }
                    // job danh sách: thư mục lưu hỏng lúc tạo job → job lỗi ngay kèm code (báo cáo nhận 409 ngay ở start)
                    if (s.status === 'error' && s.code === 'export_dir') { jobIdRef.current = null; retryDirRef.current(s); return; }
                    if (s.status === 'error') { setErrorMsg(s.error || 'Lỗi không xác định khi ghi file.'); setStep('error'); return; }
                    if (s.status === 'cancelled') { setStep('cancelled'); return; }
                }
                timerRef.current = setTimeout(poll, 400);
            }, []);

            const screenKey = () => cfg.screen || cfg.code;
            const fmtList = () => cfg.formats || REPORT_EXPORT_FORMATS;
            const extOf = (f) => { const l = fmtList(); return (l.find(x => x.id === f) || l[0]).ext.slice(1); };   // 'Tách sheet theo đơn vị' → xlsx
            const applyDir = (d) => { if (d && d.dir) { setExportDir(d.dir); setDirInfo(d); } };
            const changeDir = async () => applyDir(await askExportDir(screenKey()));
            const checkingRef = React.useRef(false);
            // Thư mục lưu vừa hỏng sau lần kiểm trước khi xuất → hỏi chọn lại rồi xuất tiếp
            const retryDir = async (j) => {
                setStep('options');
                const d2 = await askExportDir(screenKey(), { dir: j.dir, reason: j.reason, canCreate: j.can_create });
                if (d2 && aliveRef.current) { applyDir(d2); startRef.current(); }
            };
            retryDirRef.current = retryDir;
            // Báo cáo (mặc định): server dựng plan + chạy job nền
            const startReport = async ({ variant, format, name }) => {
                const body = { ...cfg.buildBody(variant, format), filename: name };
                const r = await fetch('/api/report_export/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                const j = await r.json().catch(() => ({}));
                if (j.status !== 'ok' && !j.message) j.message = `Máy chủ báo lỗi (HTTP ${r.status}).`;
                return j;
            };
            const start = async () => {
                if (step === 'running' || checkingRef.current || cfg.blocked) return;
                const name = fileBase.trim();
                if (!name) { setActionMsg('Hãy nhập tên file trước khi xuất.'); return; }
                // Thư mục lưu đã khai mà hỏng → cảnh báo + bắt chọn lại TRƯỚC khi xuất (v1.10.9); Hủy chọn = thôi xuất
                checkingRef.current = true;
                const d = await ensureExportDir(screenKey());
                checkingRef.current = false;
                if (!aliveRef.current || !d) return;
                applyDir(d);
                setActionMsg(''); setErrorMsg(''); setCancelling(false); setSpeed(0); samplesRef.current = []; phaseRef.current = '';
                const ctl = new AbortController();
                abortRef.current = ctl;
                setJob({ status: 'running', phase: 'prepare', current: 0, total: cfg.estimate(variant) || 0, filename: `${name}.${extOf(format)}` });
                setStep('running');
                try {
                    const j = await (cfg.start || startReport)({ variant, format, name, signal: ctl.signal,
                        track: (s) => { if (aliveRef.current && abortRef.current === ctl) track(s); } });
                    if (!aliveRef.current) return;
                    if (j.code === 'export_dir') { retryDir(j); return; }
                    if (j.status === 'done') { setJob(prev => ({ ...prev, ...j })); setStep('done'); return; }   // job chạy ngay trong trình duyệt
                    if (j.status === 'cancelled') { setStep('cancelled'); return; }
                    if (j.status !== 'ok' || !j.job_id) { setErrorMsg(j.message || 'Máy chủ không bắt đầu xuất được.'); setStep('error'); return; }
                    jobIdRef.current = j.job_id;
                    if (j.filename) setJob(prev => ({ ...prev, filename: j.filename }));
                    if (j.dir) setExportDir(j.dir);
                    poll();
                } catch (e) {
                    if (!aliveRef.current) return;
                    if (e && e.name === 'AbortError') { setStep('cancelled'); return; }   // Hủy job chạy trong trình duyệt
                    if (window.isNetworkError && window.isNetworkError(e)) { window.showConnectionLost(); return; }
                    setErrorMsg(viErr(e)); setStep('error');
                }
            };
            startRef.current = start;

            const cancel = async () => {
                const id = jobIdRef.current;
                if (cancelling) return;
                if (!id) {   // job chạy ngay trong trình duyệt (Tách sheet theo đơn vị): ngắt lượt tải / dựng file, job tự dừng ở bước kế
                    if (job && job.local && abortRef.current) { setCancelling(true); abortRef.current.abort(); }
                    return;
                }
                setCancelling(true);
                try { await fetch('/api/export/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: id }) }); } catch (e) { /* poll sẽ báo lỗi mạng */ }
            };

            const close = () => {
                if (step === 'running') return;
                clearTimeout(timerRef.current);
                jobIdRef.current = null;
                onClose();
            };

            const openTarget = async (kind) => {
                if (!job || !job.file_path) return;
                try {
                    const r = await fetch(`/api/open_${kind}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: job.file_path }) });
                    const j = await r.json();
                    if (j.status !== 'ok') { setActionMsg(j.message || 'Không mở được.'); return; }
                    close();
                } catch (e) { setActionMsg('Không mở được: ' + viErr(e).split('\n')[0]); }
            };

            React.useEffect(() => {
                if (!open) return;
                const onKey = (e) => {
                    if (e.key === 'Escape' && step !== 'running') { e.preventDefault(); close(); }
                    else if (e.key === 'Enter' && step === 'options' && !e.isComposing) { e.preventDefault(); start(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            });

            if (!open) return null;

            const ext = extOf(format);
            const isXlsx = ext === 'xlsx';
            const est = cfg.estimate(variant);
            const sheetsEst = est ? Math.max(1, Math.ceil(est / 1000000)) : 1;
            const heavy = isXlsx && est > 200000;
            const fmtNote = cfg.formatNote ? cfg.formatNote(format, est) : undefined;   // undefined = lời nhắc dữ liệu lớn mặc định
            const fmts = fmtList();
            const phase = job ? job.phase : 'prepare';
            const current = job ? (job.current || 0) : 0;
            const total = job ? (job.total || 0) : 0;
            // v1.10.6: báo cáo nhiều dòng TẢI hết về máy trước (có %), rồi mới GHI file (có %) — xem server "XUẤT FILE LỚN…"
            const writing = (phase === 'write' || phase === 'fetch') && total > 0;
            const pct = step === 'done' || phase === 'finalize' ? 100 : (writing ? Math.min(99, Math.floor(current * 100 / total)) : 0);
            const eta = writing && speed > 0 ? (total - current) / speed : null;
            const retry = job && job.retry;
            const retryLeft = retry ? Math.max(0, Math.ceil(retry.until - Date.now() / 1000)) : 0;
            const steps = [
                { k: 'prepare', label: 'Chuẩn bị' },
                ...(cfg.serverQuery ? [{ k: 'query', label: 'Truy vấn' }, { k: 'fetch', label: 'Tải dữ liệu' }] : []),
                { k: 'write', label: isXlsx ? 'Ghi Excel' : 'Ghi CSV' },
                { k: 'finalize', label: 'Hoàn tất' },
            ];
            const ORDER = { prepare: 0, query: 1, fetch: 2, write: 3, finalize: 4, done: 5 };
            const phaseTitle = retry ? 'Mất kết nối tới máy chủ — đang tự kết nối lại…'
                : phase === 'query' ? 'Đang đếm dữ liệu trên máy chủ…'
                : phase === 'fetch' ? 'Đang tải dữ liệu từ máy chủ…'
                : phase === 'write' ? (isXlsx ? 'Đang ghi file Excel…' : 'Đang ghi file CSV…')
                : phase === 'finalize' ? (isXlsx ? 'Đang đóng gói file .xlsx…' : 'Đang hoàn tất file…')
                : 'Đang chuẩn bị…';
            const variantInfo = (cfg.variants || []).find(v => v.id === variant);

            return (
                <div className="ds-scrim z-[99999]" onMouseDown={e => { if (e.target === e.currentTarget) close(); }}>
                    <div className={`ds-dialog is-wide${fmts.length > 2 ? ' is-wide3' : ''}`} role="dialog" aria-modal="true">
                        {/* ── Đầu hộp thoại ── */}
                        <div className="ds-dlg-head pb-4 border-b border-line-soft">
                            <div className="ds-dlg-ic is-ok"><Icon name="file-spreadsheet" size={18} stroke={2} /></div>
                            <div className="flex-1 min-w-0">
                                <div className="text-[12px] text-ink-3">{cfg.kicker || 'Xuất báo cáo'}</div>
                                <h3>{cfg.title}</h3>
                                <div className="flex flex-wrap gap-1.5 mt-2">
                                    {cfg.code && <span className="ds-tag is-brand">{cfg.code}</span>}
                                    {cfg.periodText && <span className="ds-tag"><Icon name="calendar" size={12} stroke={2} /> {cfg.periodText}</span>}
                                    {cfg.unitText && <span className="ds-tag">{cfg.unitText}</span>}
                                    {cfg.counting ? <span className="ds-tag"><Icon name="loader" size={12} stroke={2} className="animate-spin" /> Đang đếm dòng…</span>
                                        : est ? <span className="ds-tag"><Icon name="rows" size={12} stroke={2} /> {est >= 1000 ? '≈ ' : ''}{fmtCount(est)} dòng</span> : null}
                                </div>
                            </div>
                            {step !== 'running' && (
                                <button onClick={close} className="ds-iconbtn ds-dlg-x" title="Đóng (Esc)"><Icon name="x" size={16} stroke={2} /></button>
                            )}
                        </div>

                        {/* ── BƯỚC 1: tuỳ chọn ── */}
                        {step === 'options' && (
                            <>
                                <div className="ds-dlg-body space-y-4 max-h-[64vh] custom-scrollbar">
                                    {/* lời nhắc đặt ĐẦU phần cuộn — để cuối thì màn 768px phải cuộn mới thấy */}
                                    {cfg.blocked && (
                                        <div className="ds-note is-warn">
                                            <Icon name="alert-circle" size={14} stroke={2} />
                                            <span>{cfg.blocked}</span>
                                        </div>
                                    )}
                                    {cfg.staleNote && (
                                        <div className="ds-note is-info">
                                            <Icon name="alert-circle" size={14} stroke={2} />
                                            <span>{cfg.staleNote}</span>
                                        </div>
                                    )}
                                    <div>
                                        <div className="ds-field-label">Định dạng file</div>
                                        <div className={`grid gap-2 ${fmts.length === 3 ? 'grid-cols-3' : 'grid-cols-2'}`}>
                                            {fmts.map(o => (
                                                <button key={o.id} type="button" className={`ds-choice ${format === o.id ? 'is-on' : ''}`}
                                                    onClick={() => { setFormat(o.id); if (!nameEdited) setFileBase(cfg.fileBase(variant, o.id)); }}>
                                                    <div className="flex items-center gap-2">
                                                        <Icon name={o.icon} size={15} stroke={2} className={o.id === 'xlsx' ? 'text-ok-ink' : 'text-ink-3'} />
                                                        <span className="ds-ct">{o.title}</span>
                                                        <span className="text-[12px] text-ink-3">{o.ext}</span>
                                                        <span className="ds-radio ml-auto"></span>
                                                    </div>
                                                    <div className="ds-cd">{o.desc}</div>
                                                    {o.badge && <span className="ds-tag is-brand mt-2">{o.badge}</span>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {cfg.variants && (
                                        <div>
                                            <div className="ds-field-label">{cfg.variantLabel || 'Mẫu dữ liệu'}</div>
                                            <div className={`grid gap-2 ${cfg.variants.length === 3 ? 'grid-cols-3' : 'grid-cols-2'}`}>
                                                {cfg.variants.map(v => (
                                                    <button key={v.id} type="button"
                                                        onClick={() => { setVariant(v.id); if (cfg.onVariant) cfg.onVariant(v.id); if (!nameEdited) setFileBase(cfg.fileBase(v.id, format)); }}
                                                        className={`ds-choice ${variant === v.id ? 'is-on' : ''}`}>
                                                        <div className="flex items-center gap-2"><span className="ds-radio"></span><span className="ds-ct">{v.label}</span></div>
                                                        <div className="ds-cd">{v.desc}</div>
                                                    </button>
                                                ))}
                                            </div>
                                            {variantInfo && variantInfo.note && <div className="text-[12px] text-ink-3 mt-1.5">{variantInfo.note}</div>}
                                        </div>
                                    )}

                                    <div>
                                        <div className="ds-field-label">Tên file</div>
                                        <div className="ds-filename">
                                            <input value={fileBase} onChange={e => { setFileBase(e.target.value); setNameEdited(true); setActionMsg(''); }} spellCheck={false} />
                                            <span>.{ext}</span>
                                        </div>
                                        <div className={`ds-savedir mt-1.5 ${dirInfo && !dirInfo.ok ? 'is-bad' : ''}`}>
                                            <Icon name="folder-open" size={13} stroke={2} />
                                            <span className="shrink-0">Lưu vào</span>
                                            <span className="ds-sd-path" title={exportDir}>{exportDir ? shortPath(exportDir, 58) : 'Downloads\\iPOS_Ledger_Studio'}</span>
                                            {dirInfo && !dirInfo.custom && <span className="ds-tag">mặc định</span>}
                                            <button type="button" className="ds-sd-btn" onClick={changeDir} title={`Chọn thư mục lưu riêng cho ${cfg.noun || 'báo cáo'} này — nhớ trên máy này`}>Đổi thư mục</button>
                                        </div>
                                        {dirInfo && !dirInfo.ok && <div className="ds-err mt-0.5">{dirInfo.reason} Bấm "Đổi thư mục" để chọn lại.</div>}
                                        <div className="text-[12px] text-ink-4 mt-0.5">Trùng tên file cũ sẽ tự thêm (2), (3)… — không ghi đè file đang mở.</div>
                                    </div>

                                    <div className="ds-checks">
                                        {(cfg.checks ? cfg.checks(format, est, sheetsEst) : isXlsx ? [
                                            'Giữ nguyên form như trên app: khối tiêu đề, in đậm/nghiêng, màu nền, viền, chữ ký',
                                            'Số lưu giá trị thật 1000000, hiển thị 1,000,000 · tỷ lệ 15.52% lưu 0.1552',
                                            sheetsEst > 1
                                                ? `≈ ${fmtCount(est)} dòng → tự tách ${sheetsEst} sheet (tối đa 1.000.000 dòng/sheet), có dòng cộng chuyển sang`
                                                : 'Tự tách sheet khi vượt 1.000.000 dòng, mỗi sheet đủ tiêu đề và dòng cộng chuyển sang',
                                        ] : [
                                            'Không giới hạn số dòng, ghi nhanh nhất',
                                            'Mở bằng Excel vẫn đúng tiếng Việt; mã TK, số hóa đơn giữ nguyên số 0 đầu',
                                            'Không kèm tiêu đề, màu sắc, chữ ký — chỉ bảng dữ liệu',
                                        ]).map((t, i) => (
                                            <div key={i}><Icon name="check" size={12} stroke={2.5} /><span>{t}</span></div>
                                        ))}
                                    </div>

                                    {fmtNote !== undefined ? fmtNote && (
                                        <div className="ds-note is-warn">
                                            <Icon name="clock" size={14} stroke={2} />
                                            <span>{fmtNote}</span>
                                        </div>
                                    ) : heavy && (
                                        <div className="ds-note is-warn">
                                            <Icon name="clock" size={14} stroke={2} />
                                            <span>Dữ liệu lớn (≈ {fmtCount(est)} dòng): cần khoảng {Math.max(1, Math.round(est / 7000 / 60))} phút để tải về và ghi file Excel. Mạng chập chờn thì ứng dụng tự kết nối lại, không phải xuất lại từ đầu. Cần nhanh thì chọn <b>CSV</b>.</span>
                                        </div>
                                    )}
                                    {actionMsg && <div className="ds-err">{actionMsg}</div>}
                                </div>
                                <div className="ds-dlg-foot">
                                    <div className="hidden sm:flex items-center gap-1.5 text-[12px] text-ink-3 mr-auto">
                                        <span className="ds-kbd">Enter</span> xuất <span className="ds-kbd ml-2">Esc</span> đóng
                                    </div>
                                    <button onClick={close} className="ds-btn">Hủy</button>
                                    <button onClick={start} disabled={!!cfg.blocked} className="ds-btn ds-btn-pri"><Icon name="download" size={14} stroke={2} /> {isXlsx ? 'Xuất file Excel' : 'Xuất file CSV'}</button>
                                </div>
                            </>
                        )}

                        {/* ── BƯỚC 2: đang xuất ── */}
                        {step === 'running' && (
                            <>
                                <div className="ds-dlg-body space-y-4">
                                    <div className="flex items-start gap-3">
                                        <div className="flex-1 min-w-0">
                                            <div className="text-[15px] font-semibold text-ink leading-snug">{phaseTitle}</div>
                                            <div className="text-[12px] text-ink-3 mt-0.5 truncate" title={job && job.filename}>{job && job.filename}</div>
                                        </div>
                                        <div className="text-[22px] leading-none font-semibold text-ink tabular-nums">
                                            {writing || phase === 'finalize' ? `${pct}%` : <Icon name="loader" size={20} stroke={2} className="animate-spin text-ink-3" />}
                                        </div>
                                    </div>
                                    <div className={`ds-progress ${writing || phase === 'finalize' ? '' : 'is-busy'}`}>
                                        <i style={writing || phase === 'finalize' ? { width: `${Math.max(pct, 2)}%` } : undefined}></i>
                                    </div>
                                    <div className="ds-steps">
                                        {steps.map((s, i) => {
                                            const done = ORDER[phase] > ORDER[s.k];
                                            const active = ORDER[phase] === ORDER[s.k];
                                            return (
                                                <React.Fragment key={s.k}>
                                                    {i > 0 && <span className={`ds-stepline ${done || active ? 'is-done' : ''}`}></span>}
                                                    <span className={`ds-step ${done ? 'is-done' : active ? 'is-now' : ''}`}><i>{done ? <Icon name="check" size={10} stroke={3} /> : i + 1}</i>{s.label}</span>
                                                </React.Fragment>
                                            );
                                        })}
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div className="ds-stat"><div className="ds-k">{phase === 'fetch' || phase === 'query' ? 'Đã tải' : 'Đã ghi'}</div><div className="ds-v">{fmtCount(current)}<span className="text-ink-3 font-normal"> / {total ? fmtCount(total) : '…'}</span></div></div>
                                        <div className="ds-stat"><div className="ds-k">Tốc độ</div><div className="ds-v">{writing && speed > 0 && !retry ? `${fmtCount(Math.round(speed))} dòng/giây` : '—'}</div></div>
                                        <div className="ds-stat"><div className="ds-k">Thời gian</div><div className="ds-v">{fmtClock(job && job.elapsed)}{eta !== null && eta > 1 && !retry ? <span className="text-ink-3 font-normal"> · còn ~{fmtClock(eta)}</span> : null}</div></div>
                                    </div>
                                    {retry ? (
                                        <div className="ds-note is-warn">
                                            <Icon name="refresh-cw" size={14} stroke={2} />
                                            <span>
                                                {retryLeft > 0 ? `Mạng tới máy chủ bị ngắt — tự kết nối lại sau ${retryLeft} giây` : 'Đang kết nối lại máy chủ…'} (lần {retry.n}/{retry.max}).
                                                {' '}Phần đã tải ({fmtCount(current)} dòng) được giữ nguyên, chỉ tải lại khúc đang dở. Kiểm tra VPN nếu chờ lâu.
                                            </span>
                                        </div>
                                    ) : job && job.retries > 0 ? (
                                        <div className="flex items-center gap-1.5 text-[12px] text-ink-2"><Icon name="refresh-cw" size={13} stroke={2} /> Đã tự kết nối lại {job.retries} lần khi mạng chập chờn — dữ liệu không bị thiếu, không bị trùng.</div>
                                    ) : null}
                                    {phase === 'fetch' && job && job.chunks > 1 && !retry && (
                                        <div className="flex items-center gap-1.5 text-[12px] text-ink-2"><Icon name="layers" size={13} stroke={2} /> Tải theo từng khúc ngày: xong {job.chunk || 0}/{job.chunks} khúc — mạng đứt chỉ phải tải lại khúc đang dở</div>
                                    )}
                                    {phase !== 'fetch' && job && job.sheets > 1 && (
                                        <div className="flex items-center gap-1.5 text-[12px] text-ink-2"><Icon name="layers" size={13} stroke={2} /> Đang ghi sheet {job.sheet}/{job.sheets} — mỗi sheet tối đa 1.000.000 dòng</div>
                                    )}
                                    <div className="text-[12px] text-ink-3">{phase === 'fetch' || phase === 'query'
                                        ? 'Đang tải dữ liệu về máy — tải xong mới ghi file, lúc ghi không cần mạng. Đừng tắt ứng dụng cho tới khi xong.'
                                        : 'Đang ghi file trên máy này, không cần giữ nguyên cửa sổ. Đừng tắt ứng dụng cho tới khi xong.'}</div>
                                </div>
                                <div className="ds-dlg-foot">
                                    <button onClick={cancel} disabled={cancelling || !(jobIdRef.current || (job && job.local))} className="ds-btn ds-btn-danger">
                                        {cancelling ? <><Icon name="loader" size={14} className="animate-spin" /> Đang hủy…</> : <><Icon name="x" size={14} stroke={2} /> Hủy xuất</>}
                                    </button>
                                </div>
                            </>
                        )}

            });

            React.useLayoutEffect(() => {   // layout effect: tính "Vừa khung" trước lượt vẽ đầu, không chớp 100% → 98%
                const desk = deskRef.current;
                if (!desk) return;
                const paperPx = (landscape ? 297 : 210) * 96 / 25.4;
                const calc = () => { const w = desk.clientWidth - 32; setFit(Math.max(0.5, Math.min(1, Math.floor(w / paperPx * 100) / 100))); };
                calc();
                let t = null;
                const ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(calc, 120); });
                ro.observe(desk);
                return () => { clearTimeout(t); ro.disconnect(); };
            }, [landscape]);

                const paper = paperRef.current, sizer = sizerRef.current;
                if (!paper || !sizer) return;
                if (zoom === 1) { sizer.classList.remove('is-zoomed'); sizer.style.width = sizer.style.height = paper.style.transform = ''; return; }
                const fitBox = () => { sizer.style.width = paper.offsetWidth * zoom + 'px'; sizer.style.height = paper.offsetHeight * zoom + 'px'; };
                sizer.classList.add('is-zoomed');
                paper.style.transform = `scale(${zoom})`;
                fitBox();

                ro.observe(paper);

                    indicators.splice(idx020 + 1, 0, { id: '084-VH.PHH', note: 'VH.PHH', type: 'sub', name: '2.2 Phí hoa hồng cho đối tác' });
                    indicators.splice(idx020 + 2, 0, { id: '084-VH.PQC', note: 'VH.PQC', type: 'sub', name: '2.3 Phí quảng cáo' });
                }
                
                const extractPhh = (dataObj, detailsKey) => {
                    let phhVal = 0;
                    if (dataObj[detailsKey]) {
                        const newDetails = [...dataObj[detailsKey]];
                        const pIdx = newDetails.findIndex(e => e.id === '084081' || e.id === 'VH.PHH' || (e.name && e.name.includes('VH.PHH')));
                        if (pIdx !== -1) {
                            phhVal = newDetails[pIdx].val;
                            newDetails.splice(pIdx, 1);
                            dataObj[detailsKey] = newDetails;
                        }
                    }
                    return phhVal;
                };

                const extractPqc = (dataObj, detailsKey) => {
                    let pqcVal = 0;
                    if (dataObj[detailsKey]) {
                        const newDetails = [...dataObj[detailsKey]];
                        const pIdx = newDetails.findIndex(e => e.id === '08407' || e.id === 'VH.PQC' || (e.name && e.name.includes('VH.PQC')));
                        if (pIdx !== -1) {
                            pqcVal = newDetails[pIdx].val;
                            newDetails.splice(pIdx, 1);
                            dataObj[detailsKey] = newDetails;
                        }
                    }
                    return pqcVal;
                };

                const processData = (dataObj) => {
                    const phh = extractPhh(dataObj, '_084_details');
                    const pqc = extractPqc(dataObj, '_084_details');
                    dataObj['084-VH.PHH'] = phh;
                    dataObj['084-VH.PQC'] = pqc;
                    dataObj['02'] = Number(dataObj['020'] || 0) + Number(phh) + Number(pqc);
                    dataObj['03'] = Number(dataObj['01'] || 0) - Number(dataObj['02'] || 0);
                    dataObj['05'] = Number(dataObj['03'] || 0) - Number(dataObj['04'] || 0);
                    dataObj['084'] = Number(dataObj['084'] || 0) - Number(phh) - Number(pqc);
                    dataObj['08'] = Number(dataObj['08'] || 0) - Number(phh) - Number(pqc);
                };

                processData(reportData);
                
                for (let key in monthlyData) {
                    let mData = { ...monthlyData[key] };
                    processData(mData);
                    monthlyData[key] = mData;
                }
                
                for (let key in jobData) {
                    let jData = { ...jobData[key] };
                    processData(jData);
                    jobData[key] = jData;
                }
            }

            const _intlFmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            const formatNum = (n) => {
                if (!n) return '-';
                const num = Number(n);
                if (isNaN(num) || num === 0) return '-';
                if (num < 0) return `(${_intlFmt.format(Math.abs(num))})`;
                return _intlFmt.format(num);
            };
            const calcRate = (val, dataSet) => {
                const revenue = (dataSet || reportData)['01'] || 0;
                if (!revenue || !val) return '-';
                const num = (val / revenue) * 100;
                if (num < 0) return `(${Math.abs(num).toFixed(2)}%)`;
                return num.toFixed(2) + '%';
            };
            const monthNames = ['','Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];

            
            // ===== XUẤT EXCEL / CSV (09/2026) =====
            // Mọi báo cáo đi qua ReportExportDialog → server ghi .xlsx chuẩn form (xlsx_report.py) bằng job nền.
            // Thay cho exportReportXls/exportFullXls/downloadBlobAndSave cũ: .xls HTML dựng từ DOM (báo cáo phân trang
            // phải nạp hết dòng vào DOM), CSV tải về rồi đọc lại toàn bộ thành text POST ngược lên server, tiến trình giả.
            const REPORT_FILE = {
                BC005: 'BC005_Bang_Can_Doi_Ke_Toan', BC006: 'BC006_Bang_Can_Doi_Phat_Sinh', BC007: 'BC007_So_Nhat_Ky_Chung',
                BC008: 'BC008_So_Chi_Tiet_Tai_Khoan', BC014: 'BC014_So_Chi_Tiet_Tai_Khoan_Cong_No', BC009: 'BC009_LCTT_Truc_Tiep', BC010: 'BC010_LCTT_Gian_Tiep',
                BC011: 'BC011_Tong_Hop_Phat_Sinh_Cong_No', BC012: 'BC012_So_Tien_Mat_Va_Tien_Ngan_Hang', BC015: 'BC015_Nhap_Xuat_Ton',
                // BC013: theo loại bán ra / mua vào — VAT_KINDS[…].file
            };
            const isServerExport = ['BC007', 'BC008', 'BC012', 'BC013', 'BC014'].includes(reportType);
            const [showExport, setShowExport] = React.useState(false);

            // Chụp bộ lọc + kỳ ở lần NẠP DỮ LIỆU gần nhất. File phải khớp bảng đang hiển thị kể cả khi người dùng đã đổi
            // bộ lọc mà chưa bấm "Xem" lại — nếu lấy bộ lọc hiện tại thì tiêu đề ghi Tháng 8 mà số là Tháng 7 (sai mà im).
            const viewSnapRef = React.useRef(null);
            React.useEffect(() => {
                viewSnapRef.current = { filters: JSON.parse(JSON.stringify(filters)), period: { ...period } };
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [initialReportData, trialBalanceData, cashBookData]);

            // BC006: TK cha / TK ≤ 3 số in đậm có nền, TK con thụt lề — dùng chung cho bảng và file Excel
            const tbRowFlags = (row) => reportType === 'BC011'
                ? { bold: false, indent: false }
                : { bold: !!(row.is_parent || row.id.length <= 3), indent: row.id.length > 3 };

            const accLabel = (ids) => ids.map(id => { const a = (meta.accounts || []).find(x => x.id === id); return a ? `${id} - ${a.name}` : id; }).join(', ');
            // Bảng kê thuế GTGT: loại của dữ liệu ĐANG HIỆN (server trả kèm dữ liệu) — chưa xem lần nào thì theo nút đang chọn
            const vatShown = reportType === 'BC013' ? ((reportData && reportData.vat_kind) || vatKind || 'BR') : null;
            const vk = vatShown ? VAT_KINDS[vatShown] : null;
            // BC015: nxtMode = cách nhóm (none / wh / cls — NXT_MODES) — state ở App (nút ở dòng tiêu đề), chỉ đổi cách bày, không tải lại
            const nxtData = reportType === 'BC015' && reportData && reportData.rpt === 'BC015' ? reportData : null;
            const nxtRows = React.useMemo(() => nxtViewRows(nxtData, nxtMode), [nxtData, nxtMode]);
            // Khối tiêu đề tờ báo cáo — DÙNG CHUNG cho màn hình và file xuất để hai bên không bao giờ lệch nhau
            const buildReportHeader = (f, p) => {
                const orgs = meta.orgs || [];
                const subLines = [];
                if (['BC008', 'BC011', 'BC012', 'BC013', 'BC014'].includes(reportType)) {
                    const def = reportType === 'BC012' ? '111, 112, 113' : vk ? accLabel([vk.acc]) : '—';
                    subLines.push(`Tài khoản: ${f.acc_ids.length > 0 ? accLabel(f.acc_ids) : def}`);
                }
                if (reportType === 'BC011' || reportType === 'BC014') {
                    subLines.push(`Đối tượng: ${f.pr_detail_ids.length > 0 ? f.pr_detail_ids.map(id => { const x = (meta.pr_details || []).find(z => z.id === id); return x ? `${id} - ${x.name}` : id; }).join(', ') : 'Tất cả'}`);
                }
                if (reportType === 'BC014' && f.contra_acc_ids && f.contra_acc_ids.length > 0) {
                    subLines.push(`TK đối ứng: ${accLabel(f.contra_acc_ids)}`);
                }
                if (reportType === 'BC015') {
                    const named = (ids, list) => ids.map(id => { const x = (list || []).find(z => z.id === id); return x ? `${id} - ${x.name}` : id; }).join(', ');
                    subLines.push(`Kho: ${(f.rpt_wh_ids || []).length > 0 ? named(f.rpt_wh_ids, meta.warehouses) : 'Tất cả'}`);
                    if (f.item_ids.length > 0) subLines.push(`Hàng hóa: ${named(f.item_ids, meta.items)}`);
                    if ((f.rpt_cls_ids || []).length > 0) subLines.push(`Nhóm hàng: ${named(f.rpt_cls_ids, meta.item_classes)}`);
                    if (f.acc_ids.length > 0) subLines.push(`Tài khoản: ${accLabel(f.acc_ids)}`);
                }
                subLines.push(`Đơn vị: ${f.org_ids.length > 0 ? f.org_ids.map(id => { const o = orgs.find(z => z.id === id); return o ? `${id} - ${o.name}` : id; }).join(', ') : 'Tất cả'}`);
                const company = meta.company || {};
                return {
                    company_name: company.name || '',
                    company_line: `${company.address || ''}${company.tax_code ? ` — MST: ${company.tax_code}` : ''}`,
                    unit_line: `Đơn vị: ${f.org_ids.length > 0 ? ((orgs.find(o => o.id === f.org_ids[0]) || {}).name || f.org_ids[0]) : 'Tất cả'}`,
                    form_code: vk ? vk.form : REPORT_FORM_CODE[reportType] !== undefined ? REPORT_FORM_CODE[reportType] : 'Mẫu B02 - DN',
                    title: vk ? vk.title : REPORT_TITLE[reportType] || (['BC002', 'BC004'].includes(reportType) ? 'BÁO CÁO KẾT QUẢ KINH DOANH THEO CÔNG VIỆC' : 'BÁO CÁO KẾT QUẢ KINH DOANH THEO THÁNG'),
                    sub_lines: subLines,
                    period_text: p.type === 'month' ? `Tháng ${p.value} Năm ${p.year}`
                        : p.type === 'quarter' ? `Quý ${p.value} Năm ${p.year}`
                        : p.type === 'year' ? `Năm ${p.year}`
                        : `Từ ngày ${f.from_date} Đến ngày ${f.to_date}`,
                    uom_text: 'Đơn vị tính: VND',
                    sign_place: 'TP. HCM',
                };
            };
            const screenHeader = buildReportHeader(filters, period);

            const exportCfg = (() => {
                const snap = viewSnapRef.current || { filters, period };
                const f = snap.filters, p = snap.period;
                const hdr = buildReportHeader(f, p);
                const pickF = (x) => JSON.stringify([x.from_date, x.to_date, x.org_ids, x.acc_ids, x.contra_acc_ids, x.pr_detail_ids, x.tran_no || '',
                    reportType === 'BC015' ? [x.rpt_wh_ids || [], x.item_ids, x.rpt_cls_ids || []] : 0]);
                const stale = pickF(f) !== pickF(filters) || JSON.stringify(p) !== JSON.stringify(period);
                const pag = (reportData && reportData.pagination) || {};
                const cfIndicators = reportType === 'BC009' ? CF_DIRECT_INDICATORS : CF_INDIRECT_INDICATORS;
                return {
                    code: reportType,
                    title: vk ? vk.title : (REPORT_TYPES.find(r => r.id === reportType) || {}).name || hdr.title,
                    periodText: hdr.period_text,
                    unitText: hdr.sub_lines[hdr.sub_lines.length - 1],
                    serverQuery: isServerExport,
                    staleNote: stale ? `Bộ lọc đã đổi sau lần bấm "Xem" gần nhất. File sẽ xuất đúng dữ liệu đang hiển thị (${hdr.period_text}). Muốn xuất theo bộ lọc mới, hãy bấm "Xem ${reportType}" trước.` : '',
                    variants: reportType === 'BC007' ? [
                        { id: 'detail', label: 'Chi tiết', desc: 'Như bảng đang xem · 11 cột' },
                        { id: 'summary', label: 'Tổng hợp', desc: 'Bỏ cột đơn vị, ngày ghi sổ · 8 cột' },
                        { id: 'full', label: 'Đầy đủ cột', desc: 'Thêm công việc, đối tượng, ghi chú · 15 cột' },
                    ] : reportType === 'BC013' ? [
                        { id: 'detail', label: 'Chi tiết', desc: 'Mỗi mặt hàng một dòng' },
                        { id: 'summary', label: 'Tổng hợp', desc: 'Mỗi số hóa đơn một dòng' },
                    ] : reportType === 'BC015' ? NXT_MODES.map(m => ({ id: m.id, label: m.label, desc: m.desc }))
                    : null,
                    defaultVariant: reportType === 'BC007' ? (journalViewMode || 'detail') : reportType === 'BC013' ? (vatSalesMode || 'detail') : reportType === 'BC015' ? nxtMode : '',
                    // số dòng dự kiến (dòng dữ liệu + dòng số dư/cộng) — để báo trước số sheet và cảnh báo dữ liệu lớn
                    estimate: (v) => {
                        if (reportType === 'BC005') return CDKT_INDICATORS.length;
                        if (reportType === 'BC006' || reportType === 'BC011') return trialBalanceData.length + (trialBalanceTotal ? 1 : 0);
                        if (reportType === 'BC009' || reportType === 'BC010') return cfIndicators.length;
                        if (reportType === 'BC007') return (pag.total_rows || 0) + 1;
                        if (reportType === 'BC008' || reportType === 'BC014') return (pag.total_rows || 0) + 3;
                        if (reportType === 'BC012') return cbPag.total_rows || 0;
                        if (reportType === 'BC013') return v === (vatSalesMode || 'detail') ? (pag.total_rows || 0) + 1 : 0;
                        if (reportType === 'BC015') return nxtViewRows(nxtData, v).length;
                        return 0;
                    },
                    // Tên file: Mã_Tên-báo-cáo[_Mẫu][_TK…][_DV…]_Kỳ — không dấu, không khoảng trắng
                    fileBase: (v) => {
                        const parts = [vk ? vk.file : REPORT_FILE[reportType] || reportType];
                        if (reportType === 'BC007') parts.push({ detail: 'ChiTiet', summary: 'TongHop', full: 'DayDuCot' }[v] || 'ChiTiet');
                        if (reportType === 'BC013') parts.push(v === 'summary' ? 'TongHop' : 'ChiTiet');
                        if (reportType === 'BC015') parts.push((NXT_MODES.find(m => m.id === v) || NXT_MODES[1]).file);
                        if (reportType === 'BC015' && (f.rpt_wh_ids || []).length > 0)
                            parts.push('Kho' + f.rpt_wh_ids.slice(0, 2).join('-') + (f.rpt_wh_ids.length > 2 ? `+${f.rpt_wh_ids.length - 2}` : ''));
                        if (reportType === 'BC015' && (f.rpt_cls_ids || []).length > 0)
                            parts.push('Nhom' + f.rpt_cls_ids.slice(0, 2).join('-') + (f.rpt_cls_ids.length > 2 ? `+${f.rpt_cls_ids.length - 2}` : ''));
                        if (['BC008', 'BC011', 'BC012', 'BC013', 'BC014', 'BC015'].includes(reportType) && f.acc_ids.length > 0)
                            parts.push('TK' + f.acc_ids.slice(0, 3).join('-') + (f.acc_ids.length > 3 ? `+${f.acc_ids.length - 3}` : ''));
                        if (reportType === 'BC014' && f.pr_detail_ids.length > 0)
                            parts.push('DT' + f.pr_detail_ids.slice(0, 2).join('-'));
                        if (f.org_ids.length === 1) parts.push('DV' + f.org_ids[0]);
                        else if (f.org_ids.length > 1) parts.push(`${f.org_ids.length}DonVi`);
                        parts.push(p.type === 'month' ? `Thang${String(p.value).padStart(2, '0')}-${p.year}`
                            : p.type === 'quarter' ? `Quy${p.value}-${p.year}`
                            : p.type === 'year' ? `Nam${p.year}`
                            : `${f.from_date.replace(/\//g, '')}-${f.to_date.replace(/\//g, '')}`);
                        return parts.join('_').replace(/[<>:"/\\|?*\s]+/g, '-');
                    },
                    buildBody: (v, format) => {
                        const body = { report_type: reportType, variant: v, format, header: hdr };
                        if (isServerExport) {
                            // BC007/BC008/BC012/BC013/BC014: server tự truy vấn toàn bộ (không phụ thuộc trang đang xem)
                            body.params = { from_date: f.from_date, to_date: f.to_date, org_ids: f.org_ids, acc_ids: f.acc_ids,
                                contra_acc_ids: f.contra_acc_ids, pr_detail_ids: f.pr_detail_ids, tran_no: f.tran_no || '' };
                            if (vatShown) body.params.vat_kind = vatShown;   // BC013: loại của dữ liệu đang hiện
                        } else if (reportType === 'BC005') {
                            body.payload = { rows: CDKT_INDICATORS.map(row => ({ id: row.id, name: row.name, type: row.type,
                                closing: Number((reportData.closing || {})[row.id] || 0),
                                opening: row.id === '421A' ? null : Number((reportData.opening || {})[row.id] || 0) })) };
                        } else if (reportType === 'BC006' || reportType === 'BC011') {
                            body.payload = { rows: trialBalanceData.map(row => ({ ...row, ...tbRowFlags(row) })), total: trialBalanceTotal };
                        } else if (reportType === 'BC015') {
                            // đúng các dòng của cách nhóm được chọn (Không nhóm / Theo kho / Theo nhóm hàng) dựng từ dữ liệu đang hiện
                            body.payload = { rows: nxtViewRows(nxtData, v) };
                        } else if (reportType === 'BC009' || reportType === 'BC010') {
                            body.payload = { rows: cfIndicators.map(row => ({ id: row.id, name: row.name, type: row.type,
                                value: row.id ? Number(reportData[row.id] || 0) : null })) };
                        }
                        return body;
                    },
                };
            })();

            const exportToPDF = () => { window.print(); };

            const pagedDataRows = reportData.data || (Array.isArray(reportData) ? reportData : []);
            const cbRowsView = cbRows;

            return (
                <div className="flex-1 overflow-hidden flex flex-col">
                    <div className="bg-white border-b border-slate-200 px-6 pt-2 pb-3 shrink-0 z-[900] space-y-2">
                        <div className="flex flex-wrap items-center gap-2">
                            <div className="ds-slot"><TimeRangePicker from={parseDMY(filters.from_date)} to={parseDMY(filters.to_date)} mode={timeMode}
                                onChange={(f, t, md) => { setFilters(p => ({ ...p, from_date: fmtDMY(f), to_date: fmtDMY(t) })); setTimeMode(md); }}
                                isActive={activeDropdown === 'time'} onToggle={setActiveDropdown} /></div>
                            <div className="ds-slot"><PremiumDropdown label="Đơn vị" items={meta.orgs} selectedItems={filters.org_ids} onSelect={id => onToggleFilter('org_ids', id)} isActive={activeDropdown === 'Đơn vị'} onToggle={setActiveDropdown} /></div>
                            {reportType === 'BC015' && (
                                <>
                                <div className="ds-slot"><PremiumDropdown label="Kho" items={meta.warehouses} selectedItems={filters.rpt_wh_ids || []} onSelect={id => onToggleFilter('rpt_wh_ids', id)} isActive={activeDropdown === 'Kho'} onToggle={setActiveDropdown} /></div>
                                <div className="ds-slot"><PremiumDropdown label="Hàng hóa" items={meta.items} selectedItems={filters.item_ids} onSelect={id => onToggleFilter('item_ids', id)} isActive={activeDropdown === 'Hàng hóa'} onToggle={setActiveDropdown} /></div>
                                <div className="ds-slot"><PremiumDropdown label="Nhóm hàng" items={meta.item_classes || []} selectedItems={filters.rpt_cls_ids || []} onSelect={id => onToggleFilter('rpt_cls_ids', id)} isActive={activeDropdown === 'Nhóm hàng'} onToggle={setActiveDropdown} /></div>
                                </>
                            )}
                            {(reportType === 'BC008' || reportType === 'BC011' || reportType === 'BC012' || reportType === 'BC013' || reportType === 'BC014' || reportType === 'BC015') ? (
                                <div className="ds-slot"><PremiumDropdown label="Tài khoản" items={meta.accounts} codePrefix selectedItems={filters.acc_ids} onSelect={id => onToggleFilter('acc_ids', id)} isActive={activeDropdown === 'Tài khoản'} onToggle={setActiveDropdown} /></div>
                            ) : null}
                            {reportType === 'BC007' && (
                                <div className="ds-seg">
                                    <button onClick={() => setJournalViewMode('detail')} className={`${journalViewMode === 'detail' ? 'is-on' : ''}`}>Chi tiết</button>
                                    <button onClick={() => setJournalViewMode('summary')} className={`${journalViewMode === 'summary' ? 'is-on' : ''}`}>Tổng hợp</button>
                                </div>
                            )}
                            {/* Bảng kê thuế GTGT: nút Bán ra | Mua vào nằm ở dòng tiêu đề trang (App → AppPageHeader). Bấm là tải lại
                                (App.onVatView đổi state rồi tải ở lượt vẽ sau — xem changeVatView) */}
                            {reportType === 'BC013' && (
                                <div className="ds-seg">
                                    <button disabled={loading} onClick={() => { if (vatSalesMode === 'detail' || loading) return; onVatView('detail'); }} className={`${vatSalesMode === 'detail' ? 'is-on' : ''}`}>Chi tiết</button>
                                    <button disabled={loading} onClick={() => { if (vatSalesMode === 'summary' || loading) return; onVatView('summary'); }} className={`${vatSalesMode === 'summary' ? 'is-on' : ''}`}>Tổng hợp</button>
                                </div>
                            )}
                            {(reportType === 'BC011' || reportType === 'BC014') ? (
                                <div className="ds-slot"><PremiumDropdown label="Đối tượng" items={meta.pr_details} selectedItems={filters.pr_detail_ids} onSelect={id => onToggleFilter('pr_detail_ids', id)} isActive={activeDropdown === 'Đối tượng'} onToggle={setActiveDropdown} /></div>
                            ) : null}
                            {(reportType === 'BC012' || reportType === 'BC014') ? (
                                <div className="ds-slot"><PremiumDropdown label="TK đối ứng" items={meta.accounts} codePrefix selectedItems={filters.contra_acc_ids} onSelect={id => onToggleFilter('contra_acc_ids', id)} isActive={activeDropdown === 'TK đối ứng'} onToggle={setActiveDropdown} /></div>
                            ) : null}
                            {reportType === 'BC012' ? (
                                <>
                                {/* tran_no là CHUỖI (server lọc TRAN_NO LIKE %...%). Trước 27/09/2026 gọi nhầm onToggleFilter — hàm bật/tắt
                                    phần tử MẢNG — gõ "PC1" thành ['P','PC','P,PC1'] → gửi tran_no=P,PC,P,PC1. */}
                                <input value={filters.tran_no || ''} onChange={e => { const v = e.target.value; setFilters(p => ({ ...p, tran_no: v })); }} placeholder="Số chứng từ" className="ds-input w-36" />
                                </>
                            ) : null}
                            <div className="ml-auto flex items-center gap-2">
                                <button onClick={() => setShowExport(true)} title="Xuất Excel chuẩn form (.xlsx) hoặc CSV" disabled={reportType === 'BC015' ? nxtRows.length === 0 : reportType === 'BC012' ? cbRows.length === 0 : (reportType === 'BC006' || reportType === 'BC011') ? trialBalanceData.length === 0 : Object.keys(reportData).length === 0} className="ds-btn"><Icon name="file-spreadsheet" size={14} stroke={2} className="ds-ic-ok"/> Xuất Excel</button>
                                <button onClick={exportToPDF} disabled={reportType === 'BC015' ? nxtRows.length === 0 : reportType === 'BC012' ? cbRows.length === 0 : (reportType === 'BC006' || reportType === 'BC011') ? trialBalanceData.length === 0 : Object.keys(reportData).length === 0} className="ds-btn"><Icon name="download" size={14} stroke={2}/> PDF</button>
