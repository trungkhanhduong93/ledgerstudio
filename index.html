            { id: '331', name: '1. Phải trả người bán dài hạn', type: 'item' },
            { id: '332', name: '2. Người mua trả tiền trước dài hạn', type: 'item' },
            { id: '333', name: '3. Chi phí phải trả dài hạn', type: 'item' },
            { id: '334', name: '4. Phải trả nội bộ về vốn kinh doanh', type: 'item' },
            { id: '337', name: '7. Phải trả dài hạn khác', type: 'item' },
            { id: '338', name: '8. Vay và nợ thuê tài chính dài hạn', type: 'item' },
            { id: '340', name: '10. Cổ phiếu ưu đãi', type: 'item' },
            { id: '341', name: '11. Thuế thu nhập hoãn lại phải trả', type: 'item' },
            { id: '342', name: '12. Dự phòng phải trả dài hạn', type: 'item' },
            { id: '343', name: '13. Quỹ phát triển khoa học và công nghệ', type: 'item' },
            { id: '400', name: 'D. VỐN CHỦ SỞ HỮU (400 = 410 + 430)', type: 'section' },
            { id: '410', name: 'I. Vốn chủ sở hữu', type: 'group' },
            { id: '411', name: '1. Vốn góp của chủ sở hữu', type: 'item' },
            { id: '411A', name: ' - Cổ phiếu phổ thông có quyền biểu quyết', type: 'sub' },
            { id: '411B', name: ' - Cổ phiếu ưu đãi', type: 'sub' },
            { id: '412', name: '2. Thặng dư vốn cổ phần', type: 'item' },
            { id: '413', name: '3. Quyền chọn chuyển đổi trái phiếu', type: 'item' },
            { id: '414', name: '4. Vốn khác của chủ sở hữu', type: 'item' },
            { id: '415', name: '5. Cổ phiếu quỹ (*)', type: 'item' },
            { id: '416', name: '6. Chênh lệch đánh giá lại tài sản', type: 'item' },
            { id: '417', name: '7. Chênh lệch tỷ giá hối đoái', type: 'item' },
            { id: '418', name: '8. Quỹ đầu tư phát triển', type: 'item' },
            { id: '419', name: '9. Quỹ hỗ trợ sắp xếp doanh nghiệp', type: 'item' },
            { id: '420', name: '10. Quỹ khác thuộc vốn chủ sở hữu', type: 'item' },
            { id: '421', name: '11. Lợi nhuận sau thuế chưa phân phối', type: 'item' },
            { id: '421A', name: ' - Lợi nhuận sau thuế chưa phân phối đến cuối kỳ trước', type: 'sub' },
            { id: '421B', name: ' - Lợi nhuận chưa phân phối kỳ này', type: 'sub' },
            { id: '422', name: '12. Nguồn vốn đầu tư xây dựng cơ bản', type: 'item' },
            { id: '430', name: 'II. Nguồn kinh phí và quỹ khác', type: 'group' },
            { id: '431', name: '1. Nguồn kinh phí', type: 'item' },
            { id: '432', name: '2. Nguồn kinh phí đã hình thành tài sản cố định', type: 'item' },
            { id: '440', name: 'TỔNG CỘNG NGUỒN VỐN  (440 = 300 + 400)', type: 'total' },
        ];

        // Thanh chuyển trang NGANG: nút ‹ ›, ô số trang gõ được — gõ số rồi Enter (hoặc rời ô) để nhảy thẳng tới trang.
        const PageJumper = ({ page, totalPages, onGoto, compact = false }) => {
            const [txt, setTxt] = React.useState(String(page));
            React.useEffect(() => { setTxt(String(page)); }, [page]);
            const go = () => {
                let v = parseInt(txt, 10);
                if (isNaN(v)) { setTxt(String(page)); return; }
                v = Math.max(1, Math.min(totalPages, v));
                setTxt(String(v));
                if (v !== page) onGoto(v);
            };
            const btn = compact ? "w-9 h-9" : "w-10 h-10";
            return (
                <div className="flex items-center gap-1">
                    <button disabled={page <= 1} onClick={() => onGoto(page - 1)} className="ds-pgbtn" title="Trang trước"><Icon name="chevron-left" size={16} stroke={2}/></button>
                    <div className="flex items-center gap-1.5 px-1 text-[12.5px] text-ink-3">
                        <span>Trang</span>
                        <input type="number" min="1" max={totalPages} value={txt}
                            onChange={e => setTxt(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); go(); e.target.blur(); } }}
                            onBlur={go}
                            onFocus={e => e.target.select()}
                            className="ds-input ds-pgnum w-14 h-7 text-center tabular-nums" />
                        <span className="tabular-nums">/ {totalPages}</span>
                    </div>
                    <button disabled={page >= totalPages} onClick={() => onGoto(page + 1)} className="ds-pgbtn" title="Trang sau"><Icon name="chevron-right" size={16} stroke={2}/></button>
                </div>
            );
        };

        // ===== DIALOG XUẤT BÁO CÁO — Excel chuẩn form (.xlsx) hoặc CSV thô, dùng chung cho BC005–BC013 =====
        // Luồng: chọn định dạng / mẫu / tên file → POST /api/report_export/start → poll /api/export/status mỗi 0,4s
        // (tiến trình THẬT: server ghi tới dòng nào báo tới dòng đó) → xong hiện Mở file / Mở thư mục ngay tại chỗ.
        // Thay 4 modal cũ + thanh tiến trình giả chạy bằng setTimeout. cfg do ReportTab dựng (xem exportCfg).
        const fmtCount = (n) => (Number(n) || 0).toLocaleString('vi-VN');
        const fmtBytes = (b) => {
            b = Number(b) || 0;
            if (b < 1024) return `${b} B`;
            if (b < 1048576) return `${Math.round(b / 1024).toLocaleString('vi-VN')} KB`;
            if (b < 1073741824) return `${(b / 1048576).toLocaleString('vi-VN', { maximumFractionDigits: 1 })} MB`;
            return `${(b / 1073741824).toLocaleString('vi-VN', { maximumFractionDigits: 2 })} GB`;
        };
        const fmtClock = (sec) => {
            sec = Math.max(0, Math.round(Number(sec) || 0));
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        const ReportExportDialog = ({ open, onClose, cfg }) => {
            const [step, setStep] = React.useState('options');   // options | running | done | error | cancelled
            const [format, setFormat] = React.useState('xlsx');
            const [variant, setVariant] = React.useState('');
            const [fileBase, setFileBase] = React.useState('');
            const [nameEdited, setNameEdited] = React.useState(false);
            const [exportDir, setExportDir] = React.useState('');
            const [job, setJob] = React.useState(null);
            const [speed, setSpeed] = React.useState(0);
            const [errorMsg, setErrorMsg] = React.useState('');
            const [cancelling, setCancelling] = React.useState(false);
            const [actionMsg, setActionMsg] = React.useState('');
            const jobIdRef = React.useRef(null);
            const timerRef = React.useRef(null);
            const samplesRef = React.useRef([]);
            const aliveRef = React.useRef(true);

            React.useEffect(() => {
                aliveRef.current = true;
                return () => { aliveRef.current = false; clearTimeout(timerRef.current); };
            }, []);

            React.useEffect(() => {
                if (!open) return;
                clearTimeout(timerRef.current);
                jobIdRef.current = null;
                const v = cfg.defaultVariant || '';
                setStep('options'); setFormat('xlsx'); setVariant(v);
                setFileBase(cfg.fileBase(v)); setNameEdited(false);
                setJob(null); setSpeed(0); setErrorMsg(''); setCancelling(false); setActionMsg('');
                fetch('/api/export/dir').then(r => r.json()).then(j => { if (aliveRef.current && j.status === 'ok') setExportDir(j.dir); }).catch(() => {});
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [open]);

            const poll = React.useCallback(async () => {
                const id = jobIdRef.current;
                if (!id || !aliveRef.current) return;
                let s = null;
                try {
                    const r = await fetch(`/api/export/status?job_id=${id}`);
                    if (r.status === 404) {
                        if (id === jobIdRef.current) { setErrorMsg('Máy chủ không còn giữ tiến trình xuất này (ứng dụng vừa khởi động lại?). Hãy xuất lại.'); setStep('error'); }
                        return;
                    }
                    s = await r.json();
                } catch (e) {
                    if (window.isNetworkError && window.isNetworkError(e)) { window.showConnectionLost(); return; }
                }
                if (id !== jobIdRef.current || !aliveRef.current) return;   // dialog đã đóng hoặc đã xuất lượt khác
                if (s) {
                    const now = Date.now(), arr = samplesRef.current;
                    arr.push({ t: now, n: s.current || 0 });
                    while (arr.length > 2 && now - arr[0].t > 5000) arr.shift();
                    const dt = (arr[arr.length - 1].t - arr[0].t) / 1000;
                    if (dt >= 0.8) setSpeed(Math.max(0, (arr[arr.length - 1].n - arr[0].n) / dt));
                    setJob(s);
                    if (s.status === 'done') { setStep('done'); return; }
                    if (s.status === 'error') { setErrorMsg(s.error || 'Lỗi không xác định khi ghi file.'); setStep('error'); return; }
                    if (s.status === 'cancelled') { setStep('cancelled'); return; }
                }
                timerRef.current = setTimeout(poll, 400);
            }, []);

            const start = async () => {
                if (step === 'running') return;
                const name = fileBase.trim();
                if (!name) { setActionMsg('Hãy nhập tên file trước khi xuất.'); return; }
                setActionMsg(''); setErrorMsg(''); setCancelling(false); setSpeed(0); samplesRef.current = [];
                setJob({ status: 'running', phase: 'prepare', current: 0, total: cfg.estimate(variant) || 0, filename: `${name}.${format}` });
                setStep('running');
                try {
                    const body = { ...cfg.buildBody(variant, format), filename: name };
                    const r = await fetch('/api/report_export/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    const j = await r.json().catch(() => ({}));
                    if (!aliveRef.current) return;
                    if (!r.ok || j.status !== 'ok') { setErrorMsg(j.message || `Máy chủ báo lỗi (HTTP ${r.status}).`); setStep('error'); return; }
                    jobIdRef.current = j.job_id;
                    setJob(prev => ({ ...prev, filename: j.filename }));
                    if (j.dir) setExportDir(j.dir);
                    poll();
                } catch (e) {
                    if (window.isNetworkError && window.isNetworkError(e)) { window.showConnectionLost(); return; }
                    setErrorMsg('Lỗi: ' + e.message); setStep('error');
                }
            };

            const cancel = async () => {
                const id = jobIdRef.current;
                if (!id || cancelling) return;
                setCancelling(true);
                try { await fetch('/api/export/cancel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ job_id: id }) }); } catch (e) { /* poll sẽ báo lỗi mạng */ }
            };

            const close = () => {
                if (step === 'running') return;
                clearTimeout(timerRef.current);
                jobIdRef.current = null;
                onClose();
            };

            const openTarget = async (kind) => {
                if (!job || !job.file_path) return;
                try {
                    const r = await fetch(`/api/open_${kind}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: job.file_path }) });
                    const j = await r.json();
                    if (j.status !== 'ok') { setActionMsg(j.message || 'Không mở được.'); return; }
                    close();
                } catch (e) { setActionMsg('Không mở được: ' + e.message); }
            };

            React.useEffect(() => {
                if (!open) return;
                const onKey = (e) => {
                    if (e.key === 'Escape' && step !== 'running') { e.preventDefault(); close(); }
                    else if (e.key === 'Enter' && step === 'options' && !e.isComposing) { e.preventDefault(); start(); }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            });

            if (!open) return null;

            const isXlsx = format === 'xlsx';
            const est = cfg.estimate(variant);
            const sheetsEst = est ? Math.max(1, Math.ceil(est / 1000000)) : 1;
            const heavy = isXlsx && est > 200000;
            const phase = job ? job.phase : 'prepare';
            const current = job ? (job.current || 0) : 0;
            const total = job ? (job.total || 0) : 0;
            const writing = phase === 'write' && total > 0;
            const pct = step === 'done' || phase === 'finalize' ? 100 : (writing ? Math.min(99, Math.floor(current * 100 / total)) : 0);
            const eta = writing && speed > 0 ? (total - current) / speed : null;
            const steps = [
                { k: 'prepare', label: 'Chuẩn bị' },
                ...(cfg.serverQuery ? [{ k: 'query', label: 'Truy vấn dữ liệu' }] : []),
                { k: 'write', label: isXlsx ? 'Ghi Excel' : 'Ghi CSV' },
                { k: 'finalize', label: 'Hoàn tất' },
            ];
            const ORDER = { prepare: 0, query: 1, write: 2, finalize: 3, done: 4 };
            const phaseTitle = phase === 'query' ? 'Đang truy vấn dữ liệu từ máy chủ…'
                : phase === 'write' ? (isXlsx ? 'Đang ghi file Excel…' : 'Đang ghi file CSV…')
                : phase === 'finalize' ? (isXlsx ? 'Đang đóng gói file .xlsx…' : 'Đang hoàn tất file…')
                : 'Đang chuẩn bị…';
            const variantInfo = (cfg.variants || []).find(v => v.id === variant);

            return (
                <div className="ds-scrim z-[99999]" onMouseDown={e => { if (e.target === e.currentTarget) close(); }}>
                    <div className="ds-dialog is-wide" role="dialog" aria-modal="true">
                        {/* ── Đầu hộp thoại ── */}
                        <div className="ds-dlg-head pb-4 border-b border-line-soft">
                            <div className="ds-dlg-ic is-ok"><Icon name="file-spreadsheet" size={18} stroke={2} /></div>
                            <div className="flex-1 min-w-0">
                                <div className="text-[12px] text-ink-3">Xuất báo cáo</div>
                                <h3>{cfg.title}</h3>
                                <div className="flex flex-wrap gap-1.5 mt-2">
                                    <span className="ds-tag is-brand">{cfg.code}</span>
                                    <span className="ds-tag"><Icon name="calendar" size={12} stroke={2} /> {cfg.periodText}</span>
                                    <span className="ds-tag">{cfg.unitText}</span>
                                    {est ? <span className="ds-tag"><Icon name="rows" size={12} stroke={2} /> {est >= 1000 ? '≈ ' : ''}{fmtCount(est)} dòng</span> : null}
                                </div>
                            </div>
                            {step !== 'running' && (
                                <button onClick={close} className="ds-iconbtn ds-dlg-x" title="Đóng (Esc)"><Icon name="x" size={16} stroke={2} /></button>
                            )}
                        </div>

                        {/* ── BƯỚC 1: tuỳ chọn ── */}
                        {step === 'options' && (
                            <>
                                <div className="ds-dlg-body space-y-4 max-h-[64vh] custom-scrollbar">
                                    <div>
                                        <div className="ds-field-label">Định dạng file</div>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[
                                                { id: 'xlsx', icon: 'file-spreadsheet', title: 'Excel chuẩn form', ext: '.xlsx', desc: 'Y như trên app: tiêu đề, in đậm, màu nền, chữ ký. Số vẫn cộng trừ được.', badge: 'Khuyên dùng' },
                                                { id: 'csv', icon: 'zap', title: 'CSV dữ liệu thô', ext: '.csv', desc: 'Chỉ bảng dữ liệu, không định dạng. Nhẹ và ghi nhanh nhất.' },
                                            ].map(o => (
                                                <button key={o.id} type="button" onClick={() => setFormat(o.id)} className={`ds-choice ${format === o.id ? 'is-on' : ''}`}>
                                                    <div className="flex items-center gap-2">
                                                        <Icon name={o.icon} size={15} stroke={2} className={o.id === 'xlsx' ? 'text-ok-ink' : 'text-ink-3'} />
                                                        <span className="ds-ct">{o.title}</span>
                                                        <span className="text-[12px] text-ink-3">{o.ext}</span>
                                                        <span className="ds-radio ml-auto"></span>
                                                    </div>
                                                    <div className="ds-cd">{o.desc}</div>
                                                    {o.badge && <span className="ds-tag is-brand mt-2">{o.badge}</span>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {cfg.variants && (
                                        <div>
                                            <div className="ds-field-label">Mẫu dữ liệu</div>
                                            <div className={`grid gap-2 ${cfg.variants.length === 3 ? 'grid-cols-3' : 'grid-cols-2'}`}>
                                                {cfg.variants.map(v => (
                                                    <button key={v.id} type="button"
                                                        onClick={() => { setVariant(v.id); if (!nameEdited) setFileBase(cfg.fileBase(v.id)); }}
                                                        className={`ds-choice ${variant === v.id ? 'is-on' : ''}`}>
                                                        <div className="flex items-center gap-2"><span className="ds-radio"></span><span className="ds-ct">{v.label}</span></div>
                                                        <div className="ds-cd">{v.desc}</div>
                                                    </button>
                                                ))}
                                            </div>
                                            {variantInfo && variantInfo.note && <div className="text-[12px] text-ink-3 mt-1.5">{variantInfo.note}</div>}
                                        </div>
                                    )}

                                    <div>
                                        <div className="ds-field-label">Tên file</div>
                                        <div className="ds-filename">
                                            <input value={fileBase} onChange={e => { setFileBase(e.target.value); setNameEdited(true); setActionMsg(''); }} spellCheck={false} />
                                            <span>.{format}</span>
                                        </div>
                                        <div className="flex items-center gap-1.5 mt-1.5 text-[12px] text-ink-3 min-w-0">
                                            <Icon name="folder-open" size={13} stroke={2} className="shrink-0" />
                                            <span className="shrink-0">Lưu vào</span>
                                            <span className="text-ink-2 truncate" title={exportDir}>{exportDir || 'Downloads\\iPOS_Ledger_Studio'}</span>
                                        </div>
                                        <div className="text-[12px] text-ink-4 mt-0.5">Trùng tên file cũ sẽ tự thêm (2), (3)… — không ghi đè file đang mở.</div>
                                    </div>

                                    <div className="ds-checks">
                                        {(isXlsx ? [
                                            'Giữ nguyên form như trên app: khối tiêu đề, in đậm/nghiêng, màu nền, viền, chữ ký',
                                            'Số lưu giá trị thật 1000000, hiển thị 1,000,000 · tỷ lệ 15.52% lưu 0.1552',
                                            sheetsEst > 1
                                                ? `≈ ${fmtCount(est)} dòng → tự tách ${sheetsEst} sheet (tối đa 1.000.000 dòng/sheet), có dòng cộng chuyển sang`
                                                : 'Tự tách sheet khi vượt 1.000.000 dòng, mỗi sheet đủ tiêu đề và dòng cộng chuyển sang',
                                        ] : [
                                            'Không giới hạn số dòng, ghi nhanh nhất',
                                            'Mở bằng Excel vẫn đúng tiếng Việt; mã TK, số hóa đơn giữ nguyên số 0 đầu',
                                            'Không kèm tiêu đề, màu sắc, chữ ký — chỉ bảng dữ liệu',
                                        ]).map((t, i) => (
                                            <div key={i}><Icon name="check" size={12} stroke={2.5} /><span>{t}</span></div>
                                        ))}
                                    </div>

                                    {heavy && (
                                        <div className="ds-note is-warn">
                                            <Icon name="clock" size={14} stroke={2} />
                                            <span>Dữ liệu lớn (≈ {fmtCount(est)} dòng): file Excel cần khoảng {Math.max(1, Math.round(est / 12000 / 60))} phút để ghi. Cần nhanh thì chọn <b>CSV</b>.</span>
                                        </div>
                                    )}
                                    {cfg.staleNote && (
                                        <div className="ds-note is-info">
                                            <Icon name="alert-circle" size={14} stroke={2} />
                                            <span>{cfg.staleNote}</span>
                                        </div>
                                    )}
                                    {actionMsg && <div className="ds-err">{actionMsg}</div>}
                                </div>
                                <div className="ds-dlg-foot">
                                    <div className="hidden sm:flex items-center gap-1.5 text-[12px] text-ink-3 mr-auto">
                                        <span className="ds-kbd">Enter</span> xuất <span className="ds-kbd ml-2">Esc</span> đóng
                                    </div>
                                    <button onClick={close} className="ds-btn">Hủy</button>
                                    <button onClick={start} className="ds-btn ds-btn-pri"><Icon name="download" size={14} stroke={2} /> {isXlsx ? 'Xuất file Excel' : 'Xuất file CSV'}</button>
                                </div>
                            </>
                        )}

                        {/* ── BƯỚC 2: đang xuất ── */}
                        {step === 'running' && (
                            <>
                                <div className="ds-dlg-body space-y-4">
                                    <div className="flex items-start gap-3">
                                        <div className="flex-1 min-w-0">
                                            <div className="text-[15px] font-semibold text-ink leading-snug">{phaseTitle}</div>
                                            <div className="text-[12px] text-ink-3 mt-0.5 truncate" title={job && job.filename}>{job && job.filename}</div>
                                        </div>
                                        <div className="text-[22px] leading-none font-semibold text-ink tabular-nums">
                                            {writing || phase === 'finalize' ? `${pct}%` : <Icon name="loader" size={20} stroke={2} className="animate-spin text-ink-3" />}
                                        </div>
                                    </div>
                                    <div className={`ds-progress ${writing || phase === 'finalize' ? '' : 'is-busy'}`}>
                                        <i style={writing || phase === 'finalize' ? { width: `${Math.max(pct, 2)}%` } : undefined}></i>
                                    </div>
                                    <div className="ds-steps">
                                        {steps.map((s, i) => {
                                            const done = ORDER[phase] > ORDER[s.k];
                                            const active = ORDER[phase] === ORDER[s.k];
                                            return (
                                                <React.Fragment key={s.k}>
                                                    {i > 0 && <span className={`ds-stepline ${done || active ? 'is-done' : ''}`}></span>}

        const ReportBar = ({ deskRef, sizerRef, paperRef, landscape, children }) => {
            const [pref, setPref] = React.useState(() => {
                try { const n = Number(localStorage.getItem('ds_report_zoom')); return REPORT_ZOOMS.includes(n) ? n : 'fit'; } catch (e) { return 'fit'; }
            });
            const [fit, setFit] = React.useState(1);
            React.useLayoutEffect(() => {   // layout effect: tính "Vừa khung" trước lượt vẽ đầu, không chớp 100% → 98%
                const desk = deskRef.current;
                if (!desk) return;
                const paperPx = (landscape ? 297 : 210) * 96 / 25.4;
                const calc = () => { const w = desk.clientWidth - 32; setFit(Math.max(0.5, Math.min(1, Math.floor(w / paperPx * 100) / 100))); };
                calc();
                let t = null;
                const ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(calc, 120); });
                ro.observe(desk);
                return () => { clearTimeout(t); ro.disconnect(); };
            }, [landscape]);
            const zoom = pref === 'fit' ? fit : pref;
            React.useLayoutEffect(() => {
                const paper = paperRef.current, sizer = sizerRef.current;
                if (!paper || !sizer) return;
                if (zoom === 1) { sizer.classList.remove('is-zoomed'); sizer.style.width = sizer.style.height = paper.style.transform = ''; return; }
                const fitBox = () => { sizer.style.width = paper.offsetWidth * zoom + 'px'; sizer.style.height = paper.offsetHeight * zoom + 'px'; };
                sizer.classList.add('is-zoomed');
                paper.style.transform = `scale(${zoom})`;
                fitBox();
                const ro = new ResizeObserver(fitBox);   // offsetWidth/Height = cỡ layout, không tính scale
                ro.observe(paper);
                return () => ro.disconnect();

                { id: '11', note: '', type: 'group', name: '11. Chi phí khác' },
                { id: '12', note: '', type: 'group', name: '12. Lợi nhuận khác' },
                { id: '13', note: '', type: 'group', name: '13. Tổng lợi nhuận kế toán trước thuế' },
                { id: '14', note: '', type: 'group', name: '14. Chi phí thuế TNDN hiện hành' },
                { id: '15', note: '', type: 'group', name: '15. Chi phí thuế TNDN hoãn lại' },
                { id: '16', note: '', type: 'group', name: '16. Lợi nhuận sau thuế TNDN' },
                { id: '17', note: '', type: 'group', name: '17. Lãi cơ bản trên cổ phiếu (*)' },
                { id: '18', note: '', type: 'group', name: '18. Lãi suy giảm trên cổ phiếu (*)' }
            ];

            let reportData = Array.isArray(initialReportData) ? [...initialReportData] : (initialReportData ? { ...initialReportData } : {});
            let monthlyData = { ...initialMonthlyData };
            let jobData = { ...initialJobData };

            if (reportType === 'BC003' || reportType === 'BC004') {
                const idx020 = indicators.findIndex(r => r.id === '020');
                if (idx020 !== -1) {
                    indicators.splice(idx020 + 1, 0, { id: '084-VH.PHH', note: 'VH.PHH', type: 'sub', name: '2.2 Phí hoa hồng cho đối tác' });
                    indicators.splice(idx020 + 2, 0, { id: '084-VH.PQC', note: 'VH.PQC', type: 'sub', name: '2.3 Phí quảng cáo' });
                }
                
                const extractPhh = (dataObj, detailsKey) => {
                    let phhVal = 0;
                    if (dataObj[detailsKey]) {
                        const newDetails = [...dataObj[detailsKey]];
                        const pIdx = newDetails.findIndex(e => e.id === '084081' || e.id === 'VH.PHH' || (e.name && e.name.includes('VH.PHH')));
                        if (pIdx !== -1) {
                            phhVal = newDetails[pIdx].val;
                            newDetails.splice(pIdx, 1);
                            dataObj[detailsKey] = newDetails;
                        }
                    }
                    return phhVal;
                };

                const extractPqc = (dataObj, detailsKey) => {
                    let pqcVal = 0;
                    if (dataObj[detailsKey]) {
                        const newDetails = [...dataObj[detailsKey]];
                        const pIdx = newDetails.findIndex(e => e.id === '08407' || e.id === 'VH.PQC' || (e.name && e.name.includes('VH.PQC')));
                        if (pIdx !== -1) {
                            pqcVal = newDetails[pIdx].val;
                            newDetails.splice(pIdx, 1);
                            dataObj[detailsKey] = newDetails;
                        }
                    }
                    return pqcVal;
                };

                const processData = (dataObj) => {
                    const phh = extractPhh(dataObj, '_084_details');
                    const pqc = extractPqc(dataObj, '_084_details');
                    dataObj['084-VH.PHH'] = phh;
                    dataObj['084-VH.PQC'] = pqc;
                    dataObj['02'] = Number(dataObj['020'] || 0) + Number(phh) + Number(pqc);
                    dataObj['03'] = Number(dataObj['01'] || 0) - Number(dataObj['02'] || 0);
                    dataObj['05'] = Number(dataObj['03'] || 0) - Number(dataObj['04'] || 0);
                    dataObj['084'] = Number(dataObj['084'] || 0) - Number(phh) - Number(pqc);
                    dataObj['08'] = Number(dataObj['08'] || 0) - Number(phh) - Number(pqc);
                };

                processData(reportData);
                
                for (let key in monthlyData) {
                    let mData = { ...monthlyData[key] };
                    processData(mData);
                    monthlyData[key] = mData;
                }
                
                for (let key in jobData) {
                    let jData = { ...jobData[key] };
                    processData(jData);
                    jobData[key] = jData;
                }
            }

            const _intlFmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            const formatNum = (n) => {
                if (!n) return '-';
                const num = Number(n);
                if (isNaN(num) || num === 0) return '-';
                if (num < 0) return `(${_intlFmt.format(Math.abs(num))})`;
                return _intlFmt.format(num);
            };
            const calcRate = (val, dataSet) => {
                const revenue = (dataSet || reportData)['01'] || 0;
                if (!revenue || !val) return '-';
                const num = (val / revenue) * 100;
                if (num < 0) return `(${Math.abs(num).toFixed(2)}%)`;
                return num.toFixed(2) + '%';
            };
            const monthNames = ['','Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];

            
            // ===== XUẤT EXCEL / CSV (09/2026) =====
            // Mọi báo cáo đi qua ReportExportDialog → server ghi .xlsx chuẩn form (xlsx_report.py) bằng job nền.
            // Thay cho exportReportXls/exportFullXls/downloadBlobAndSave cũ: .xls HTML dựng từ DOM (báo cáo phân trang
            // phải nạp hết dòng vào DOM), CSV tải về rồi đọc lại toàn bộ thành text POST ngược lên server, tiến trình giả.
            const REPORT_FILE = {
                BC005: 'BC005_Bang_Can_Doi_Ke_Toan', BC006: 'BC006_Bang_Can_Doi_Phat_Sinh', BC007: 'BC007_So_Nhat_Ky_Chung',
                BC008: 'BC008_So_Chi_Tiet_Tai_Khoan', BC009: 'BC009_LCTT_Truc_Tiep', BC010: 'BC010_LCTT_Gian_Tiep',
                BC011: 'BC011_Tong_Hop_Phat_Sinh_Cong_No', BC012: 'BC012_So_Tien_Mat_Va_Tien_Ngan_Hang',
                BC013: 'BC013_Bang_Ke_Hoa_Don_Ban_Ra'
            };
            const isServerExport = ['BC007', 'BC008', 'BC012', 'BC013'].includes(reportType);
            const [showExport, setShowExport] = React.useState(false);

            // Chụp bộ lọc + kỳ ở lần NẠP DỮ LIỆU gần nhất. File phải khớp bảng đang hiển thị kể cả khi người dùng đã đổi
            // bộ lọc mà chưa bấm "Xem" lại — nếu lấy bộ lọc hiện tại thì tiêu đề ghi Tháng 8 mà số là Tháng 7 (sai mà im).
            const viewSnapRef = React.useRef(null);
            React.useEffect(() => {
                viewSnapRef.current = { filters: JSON.parse(JSON.stringify(filters)), period: { ...period } };
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [initialReportData, trialBalanceData, cashBookData]);

            // BC006: TK cha / TK ≤ 3 số in đậm có nền, TK con thụt lề — dùng chung cho bảng và file Excel
            const tbRowFlags = (row) => reportType === 'BC011'
                ? { bold: false, indent: false }
                : { bold: !!(row.is_parent || row.id.length <= 3), indent: row.id.length > 3 };

            const accLabel = (ids) => ids.map(id => { const a = (meta.accounts || []).find(x => x.id === id); return a ? `${id} - ${a.name}` : id; }).join(', ');
            // Khối tiêu đề tờ báo cáo — DÙNG CHUNG cho màn hình và file xuất để hai bên không bao giờ lệch nhau
            const buildReportHeader = (f, p) => {
                const orgs = meta.orgs || [];
                const subLines = [];

                    subLines.push(`Tài khoản: ${f.acc_ids.length > 0 ? accLabel(f.acc_ids) : def}`);
                }
                if (reportType === 'BC011') {
                    subLines.push(`Đối tượng: ${f.pr_detail_ids.length > 0 ? f.pr_detail_ids.map(id => { const x = (meta.pr_details || []).find(z => z.id === id); return x ? `${id} - ${x.name}` : id; }).join(', ') : 'Tất cả'}`);
                }
                subLines.push(`Đơn vị: ${f.org_ids.length > 0 ? f.org_ids.map(id => { const o = orgs.find(z => z.id === id); return o ? `${id} - ${o.name}` : id; }).join(', ') : 'Tất cả'}`);

                return {
                    company_name: company.name || '',

                    title: REPORT_TITLE[reportType] || (['BC002', 'BC004'].includes(reportType) ? 'BÁO CÁO KẾT QUẢ KINH DOANH THEO CÔNG VIỆC' : 'BÁO CÁO KẾT QUẢ KINH DOANH THEO THÁNG'),

                        : `Từ ngày ${f.from_date} Đến ngày ${f.to_date}`,

                    variants: reportType === 'BC007' ? [
                        { id: 'detail', label: 'Chi tiết', desc: 'Như bảng đang xem · 11 cột' },
                        { id: 'summary', label: 'Tổng hợp', desc: 'Bỏ cột đơn vị, ngày ghi sổ · 8 cột' },
                        { id: 'full', label: 'Đầy đủ cột', desc: 'Thêm công việc, đối tượng, ghi chú · 15 cột' },
                    ] : reportType === 'BC013' ? [
                        { id: 'detail', label: 'Chi tiết', desc: 'Mỗi mặt hàng một dòng' },
                        { id: 'summary', label: 'Tổng hợp', desc: 'Mỗi số hóa đơn một dòng' },
                    ] : null,
                    defaultVariant: reportType === 'BC007' ? (journalViewMode || 'detail') : reportType === 'BC013' ? (vatSalesMode || 'detail') : '',
                    // số dòng dự kiến (dòng dữ liệu + dòng số dư/cộng) — để báo trước số sheet và cảnh báo dữ liệu lớn
                    estimate: (v) => {
                        if (reportType === 'BC005') return CDKT_INDICATORS.length;
                        if (reportType === 'BC006' || reportType === 'BC011') return trialBalanceData.length + (trialBalanceTotal ? 1 : 0);
                        if (reportType === 'BC009' || reportType === 'BC010') return cfIndicators.length;
                        if (reportType === 'BC007') return (pag.total_rows || 0) + 1;
                        if (reportType === 'BC008') return (pag.total_rows || 0) + 3;
                        if (reportType === 'BC012') return cbPag.total_rows || 0;
                        if (reportType === 'BC013') return v === (vatSalesMode || 'detail') ? (pag.total_rows || 0) + 1 : 0;
                        return 0;
                    },
                    // Tên file: Mã_Tên-báo-cáo[_Mẫu][_TK…][_DV…]_Kỳ — không dấu, không khoảng trắng
                    fileBase: (v) => {
                        const parts = [REPORT_FILE[reportType] || reportType];
                        if (reportType === 'BC007') parts.push({ detail: 'ChiTiet', summary: 'TongHop', full: 'DayDuCot' }[v] || 'ChiTiet');
                        if (reportType === 'BC013') parts.push(v === 'summary' ? 'TongHop' : 'ChiTiet');
                        if (['BC008', 'BC011', 'BC012', 'BC013'].includes(reportType) && f.acc_ids.length > 0)
                            parts.push('TK' + f.acc_ids.slice(0, 3).join('-') + (f.acc_ids.length > 3 ? `+${f.acc_ids.length - 3}` : ''));
                        if (f.org_ids.length === 1) parts.push('DV' + f.org_ids[0]);
                        else if (f.org_ids.length > 1) parts.push(`${f.org_ids.length}DonVi`);
                        parts.push(p.type === 'month' ? `Thang${String(p.value).padStart(2, '0')}-${p.year}`
                            : p.type === 'quarter' ? `Quy${p.value}-${p.year}`
                            : p.type === 'year' ? `Nam${p.year}`
                            : `${f.from_date.replace(/\//g, '')}-${f.to_date.replace(/\//g, '')}`);
                        return parts.join('_').replace(/[<>:"/\\|?*\s]+/g, '-');
                    },
                    buildBody: (v, format) => {
                        const body = { report_type: reportType, variant: v, format, header: hdr };
                        if (isServerExport) {
                            // BC007/BC008/BC012/BC013: server tự truy vấn toàn bộ (không phụ thuộc trang đang xem)
                            body.params = { from_date: f.from_date, to_date: f.to_date, org_ids: f.org_ids, acc_ids: f.acc_ids,
                                contra_acc_ids: f.contra_acc_ids, tran_no: f.tran_no || '' };
                        } else if (reportType === 'BC005') {
                            body.payload = { rows: CDKT_INDICATORS.map(row => ({ id: row.id, name: row.name, type: row.type,
                                closing: Number((reportData.closing || {})[row.id] || 0),
                                opening: row.id === '421A' ? null : Number((reportData.opening || {})[row.id] || 0) })) };
                        } else if (reportType === 'BC006' || reportType === 'BC011') {
                            body.payload = { rows: trialBalanceData.map(row => ({ ...row, ...tbRowFlags(row) })), total: trialBalanceTotal };
                        } else if (reportType === 'BC009' || reportType === 'BC010') {
                            body.payload = { rows: cfIndicators.map(row => ({ id: row.id, name: row.name, type: row.type,
                                value: row.id ? Number(reportData[row.id] || 0) : null })) };
                        }
                        return body;
                    },
                };
            })();

            const exportToPDF = () => { window.print(); };

            const pagedDataRows = reportData.data || (Array.isArray(reportData) ? reportData : []);
            const cbRowsView = cbRows;

            return (
                <div className="flex-1 overflow-hidden flex flex-col">
                    <div className="bg-white border-b border-slate-200 px-6 pt-2 pb-3 shrink-0 z-[900] space-y-2">
                        <div className="flex flex-wrap items-center gap-2">
                            <div className="ds-slot"><PeriodDropdown period={period} setPeriod={setPeriod} from={filters.from_date} to={filters.to_date} isActive={activeDropdown === 'period'} onToggle={setActiveDropdown} /></div>
                            <div className="ds-slot">
                                <IOSDatePicker label="Từ ngày" value={filters.from_date} onChange={val => onToggleFilter('from_date', val)} disabled={period.type !== 'custom'} />
                            </div>
                            <div className="ds-slot">
                                <IOSDatePicker label="Đến ngày" value={filters.to_date} onChange={val => onToggleFilter('to_date', val)} disabled={period.type !== 'custom'} />
                            </div>
                            <div className="ds-slot"><PremiumDropdown label="Đơn vị" items={meta.orgs} selectedItems={filters.org_ids} onSelect={id => onToggleFilter('org_ids', id)} isActive={activeDropdown === 'Đơn vị'} onToggle={setActiveDropdown} /></div>
                            {(reportType === 'BC008' || reportType === 'BC011' || reportType === 'BC012' || reportType === 'BC013') ? (
                                <div className="ds-slot"><PremiumDropdown label="Tài khoản" items={meta.accounts} selectedItems={filters.acc_ids} onSelect={id => onToggleFilter('acc_ids', id)} isActive={activeDropdown === 'Tài khoản'} onToggle={setActiveDropdown} /></div>
                            ) : null}
                            {reportType === 'BC007' && (
                                <div className="ds-seg">
                                    <button onClick={() => setJournalViewMode('detail')} className={`${journalViewMode === 'detail' ? 'is-on' : ''}`}>Chi tiết</button>
                                    <button onClick={() => setJournalViewMode('summary')} className={`${journalViewMode === 'summary' ? 'is-on' : ''}`}>Tổng hợp</button>
                                </div>
                            )}
                            {reportType === 'BC013' && (
                                <div className="ds-seg">
                                    <button disabled={loading} onClick={() => { if (vatSalesMode === 'detail' || loading) return; setVatSalesMode('detail'); loadReportData(1, 'detail'); }} className={`${vatSalesMode === 'detail' ? 'is-on' : ''}`}>Chi tiết</button>
                                    <button disabled={loading} onClick={() => { if (vatSalesMode === 'summary' || loading) return; setVatSalesMode('summary'); loadReportData(1, 'summary'); }} className={`${vatSalesMode === 'summary' ? 'is-on' : ''}`}>Tổng hợp</button>
                                </div>
                            )}
                            {reportType === 'BC011' ? (
                                <div className="ds-slot"><PremiumDropdown label="Đối tượng" items={meta.pr_details} selectedItems={filters.pr_detail_ids} onSelect={id => onToggleFilter('pr_detail_ids', id)} isActive={activeDropdown === 'Đối tượng'} onToggle={setActiveDropdown} /></div>
                            ) : null}
                            {reportType === 'BC012' ? (
                                <>
                                <div className="ds-slot"><PremiumDropdown label="TK đối ứng" items={meta.accounts} selectedItems={filters.contra_acc_ids} onSelect={id => onToggleFilter('contra_acc_ids', id)} isActive={activeDropdown === 'TK đối ứng'} onToggle={setActiveDropdown} /></div>
                                {/* tran_no là CHUỖI (server lọc TRAN_NO LIKE %...%). Trước 27/09/2026 gọi nhầm onToggleFilter — hàm bật/tắt

                                <input value={filters.tran_no || ''} onChange={e => { const v = e.target.value; setFilters(p => ({ ...p, tran_no: v })); }} placeholder="Số chứng từ" className="ds-input w-36" />

                            <div className="ml-auto flex items-center gap-2">

                                <button onClick={exportToPDF} disabled={reportType === 'BC012' ? cbRows.length === 0 : (reportType === 'BC006' || reportType === 'BC011') ? trialBalanceData.length === 0 : Object.keys(reportData).length === 0} className="ds-btn"><Icon name="download" size={14} stroke={2}/> PDF</button>
                                <button onClick={() => loadReportData(1)} disabled={loading} className="ds-btn ds-btn-pri">

                    </div>

                    {/* Khung bọc: lớp "đang kết xuất" nằm DƯỚI thanh lọc (thanh lọc z-[900] vẫn bấm được như trước) */}
                    <div className="flex-1 min-h-0 flex flex-col relative">
                    {loading && <div className="ds-loading"><div className="ds-loadbar"></div><div className="ds-loadpill"><Icon name="loader" size={14} className="animate-spin"/>Đang kết xuất báo cáo...</div></div>}
                    <div className="flex-1 overflow-auto custom-scrollbar ds-desk px-4 relative" ref={paperScrollRef}>

                            <div className="text-center space-y-1 mb-8">

                            </div>

                            <div className={reportType === 'BC013' ? 'overflow-hidden' : 'overflow-x-auto'}>

                                        .bc006-table .col-value { width: 11% !important; padding: 4px !important; font-size: 11px; }
                                        .bc006-table .col-code { width: 9% !important; font-size: 11px; white-space: normal; word-break: break-all; overflow-wrap: anywhere; }
                                        .bc006-table th { font-size: 10px !important; padding: 4px !important; }
                                        ${reportType === 'BC011' ? `

        // ===== BỘ LỌC NÂNG CAO (27/09/2026) — thay nút "Bộ lọc khác" xổ hàng lọc thứ 2 =====
        // items: [{ key, label, node, active, clear }] — node là JSX ô lọc CŨ của tab (props/handler giữ nguyên, chỉ đổi chỗ đặt).
        // Ô nằm trong defaultOutside (= hàng chính cũ) hiện ngoài thanh lọc; còn lại nằm trong panel. Người dùng bật/tắt (tối đa
        // FILTER_OUT_MAX) và kéo đổi thứ tự; nhớ theo tab ở localStorage['ds_filters_<tab>']. Kỳ + ô ngày luôn cố định, không nằm đây.
        const FILTER_OUT_MAX = 4;
        const readFilterCfg = (tab, keys, defaultOutside) => {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem('ds_filters_' + tab) || 'null'); } catch (e) {}
            const order = saved && Array.isArray(saved.order) ? saved.order.filter(k => keys.includes(k)) : [];
            keys.forEach(k => { if (!order.includes(k)) order.push(k); });   // ô lọc mới thêm sau → nối cuối
            const outside = (saved && Array.isArray(saved.outside) ? saved.outside : defaultOutside).filter(k => keys.includes(k)).slice(0, FILTER_OUT_MAX);
            return { order, outside };
        };
        const FilterConfigurator = ({ tab, items, defaultOutside, onApply, setActiveDropdown }) => {
            const keys = items.map(i => i.key);
            const byKey = {}; items.forEach(i => { byKey[i.key] = i; });
            const [cfg, setCfg] = useState(() => readFilterCfg(tab, keys, defaultOutside));
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState(null);
            const [cfgOpen, setCfgOpen] = useState(() => { try { return localStorage.getItem('ds_filters_cfg_open') !== '0'; } catch (e) { return true; } });
            const [dragKey, setDragKey] = useState(null);   // chỉ để tô dòng đang kéo
            const dragRef = useRef(null);                   // ô đang kéo — ref vì dragover tới liền sau dragstart, state chưa kịp cập nhật
            const btnRef = useRef(null), panelRef = useRef(null);
            const order = cfg.order.filter(k => byKey[k]);
            const outside = order.filter(k => cfg.outside.includes(k));
            const hidden = order.filter(k => !cfg.outside.includes(k));
            const hiddenActive = hidden.filter(k => byKey[k].active).length;
            const save = next => { setCfg(next); try { localStorage.setItem('ds_filters_' + tab, JSON.stringify(next)); } catch (e) {} };
            const place = () => {
                const b = btnRef.current; if (!b) return;
                const r = b.getBoundingClientRect(), w = Math.min(760, window.innerWidth - 32);
                setPos({ top: r.bottom + 8, left: Math.max(16, Math.min(r.left, window.innerWidth - w - 16)), width: w });
            };
            const close = () => { setActiveDropdown(null); setOpen(false); };
            useEffect(() => {
                if (!open) return;
                const onDown = e => { if ((panelRef.current && panelRef.current.contains(e.target)) || (btnRef.current && btnRef.current.contains(e.target))) return; close(); };
                const onKey = e => { if (e.key === 'Escape') close(); };
                window.addEventListener('resize', place);
                document.addEventListener('mousedown', onDown);
                document.addEventListener('keydown', onKey);
                return () => { window.removeEventListener('resize', place); document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
            }, [open]);
            const switchOut = k => {
                const on = cfg.outside.includes(k);
                if (!on && cfg.outside.length >= FILTER_OUT_MAX) return;
                save({ ...cfg, outside: on ? cfg.outside.filter(x => x !== k) : [...cfg.outside, k] });
            };
            const moveOver = overKey => {
                const dk = dragRef.current;
                if (!dk || dk === overKey) return;
                const next = order.filter(k => k !== dk);
                next.splice(order.indexOf(overKey), 0, dk);
                save({ ...cfg, order: next });
            };
            const toggleCfg = () => { const v = !cfgOpen; setCfgOpen(v); try { localStorage.setItem('ds_filters_cfg_open', v ? '1' : '0'); } catch (e) {} };
            return (
                <>
                    {outside.map(k => <div key={k} className="ds-slot">{byKey[k].node}</div>)}
                    <button ref={btnRef} type="button" onClick={() => { if (open) close(); else { place(); setActiveDropdown(null); setOpen(true); } }}
                            title="Bộ lọc nâng cao — chọn ô lọc hiện ra ngoài"
                            className={`ds-chip ${open || hiddenActive > 0 ? 'is-on' : ''} ${open ? 'is-open' : ''}`}>
                        <Icon name="sliders" size={14} stroke={2}/>
                        <span>Bộ lọc khác</span>
                        {hiddenActive > 0 && <span className="ds-badge">{hiddenActive}</span>}
                        <Icon name={open ? 'chevron-up' : 'chevron-down'} size={12} stroke={2}/>
                    </button>
                    {open && pos && (
                        <div ref={panelRef} className="ds-pop ds-pop-in ds-afp" style={{ top: pos.top, left: pos.left, width: pos.width }} role="dialog" aria-label="Bộ lọc nâng cao">
                            <div className="ds-afp-head">
                                <Icon name="sliders" size={16} stroke={2}/>
                                <b>Bộ lọc nâng cao</b>
                                <button type="button" className="ds-afp-link" disabled={hiddenActive === 0} onClick={() => hidden.forEach(k => byKey[k].active && byKey[k].clear())}>Xoá tất cả</button>
                                <button type="button" className="ds-iconbtn" onClick={close} title="Đóng (Esc)"><Icon name="x" size={16} stroke={2}/></button>
                            </div>
                            <div className="ds-afp-body">
                                {hidden.length > 0
                                    ? <div className="ds-afp-grid">{hidden.map(k => <div key={k}>{byKey[k].node}</div>)}</div>
                                    : <div className="ds-afp-empty">Mọi ô lọc đang hiện ngoài thanh lọc. Tắt bớt ở phần cấu hình bên dưới để đưa vào đây.</div>}
                            </div>
                            <div className="ds-afp-cfg">
                                <button type="button" className="ds-afp-cfghead" onClick={toggleCfg} aria-expanded={cfgOpen}>
                                    <b>Cấu hình tham số lọc</b>
                                    <span className="ds-badge is-soft">{outside.length}</span>
                                    <span>tối đa chọn {FILTER_OUT_MAX} ô lọc để đưa ra bên ngoài</span>
                                    <Icon name={cfgOpen ? 'chevron-up' : 'chevron-down'} size={14} stroke={2}/>
                                </button>
                                {cfgOpen && (
                                    <>
                                        <div className="ds-afp-hint">Bật để hiện ngoài, kéo để đổi thứ tự</div>
                                        <div className="ds-afp-list custom-scrollbar">
                                            {order.map(k => {
                                                const on = cfg.outside.includes(k);
                                                const full = !on && cfg.outside.length >= FILTER_OUT_MAX;
                                                return (
                                                    <div key={k} draggable className={`ds-afp-row ${dragKey === k ? 'is-drag' : ''}`}
                                                         onDragStart={e => { dragRef.current = k; setDragKey(k); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('application/x-ds-filter', k); }}
                                                         onDragOver={e => { if (!dragRef.current) return; e.preventDefault(); moveOver(k); }}
                                                         onDrop={e => e.preventDefault()}
                                                         onDragEnd={() => { dragRef.current = null; setDragKey(null); }}>
                                                        <Icon name="grip" size={16} stroke={2}/>
                                                        <span className={on ? 'is-on' : ''}>{byKey[k].label}</span>
                                                        <button type="button" role="switch" aria-checked={on} aria-label={`Hiện "${byKey[k].label}" ngoài thanh lọc`} disabled={full}
                                                                title={full ? `Đã đủ ${FILTER_OUT_MAX} ô lọc bên ngoài — tắt bớt một ô trước` : ''}
                                                                onClick={() => switchOut(k)} className={`ds-switch ${on ? 'is-on' : ''}`}><i></i></button>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </>
                                )}
                            </div>
                            <div className="ds-afp-foot">
                                <button type="button" className="ds-btn" onClick={close}>Đóng</button>
                                <button type="button" className="ds-btn ds-btn-pri" onClick={() => { close(); onApply(); }}>Lọc</button>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        const NAV_DOC_META = {

        // Server-Timing "count;dur=6123.4, page;dur=…, mode;desc="offset,parallel"" → { count: 6123.4, …, mode: 'offset,parallel' } (ms)
        const parseServerTiming = (h) => {
            const out = {};
            (h || '').split(',').forEach(part => {
                const [name, ...kv] = part.trim().split(';');
                if (!name) return;
                kv.forEach(x => { const [k, v] = x.split('='); if (k === 'dur') out[name] = Number(v); if (k === 'desc') out[name] = (v || '').replace(/"/g, ''); });
            });
            return out;
        };
        const fmtSec = ms => (Math.max(0, ms || 0) / 1000).toLocaleString('vi-VN', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' s';
        // Thời gian lần Truy vấn sổ cái gần nhất: tổng · SQL · tải + đọc · vẽ; rê chuột xem đủ từng khâu (đo tốc độ trên DB thật).
        const QueryTiming = ({ t }) => {
            const mode = t.mode || '';
            const parallel = mode.includes('parallel'), reuse = mode.includes('count-reuse');
            const sql = reuse ? (t.page || 0) : parallel ? Math.max(t.count || 0, t.page || 0) : (t.count || 0) + (t.page || 0);
            const detail = [
                reuse ? 'SQL đếm + cộng tổng: dùng lại (bộ lọc không đổi)' : `SQL đếm + cộng tổng: ${fmtSec(t.count)}${parallel ? ' (chạy song song)' : ''}`,
                `SQL lấy trang: ${fmtSec(t.page)} (${mode.includes('offset') ? 'OFFSET/FETCH' : 'ROW_NUMBER'})`,
                `Máy chủ dựng dòng: ${fmtSec(t.build)} · đóng JSON: ${fmtSec(t.json)}${t.gzip ? ` · nén: ${fmtSec(t.gzip)}` : ''}`,
                `Chờ máy chủ (gồm các khâu trên): ${fmtSec(t.wait)}`,

        const AppStatusBar = ({ meta, filters, appVersion, timing }) => (

                    <span>Kỳ {filters.from_date} – {filters.to_date}</span>
                    <span>{appVersion}</span>
                </div>
            </div>
        );

        
        const PageSizeDropdown = ({ value, onChange }) => {
            const [open, setOpen] = useState(false);
            const ref = React.useRef(null);
            
            React.useEffect(() => {
                const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                if (open) document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [open]);

            const options = [
                { value: 1000, label: '1,000 dòng' },
                { value: 10000, label: '10,000 dòng' },
                { value: 50000, label: '50,000 dòng' },
                { value: 100000, label: '100,000 dòng' },
                { value: 200000, label: '200,000 dòng' },
                { value: 500000, label: '500,000 dòng' },
            ];

            return (
                <div className="relative" ref={ref}>
                    <button type="button" onClick={() => setOpen(!open)} className={`ds-chip ${open ? 'is-open' : ''}`}>

                        <span className="tabular-nums">{value.toLocaleString()}</span>

                    </button>
                    {open && (
                        <div className="ds-pop ds-pop-in absolute top-full mt-1.5 right-0 z-[6000] min-w-[140px] p-1">
                            {options.map(opt => (
                                <div
                                    key={opt.value}
                                    onClick={() => { onChange(opt.value); setOpen(false); }}
                                    className={`ds-opt tabular-nums ${value === opt.value ? 'is-sel' : ''}`}

                                    <span className="flex-1">{opt.label}</span>

        };

        const App = () => {
            const appVersion = useAppVersion();   // lấy từ /api/version — hiện ở màn hình login + header
            const autoUpdate = useAutoUpdate();   // kiểm tra + tự cập nhật bản mới từ GitHub Releases
            const [groupByPurchase, setGroupByPurchase] = useState([]);
            const [toggleGroupRenderPurchase, setToggleGroupRenderPurchase] = useState(0);
            const purchaseScrollRef = useRef();

            const [groupByWarehouse, setGroupByWarehouse] = useState([]);
            const [toggleGroupRenderWarehouse, setToggleGroupRenderWarehouse] = useState(0);
            const warehouseScrollRef = useRef();
            const [groupByLedger, setGroupByLedger] = useState([]);
            const [toggleGroupRender, setToggleGroupRender] = useState(0); // Để ép update khi toggle expand
            const ledgerScrollRef = useRef();
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('ledger');
            const [data, setData] = useState([]);
            const [reportData, setReportData] = useState({});
            const [monthList, setMonthList] = useState([]);
            const [monthlyData, setMonthlyData] = useState({});
            const [jobList, setJobList] = useState([]);
            const [jobData, setJobData] = useState({});
            const [reportType, setReportType] = useState('BC005');
            const [trialBalanceData, setTrialBalanceData] = useState([]);
            const [cashBookData, setCashBookData] = useState({ rows: [], pagination: { total_rows: 0, total_pages: 1, page: 1 } });
        const [vatSalesTotals, setVatSalesTotals] = useState({ total_amount_item: 0, taxable_amount_item: 0, total_vat_amount: 0 });
        const [vatSalesMode, setVatSalesMode] = useState('detail');
        const [journalViewMode, setJournalViewMode] = useState('detail');
            const [trialBalanceTotal, setTrialBalanceTotal] = useState(null);
            const [pendingReportType, setPendingReportType] = useState(null);
            const [showClearModal, setShowClearModal] = useState(false);
            const [noticeModal, setNoticeModal] = useState(null); // { title: string, message: string }
            const showNotice = (message, title = 'Thông báo') => setNoticeModal({ title, message });
            const [meta, setMeta] = useState({ accounts: [], orgs: [], pr_details: [], tran_ids: [], jobs: [], items: [], products: [], expenses: [], warehouses: [], db_info: {}, global_total: 0 });
            const [loading, setLoading] = useState(false);
            const [loginLoading, setLoginLoading] = useState(false);
            const [loginError, setLoginError] = useState("");
            const [showPw, setShowPw] = useState(false);   // nút con mắt ở ô Mật khẩu (chỉ đổi type input)
            const [activeDropdown, setActiveDropdown] = useState(null);
            const [period, setPeriod] = useState({ year: 2026, type: 'month', value: 1 });
            const [queryTiming, setQueryTiming] = useState(null);   // đo lần Truy vấn sổ cái gần nhất (thanh trạng thái)
            const ledgerCountKeyRef = useRef('');   // bộ lọc của lần ĐẾM tổng gần nhất — trùng thì dùng lại tổng
            const [filters, setFilters] = useState({ from_date: '01/01/2026',to_date: '31/01/2026', tran_ids: [], org_ids: [], acc_ids: [], contra_acc_ids: [], job_ids: [], pr_detail_ids: [], item_ids: [], product_ids: [], expense_ids: [], tran_no: '', page: 1, page_size: 10000 });
            const [pagination, setPagination] = useState({ total_rows: 0, total_pages: 1, page: 1 });
            const [summary, setSummary] = useState({ total_debit: 0, total_credit: 0 });
            const [colSearch, setColSearch] = useState({});
            const [refreshing, setRefreshing] = useState(false);
            // Thanh bên thu gọn: nhớ theo máy (localStorage có thể bị chặn → bọc try)
            const [sidebarCollapsed, setSidebarCollapsed] = useState(() => { try { return localStorage.getItem('ds_sidebar_collapsed') === '1'; } catch (e) { return false; } });
            const toggleSidebar = useCallback(() => setSidebarCollapsed(v => {
